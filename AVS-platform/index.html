<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kawaii Coffee Experience</title>

    <!-- 引入 Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- 引入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 配置 Tailwind 主题颜色 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'sky-top': '#E0F7FA',
                        'sky-bottom': '#B3E5FC',
                        'kawaii-blue': '#81D4FA',
                        'kawaii-dark': '#222222',
                        'btn-black': '#1A1A1A',
                        'btn-blue': '#4FC3F7',
                    },
                    fontFamily: {
                        'fredoka': ['Fredoka', 'sans-serif'],
                        'nunito': ['Nunito', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* 全局样式 */
        body {
            background: linear-gradient(180deg, #E0F7FA 0%, #B3E5FC 100%);
            font-family: 'Nunito', sans-serif;
            overflow: hidden; /* 防止滚动条 */
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        /* 云朵背景纹理 (可选，增加层次感) */
        .cloud-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 50 Q 40 30 50 50 T 70 50' fill='none' stroke='white' stroke-opacity='0.3' stroke-width='2'/%3E%3C/svg%3E");
            opacity: 0.4;
            z-index: -1;
            pointer-events: none;
        }

        /* 浮动动画关键帧 */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @keyframes float-delayed {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        /* 气泡通用样式 */
        .bubble {
            position: absolute;
            padding: 6px 14px;
            border-radius: 999px; /* Pill shape */
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            z-index: 10;
            white-space: nowrap;
        }

        /* 各个气泡的具体位置和动画 */
        .bubble-super {
            top: 25%;
            left: 5%;
            background: white;
            color: #333;
            animation: float 3s ease-in-out infinite;
        }

        .bubble-face-yellow {
            top: 22%;
            right: 15%;
            background: #FFF59D; /* Light Yellow */
            color: #333;
            font-family: monospace;
            animation: float-delayed 4s ease-in-out infinite;
        }

        .bubble-fantastic {
            top: 50%;
            left: -5%;
            background: #FCE4EC; /* Light Pink */
            color: #333;
            transform: rotate(-10deg);
            animation: float 3.5s ease-in-out infinite 0.5s;
        }

        .bubble-perfect {
            bottom: 25%;
            left: 5%;
            background: #BBDEFB; /* Light Blue */
            color: white;
            transform: rotate(10deg);
            animation: float-delayed 3s ease-in-out infinite 1s;
        }

        .bubble-face-white {
            bottom: 20%;
            right: 10%;
            background: white;
            color: #555;
            transform: rotate(-5deg);
            animation: float 4s ease-in-out infinite 0.2s;
        }

        /* 猫咪杯子占位符样式 (如果没有图片，用CSS画一个示意) */
        .cat-cup-container {
            position: relative;
            width: 260px;
            height: 260px;
            margin-top: 20px;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.15));
            transition: transform 0.3s ease;
        }

        /* 按钮交互 */
        .cta-button {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .cta-button:active {
            transform: scale(0.98);
        }
        .cta-button:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

    </style>
</head>
<body>

    <!-- 背景装饰 -->
    <div class="cloud-bg"></div>

    <!-- A. 顶部标题区 -->
    <header class="w-full pt-12 pb-4 text-center z-20">
        <p class="text-[#333] text-xs font-bold tracking-[0.2em] uppercase mb-2 font-nunito">
            It's Time For
        </p>
        <div class="flex flex-col items-center leading-tight">
            <div class="flex items-center justify-center gap-2 mb-1">
                <span class="bg-kawaii-blue text-white px-3 py-1 rounded-xl text-3xl font-fredoka font-bold shadow-sm">
                    Kawaii
                </span>
                <span class="text-kawaii-dark text-4xl font-fredoka font-bold">
                    Coffee
                </span>
            </div>
            <h1 class="text-kawaii-dark text-4xl font-fredoka font-bold mt-[-5px]">
                Experience
            </h1>
        </div>
    </header>

    <!-- B. 核心视觉区 -->
    <main class="relative w-full flex-grow flex items-center justify-center">

        <!-- 装饰气泡 -->
        <div class="bubble bubble-super font-nunito">Super!</div>
        <div class="bubble bubble-face-yellow text-lg">(&gt;‿&lt;)</div>
        <div class="bubble bubble-fantastic font-nunito">Fantastic</div>
        <div class="bubble bubble-perfect font-nunito">Perfect!</div>
        <div class="bubble bubble-face-white text-lg">(•‿•)</div>

        <!-- 猫咪咖啡杯主体 -->
        <!-- 注意：这里使用SVG绘制了一个简单的示意图。实际开发中请替换为 <img src="your-3d-cup.png" class="w-full h-auto object-contain"> -->
        <div class="cat-cup-container flex items-center justify-center">
             <!-- SVG Placeholder for the Cat Cup -->
             <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full drop-shadow-xl">
                <!-- Ears -->
                <path d="M40 70 L20 20 L80 50 Z" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2"/>
                <path d="M45 60 L30 30 L70 50 Z" fill="#FFAB91"/> <!-- Inner Ear Left -->

                <path d="M160 70 L180 20 L120 50 Z" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2"/>
                <path d="M155 60 L170 30 L130 50 Z" fill="#FFAB91"/> <!-- Inner Ear Right -->

                <!-- Cup Body -->
                <ellipse cx="100" cy="140" rx="75" ry="60" fill="#FFFFFF"/>
                <!-- Cup Top Rim (Coffee inside) -->
                <ellipse cx="100" cy="80" rx="75" ry="25" fill="#8D6E63"/> <!-- Coffee Color -->
                <ellipse cx="100" cy="80" rx="70" ry="22" fill="#A1887F"/> <!-- Latte Art Base -->
                <!-- Simple Latte Art Swirl -->
                <path d="M80 80 Q 100 60 120 80 T 80 80" stroke="#EFEBE9" stroke-width="3" fill="none" opacity="0.6"/>

                <!-- Face -->
                <circle cx="75" cy="130" r="6" fill="#333"/> <!-- Left Eye -->
                <circle cx="125" cy="130" r="6" fill="#333"/> <!-- Right Eye -->
                <ellipse cx="100" cy="140" rx="4" ry="3" fill="#333"/> <!-- Nose -->
                <path d="M90 148 Q 100 155 110 148" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/> <!-- Mouth -->

                <!-- Cheeks -->
                <ellipse cx="60" cy="140" rx="8" ry="5" fill="#FFCDD2" opacity="0.6"/>
                <ellipse cx="140" cy="140" rx="8" ry="5" fill="#FFCDD2" opacity="0.6"/>
             </svg>
        </div>

    </main>

    <!-- C. 底部操作区 -->
    <footer class="w-full pb-10 px-6 flex justify-center z-20">
        <button class="cta-button w-[85%] h-[60px] bg-btn-black rounded-full flex items-center justify-between px-2 pr-2 shadow-lg">
            <!-- Text Area -->
            <span class="text-white text-lg font-semibold font-nunito ml-6">Get Started</span>

            <!-- Icon Area -->
            <div class="w-[48px] h-[48px] bg-btn-blue rounded-full flex items-center justify-center shadow-md">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                </svg>
            </div>
        </button>
    </footer>

</body>
</html>
