<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1a120e" />
    <title>暗棋 · 專業競技版</title>
    <style>
        /* ----- 全域重置 & 安全區 ----- */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            user-select: none;
            -webkit-user-select: none;
        }
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #1a120e;
            touch-action: none;
            /* 禁用瀏覽器默認觸控行為 */;
        }
        body {
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        /* ----- 根容器：置中 + 漸層背景 ----- */
        #root {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 50% 30%, #2d1e14, #120c08);
        }

        /* ----- 遊戲容器：強制 4:8 比例 ----- */
        #game-container {
            position: relative;
            aspect-ratio: 4 / 8;
            max-height: 100vh;
            width: min(100vw, calc(100vh * 4 / 8));
            background: #241810;
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 215, 140, 0.08);
            padding: clamp(8px, 2.5vw, 20px);
            touch-action: none;
        }

        /* ----- Canvas：填滿容器 ----- */
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            background: #2a1c12;
            box-shadow: inset 0 4px 30px rgba(0, 0, 0, 0.6);
            touch-action: none;
            cursor: pointer;
        }

        /* ----- 頂部訊息欄（覆蓋在 Canvas 上方） ----- */
        #top-bar {
            position: absolute;
            top: clamp(12px, 3vh, 28px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: clamp(10px, 2.5vw, 24px);
            background: rgba(20, 14, 10, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 6px clamp(14px, 3vw, 28px);
            border-radius: 40px;
            border: 1px solid rgba(200, 170, 130, 0.15);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 10;
            pointer-events: none;
            white-space: nowrap;
        }
        #turn-indicator {
            font-size: clamp(0.8rem, 2.5vw, 1.4rem);
            font-weight: 700;
            letter-spacing: 1px;
            color: #d0c0a8;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }
        #turn-indicator .highlight-red {
            color: #e74c3c;
        }
        #turn-indicator .highlight-black {
            color: #b0b0b0;
        }
        #status-badge {
            font-size: clamp(0.6rem, 1.6vw, 0.9rem);
            padding: 2px 12px;
            border-radius: 20px;
            background: rgba(255, 215, 140, 0.12);
            border: 1px solid rgba(255, 215, 140, 0.15);
            color: #b8a898;
            letter-spacing: 0.5px;
        }

        /* ----- 重新按鈕（右下） ----- */
        #reset-btn {
            position: absolute;
            bottom: clamp(14px, 3vh, 28px);
            right: clamp(14px, 3vw, 28px);
            z-index: 10;
            background: rgba(30, 22, 16, 0.75);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(200, 170, 130, 0.2);
            color: #d0c0a8;
            font-size: clamp(1.2rem, 3vw, 2rem);
            width: clamp(42px, 10vw, 64px);
            height: clamp(42px, 10vw, 64px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            touch-action: manipulation;
            pointer-events: auto;
        }
        #reset-btn:active {
            transform: scale(0.92);
            background: rgba(60, 44, 32, 0.8);
        }

        /* ----- 勝利覆蓋層 (由 Canvas 繪製，此為備用) ----- */
        .victory-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            gap: 8px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .victory-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .victory-text {
            font-size: clamp(2.2rem, 10vw, 4.5rem);
            font-weight: 900;
            letter-spacing: 6px;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.9);
        }
        .victory-red {
            color: #ff6b6b;
        }
        .victory-black {
            color: #d0d0d0;
        }
        .victory-sub {
            font-size: clamp(0.8rem, 3vw, 1.2rem);
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
        }

        /* ----- 工具類 ----- */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="root">
        <div id="game-container">
            <!-- Canvas 遊戲主區域 -->
            <canvas id="gameCanvas"></canvas>

            <!-- 頂部狀態欄 -->
            <div id="top-bar">
                <span id="turn-indicator">⚔️ <span class="highlight-red">紅方</span></span>
                <span id="status-badge">● 對弈中</span>
            </div>

            <!-- 重新按鈕 -->
            <button id="reset-btn" aria-label="重新新局">⟳</button>

            <!-- 勝利覆蓋層 (由 JS 控制顯示) -->
            <div id="victoryOverlay" class="victory-overlay">
                <div id="victoryTitle" class="victory-text victory-red">紅方勝利</div>
                <div class="victory-sub">點擊任意處繼續</div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  1. 常數與工具函數
        // ============================================================
        const COLS = 4;
        const ROWS = 8;
        const TOTAL = 32;

        const RANK_MAP = {
            '帅': 7,
            '将': 7,
            '仕': 6,
            '士': 6,
            '相': 5,
            '象': 5,
            '俥': 4,
            '车': 4,
            '傌': 3,
            '马': 3,
            '炮': 2,
            '包': 2,
            '兵': 1,
            '卒': 1
        };

        // 紅黑陣容 (各16顆)
        const RED_ROSTER = [
            { name: '帅', count: 1 },
            { name: '仕', count: 2 },
            { name: '相', count: 2 },
            { name: '俥', count: 2 },
            { name: '傌', count: 2 },
            { name: '炮', count: 2 },
            { name: '兵', count: 5 }
        ];
        const BLACK_ROSTER = [
            { name: '将', count: 1 },
            { name: '士', count: 2 },
            { name: '象', count: 2 },
            { name: '车', count: 2 },
            { name: '马', count: 2 },
            { name: '包', count: 2 },
            { name: '卒', count: 5 }
        ];

        function buildDeck(roster, color) {
            const pieces = [];
            roster.forEach(({ name, count }) => {
                for (let i = 0; i < count; i++) {
                    pieces.push({
                        name,
                        color,
                        rank: RANK_MAP[name],
                        isHidden: true,
                    });
                }
            });
            return pieces;
        }

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function idxToColRow(idx) {
            return { col: idx % COLS, row: Math.floor(idx / COLS) };
        }

        function colRowToIdx(col, row) {
            if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return -1;
            return row * COLS + col;
        }

        function isOnBoard(col, row) {
            return col >= 0 && col < COLS && row >= 0 && row < ROWS;
        }

        // ============================================================
        //  2. 遊戲狀態
        // ============================================================
        const GameState = {
            WAITING: 'waiting',
            PLAYING: 'playing',
            ANIMATING: 'animating',
            GAMEOVER: 'gameover'
        };

        let board = [];
        let turn = null; // 'red' | 'black'
        let currentPlayer = null; // 'red' | 'black'
        let selectedIndex = null;
        let gameState = GameState.WAITING;
        let moveHistory = [];
        let flippedCount = 0;

        // 動畫狀態
        let animQueue = [];
        let isAnimating = false;

        // ============================================================
        //  3. DOM 參考 & Canvas 設置
        // ============================================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const turnIndicator = document.getElementById('turn-indicator');
        const statusBadge = document.getElementById('status-badge');
        const victoryOverlay = document.getElementById('victoryOverlay');
        const victoryTitle = document.getElementById('victoryTitle');

        let canvasW = 0;
        let canvasH = 0;
        let cellSize = 0;
        let padding = 0;

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            canvas.style.width = rect.width + 'px';
            canvas.style.height = rect.height + 'px';
            canvasW = canvas.width;
            canvasH = canvas.height;
            cellSize = canvasW / COLS;
            padding = cellSize * 0.06;
            ctx.scale(dpr, dpr);
            // 重繪
            render();
        }

        // ============================================================
        //  4. 音效 (Web Audio)
        // ============================================================
        let audioCtx = null;

        function getAudioCtx() {
            if (!audioCtx) {
                audioCtx = new(window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }

        function playTone(freq, duration, type = 'square', volume = 0.15) {
            try {
                const ctx = getAudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = freq;
                osc.type = type;
                gain.gain.setValueAtTime(volume, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + duration);
            } catch (_) { /* 靜默降級 */ }
        }

        function soundFlip() { playTone(880, 0.10, 'square', 0.12); }

        function soundCapture() { playTone(320, 0.15, 'sawtooth', 0.18); }

        function soundIllegal() { playTone(180, 0.12, 'sawtooth', 0.10); }

        function soundWin() { playTone(660, 0.12);
            setTimeout(() => playTone(880, 0.15), 130); }

        // ============================================================
        //  5. 棋盤初始化 (Fisher-Yates)
        // ============================================================
        function initGame() {
            // 組建紅黑牌堆
            const redDeck = buildDeck(RED_ROSTER, 'red');
            const blackDeck = buildDeck(BLACK_ROSTER, 'black');
            const deck = shuffle([...redDeck, ...blackDeck]);

            board = deck.map((p, idx) => ({
                ...p,
                id: `${p.color}_${idx}`,
                idx: idx,
                isHidden: true,
            }));

            turn = null;
            currentPlayer = null;
            selectedIndex = null;
            gameState = GameState.WAITING;
            moveHistory = [];
            flippedCount = 0;
            victoryOverlay.classList.remove('show');
            animQueue = [];
            isAnimating = false;
            updateUI();
            render();
        }

        // ============================================================
        //  6. 繪圖引擎 (Canvas)
        // ============================================================
        function render() {
            const w = canvasW;
            const h = canvasH;
            ctx.clearRect(0, 0, w, h);

            // ---- 棋盤底色 ----
            const grad = ctx.createRadialGradient(w * 0.5, h * 0.4, 0, w * 0.5, h * 0.4, w * 0.7);
            grad.addColorStop(0, '#3d2b1e');
            grad.addColorStop(1, '#1f140e');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            // ---- 畫格線 ----
            ctx.strokeStyle = 'rgba(180,150,110,0.2)';
            ctx.lineWidth = 1.5;
            for (let r = 0; r <= ROWS; r++) {
                ctx.beginPath();
                ctx.moveTo(0, r * cellSize);
                ctx.lineTo(w, r * cellSize);
                ctx.stroke();
            }
            for (let c = 0; c <= COLS; c++) {
                ctx.beginPath();
                ctx.moveTo(c * cellSize, 0);
                ctx.lineTo(c * cellSize, h);
                ctx.stroke();
            }

            // ---- 繪製棋子 ----
            for (let i = 0; i < TOTAL; i++) {
                const piece = board[i];
                if (!piece) continue;
                const { col, row } = idxToColRow(i);
                const cx = col * cellSize + cellSize / 2;
                const cy = row * cellSize + cellSize / 2;
                const radius = cellSize * 0.38;

                // 選中呼吸光暈
                if (selectedIndex === i && gameState === GameState.PLAYING) {
                    const breath = 0.5 + 0.5 * Math.sin(Date.now() / 300);
                    const glow = ctx.createRadialGradient(cx, cy, radius * 0.2, cx, cy, radius * 1.6);
                    glow.addColorStop(0, `rgba(255,215,0,${0.15 * breath})`);
                    glow.addColorStop(1, 'rgba(255,215,0,0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(cx, cy, radius * 1.6, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 蓋牌
                if (piece.isHidden) {
                    // 背面木紋
                    const grad2 = ctx.createRadialGradient(cx - radius * 0.3, cy - radius * 0.3, 2, cx, cy, radius);
                    grad2.addColorStop(0, '#6b4f36');
                    grad2.addColorStop(0.7, '#3d2b1a');
                    grad2.addColorStop(1, '#241810');
                    ctx.fillStyle = grad2;
                    ctx.shadowColor = 'rgba(0,0,0,0.5)';
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    // 邊框
                    ctx.strokeStyle = 'rgba(160,130,90,0.3)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                    ctx.stroke();
                    // 問號
                    ctx.fillStyle = 'rgba(200,180,150,0.2)';
                    ctx.font = `${radius * 0.9}px "Inter", sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('♟', cx, cy + 2);
                    continue;
                }

                // ---- 正面棋子 ----
                // 陰影
                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.shadowBlur = 12;
                ctx.shadowOffsetY = 3;

                // 棋子底色 (紅/黑)
                const isRed = piece.color === 'red';
                const baseColor = isRed ? '#c0392b' : '#2c2c2c';
                const lightColor = isRed ? '#e74c3c' : '#4a4a4a';
                const darkColor = isRed ? '#922b21' : '#1a1a1a';

                const grad3 = ctx.createRadialGradient(cx - radius * 0.3, cy - radius * 0.3, 2, cx, cy, radius);
                grad3.addColorStop(0, lightColor);
                grad3.addColorStop(0.6, baseColor);
                grad3.addColorStop(1, darkColor);
                ctx.fillStyle = grad3;
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;

                // 高光
                ctx.fillStyle = 'rgba(255,255,255,0.08)';
                ctx.beginPath();
                ctx.arc(cx - radius * 0.2, cy - radius * 0.25, radius * 0.35, 0, Math.PI * 2);
                ctx.fill();

                // 邊框
                ctx.strokeStyle = isRed ? 'rgba(255,200,150,0.4)' : 'rgba(200,200,200,0.25)';
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                ctx.stroke();

                // 文字
                ctx.shadowColor = 'rgba(0,0,0,0.6)';
                ctx.shadowBlur = 6;
                ctx.fillStyle = isRed ? '#fff5e6' : '#e8e8e8';
                ctx.font = `bold ${radius * 1.0}px "Inter","Noto Sans TC","PingFang SC",sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(piece.name, cx, cy + 1);
                ctx.shadowBlur = 0;

                // 等級小字 (炮/包特殊標記)
                if (piece.name === '炮' || piece.name === '包') {
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.font = `${radius * 0.35}px sans-serif`;
                    ctx.fillText('●', cx + radius * 0.6, cy - radius * 0.6);
                }
            }

            // ---- 合法走法提示 (簡易) ----
            if (selectedIndex !== null && gameState === GameState.PLAYING) {
                const piece = board[selectedIndex];
                if (piece && !piece.isHidden) {
                    const moves = getLegalMoves(selectedIndex);
                    moves.forEach(idx => {
                        const { col, row } = idxToColRow(idx);
                        const cx2 = col * cellSize + cellSize / 2;
                        const cy2 = row * cellSize + cellSize / 2;
                        ctx.fillStyle = 'rgba(100,220,100,0.25)';
                        ctx.beginPath();
                        ctx.arc(cx2, cy2, cellSize * 0.15, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = 'rgba(100,220,100,0.15)';
                        ctx.beginPath();
                        ctx.arc(cx2, cy2, cellSize * 0.28, 0, Math.PI * 2);
