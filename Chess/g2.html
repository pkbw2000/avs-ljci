<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>大師級暗棋 · 沉浸微光版</title>
<style>
  :root {
    --bg-gradient: radial-gradient(circle at 50% 30%, #1a1c23 0%, #0d0e12 100%);
    --board-bg: #1e2026;
    --cell-bg: #16171c;
    --stone-unrevealed: linear-gradient(135deg, #424755 0%, #232731 100%);
    --red-glow: 0 0 15px rgba(239, 68, 68, 0.6);
    --black-glow: 0 0 15px rgba(59, 130, 246, 0.6);
  }

  body { 
    margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; background: var(--bg-gradient); color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    touch-action: manipulation; overflow: hidden;
  }

  /* 高級高級感頂部 HUD */
  #hud {
    width: 88vw; max-width: 380px; display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; padding: 12px 16px; background: rgba(30, 32, 38, 0.8);
    backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .hud-box { display: flex; flex-direction: column; gap: 4px; }
  .hud-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
  .hud-val { font-size: 1rem; font-weight: 700; transition: all 0.3s; }
  #turn-indicator { padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; animation: pulse 2s infinite; }

  /* 豎屏 4x8 空間棋盤 */
  #board {
    display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(8, 1fr);
    gap: 8px; background: var(--board-bg); padding: 12px; border-radius: 24px;
    width: 88vw; max-width: 380px; aspect-ratio: 4 / 8;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.03);
  }
  .cell {
    background: var(--cell-bg); border-radius: 12px; display: flex; 
    justify-content: center; align-items: center; position: relative;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
  }

  /* 棋子頂級微動效設計 */
  .piece {
    width: 86%; height: 86%; border-radius: 50%; display: flex; 
    justify-content: center; align-items: center; font-size: 1.5rem; font-weight: 800; 
    cursor: pointer; user-select: none; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s, background 0.3s;
  }
  
  /* 未翻開：神祕暗紋石塊 */
  .unrevealed { 
    background: var(--stone-unrevealed); 
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 4px 8px rgba(0,0,0,0.4), inset 0 2px 3px rgba(255,255,255,0.1);
  }
  .unrevealed::after {
    content: ''; width: 30%; height: 30%; border-radius: 50%; background: rgba(255,255,255,0.03);
  }
  .unrevealed:active { transform: scale(0.92); }

  /* 已翻開：立體玉石質感 */
  .revealed { 
    background: #1e222b;
    border: 2px solid currentColor;
    text-shadow: 0 0 6px currentColor;
  }
  .red { color: #f87171; box-shadow: 0 4px 10px rgba(239, 68, 68, 0.2), inset 0 2px 4px rgba(255,255,255,0.05); }
  .black { color: #60a5fa; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.2), inset 0 2px 4px rgba(255,255,255,0.05); }
  
  /* 高階交互狀態 */
  .selected { 
    transform: scale(1.12) translateY(-4px); 
  }
  .selected.red { box-shadow: var(--red-glow), 0 10px 20px rgba(239, 68, 68, 0.3); }
  .selected.black { box-shadow: var(--black-glow), 0 10px 20px rgba(59, 130, 246, 0.3); }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.85; transform: scale(0.98); }
  }
</style>
</head>
<body>

<div id="hud">
  <div class="hud-box">
    <span class="hud-label">陣營配置</span>
    <span id="status" class="hud-val" style="color: #cbd5e1;">點擊棋子開局</span>
  </div>
  <div id="turn-indicator" style="background: rgba(255,255,255,0.05); color: #94a3b8;">初始化中</div>
</div>

<div id="board"></div>

<script>
const PIECES = {
  R_K: { name: '帥', color: 'red', rank: 7 }, R_A: { name: '仕', color: 'red', rank: 6 },
  R_E: { name: '相', color: 'red', rank: 5 }, R_R: { name: '俥', color: 'red', rank: 4 },
  R_H: { name: '傌', color: 'red', rank: 3 }, R_C: { name: '炮', color: 'red', rank: 2 },
  R_P: { name: '兵', color: 'red', rank: 1 }, B_K: { name: '將', color: 'black', rank: 7 },
  B_A: { name: '士', color: 'black', rank: 6 }, B_E: { name: '象', color: 'black', rank: 5 },
  B_R: { name: '車', color: 'black', rank: 4 }, B_H: { name: '馬', color: 'black', rank: 3 },
  B_C: { name: '砲', color: 'black', rank: 2 }, B_P: { name: '卒', color: 'black', rank: 1 }
};

let deck = [
  'R_K','R_A','R_A','R_E','R_E','R_R','R_R','R_H','R_H','R_C','R_C','R_P','R_P','R_P','R_P','R_P',
  'B_K','B_A','B_A','B_E','B_E','B_R','B_R','B_H','B_H','B_C','B_C','B_P','B_P','B_P','B_P','B_P'
];

let board = [];
let turn = 'player';
let playerColor = null;
let aiColor = null;
let selectedIdx = -1;
let isGameActive = true;

function initGame() {
  deck.sort(() => Math.random() - 0.5);
  board = deck.map(id => ({ piece: PIECES[id], isRevealed: false, isEmpty: false }));
  render();
  updateUI();
}

function render() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  board.forEach((cell, idx) => {
    const div = document.createElement('div');
    div.className = 'cell';
    div.onclick = () => handlePlayerAction(idx);
    
    if (!cell.isEmpty) {
      const pieceDiv = document.createElement('div');
      if (cell.isRevealed) {
        pieceDiv.className = `piece revealed ${cell.piece.color} ${idx === selectedIdx ? 'selected' : ''}`;
        pieceDiv.innerText = cell.piece.name;
      } else {
        pieceDiv.className = 'piece unrevealed';
      }
      div.appendChild(pieceDiv);
    }
    boardEl.appendChild(div);
  });
}

function updateUI() {
  if (playerColor) {
    const pStr = playerColor === 'red' ? '<span style="color:#f87171">紅方</span>' : '<span style="color:#60a5fa">藍方</span>';
    const aStr = aiColor === 'red' ? '<span style="color:#f87171">紅方</span>' : '<span style="color:#60a5fa">藍方</span>';
    document.getElementById('status').innerHTML = `玩家:${pStr} ｜ AI:${aStr}`;
  }
  
  const ti = document.getElementById('turn-indicator');
  if (turn === 'player') {
    ti.innerText = playerColor ? '您的回合' : '首翻開局';
    ti.style.background = 'rgba(74, 222, 128, 0.15)';
    ti.style.color = '#4ade80';
  } else {
    ti.innerText = 'AI 思考中';
    ti.style.background = 'rgba(251, 146, 60, 0.15)';
    ti.style.color = '#fb923c';
  }
}

function isValidMove(from, to, currentBoard) {
  if (from === to) return false; // 精準修復無窮迴圈問題

  const dx = Math.abs((from % 4) - (to % 4));
  const dy = Math.abs(Math.floor(from / 4) - Math.floor(to / 4));
  const attacker = currentBoard[from].piece;
  const target = currentBoard[to];

  if (attacker.rank === 2) { 
    if (dx !== 0 && dy !== 0) return false; 
    let count = 0;
    let step = (dy === 0) ? (to > from ? 1 : -1) : (to > from ? 4 : -4);
    for (let i = from + step; i !== to; i += step) {
      if (!currentBoard[i].isEmpty) count++;
    }
    if (count === 0 && target.isEmpty && (dx + dy === 1)) return true;
    if (count === 1 && !target.isEmpty && target.isRevealed && target.piece.color !== attacker.color) return true;
    return false;
  } else {
    if (dx + dy !== 1) return false; 
    if (target.isEmpty) return true; 
    if (!target.isRevealed) return false; 
    if (target.piece.color === attacker.color) return false; 
    
    if (attacker.rank === 7 && target.piece.rank === 1) return false;
    if (attacker.rank === 1 && target.piece.rank === 7) return true;
    return attacker.rank >= target.piece.rank;
  }
}

function handlePlayerAction(idx) {
  if (turn !== 'player' || !isGameActive) return;
  const cell = board[idx];

  if (!cell.isEmpty && !cell.isRevealed) {
    if (selectedIdx !== -1) { selectedIdx = -1; render(); return; }
    executeFlip(idx, true);
  } 
  else if (!cell.isEmpty && cell.isRevealed && cell.piece.color === playerColor) {
    selectedIdx = idx;
    render();
  } 
  else if (selectedIdx !== -1) {
    if (isValidMove(selectedIdx, idx, board)) {
      executeMove(selectedIdx, idx);
    } else {
      selectedIdx = -1;
      render();
    }
  }
}

function executeFlip(idx, isPlayer) {
  board[idx].isRevealed = true;
  if (!playerColor) {
    playerColor = isPlayer ? board[idx].piece.color : (board[idx].piece.color === 'red' ? 'black' : 'red');
    aiColor = playerColor === 'red' ? 'black' : 'red';
  }
  endTurn();
}

function executeMove(from, to) {
  board[to] = board[from];
  board[from] = { isEmpty: true };
  endTurn();
}

function endTurn() {
  selectedIdx = -1;
  checkWin();
  if (!isGameActive) return;
  turn = turn === 'player' ? 'ai' : 'player';
  render();
  updateUI();
  if (turn === 'ai') setTimeout(aiPlay, 600);
}

function checkWin() {
  let red = 0, black = 0;
  board.forEach(c => {
    if (!c.isEmpty) c.piece.color === 'red' ? red++ : black++;
  });
  if (red === 0 || black === 0) {
    isGameActive = false;
    render();
    setTimeout(() => alert(red === 0 ? "藍方獲勝！" : "紅方獲勝！"), 100);
  }
}

function isThreatenedByEnemy(targetIdx, myColor) {
  for (let i = 0; i < 32; i++) {
    const c = board[i];
    if (!c.isEmpty && c.isRevealed && c.piece.color !== myColor) {
      if (isValidMove(i, targetIdx, board)) return true;
    }
  }
  return false;
}

function aiPlay() {
  if (!isGameActive) return;
  let unrevealed = [];
  let myPieces = [];
  
  board.forEach((c, i) => {
    if (!c.isEmpty) {
      if (!c.isRevealed) unrevealed.push(i);
      else if (aiColor && c.piece.color === aiColor) myPieces.push(i);
    }
  });

  let actions = [];

  if (unrevealed.length > 0) {
    const rIdx = unrevealed[Math.floor(Math.random() * unrevealed.length)];
    actions.push({ type: 'flip', idx: rIdx, score: 14 + Math.random() * 5 });
  }

  if (aiColor) {
    for (let from of myPieces) {
      for (let to = 0; to < 32; to++) {
        if (isValidMove(from, to, board)) {
          let score = 2; 
          let target = board[to];
          
          if (!target.isEmpty) {
            score += target.piece.rank * 12;
            if (target.piece.rank === 7) score += 500;
          }
          
          if (isThreatenedByEnemy(from, aiColor)) {
            score += board[from].piece.rank * 10;
          }
          
          let tempFrom = board[from];
          let tempTo = board[to];
          board[from] = { isEmpty: true };
          board[to] = tempFrom;
          
          if (isThreatenedByEnemy(to, aiColor)) {
            score -= tempFrom.piece.rank * 18; 
          }
          
          board[from] = tempFrom;
          board[to] = tempTo;
          
          actions.push({ type: 'move', from, to, score: score + Math.random() });
        }
      }
    }
  }

  actions.sort((a, b) => b.score - a.score);
  let best = actions[0];
  
  if (!best || best.score < -100) { 
    alert("AI 判斷無路可走，玩家獲勝！"); 
    isGameActive = false; return; 
  }

  if (best.type === 'flip') executeFlip(best.idx, false);
  else executeMove(best.from, best.to);
}

initGame();
</script>
</body>
</html>
