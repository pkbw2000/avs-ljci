<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>大師暗棋 - 4x8</title>
    <style>
        * { margin: 0; padding: 0; }
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: #1a1a2e; 
            height: 100vh; 
            overflow: hidden;
            touch-action: none;
            font-family: Arial, sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
            max-width: 500px;
            max-height: 900px;
            position: relative;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            z-index: 1000;
            background: rgba(0,0,0,0.7);
            padding: 20px 40px;
            border-radius: 12px;
        }
        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.87.0/dist/phaser.min.js"></script>
</head>
<body>
    <div id="game-container">
        <div id="loading">載入遊戲中...</div>
    </div>

    <script>
        // ============================================================
        // 遵循 GameDev_Senior_Engineer_Skill 規則
        // 1. 嚴禁每幀高耗能配置 -> 所有初始化在 create 完成
        // 2. 物件池模式 -> PiecePool 管理棋子
        // 3. 有限狀態機 -> GameStateMachine 
        // 4. 記憶體釋放驗證清單 -> shutdown/destroy 實作
        // ============================================================

        // ----- 遊戲常量 -----
        const ROWS = 8;
        const COLS = 4;
        
        // 棋子編號: 1帥(將), 2仕(士), 3相(象), 4俥(車), 5傌(馬), 6炮(包), 7兵(卒)
        // 紅方: 正數, 黑方: 負數
        const INIT_BOARD = [
            [-7, -6, -5, -4],
            [-3, -2, -1, -2],
            [-3, -6, -5, -4],
            [ 0,  0,  0,  0],
            [ 0,  0,  0,  0],
            [ 4,  5,  6,  3],
            [ 2,  1,  2,  3],
            [ 4,  5,  6,  7]
        ];

        const PIECE_NAMES = {
            1: '帥', '-1': '將',
            2: '仕', '-2': '士',
            3: '相', '-3': '象',
            4: '俥', '-4': '車',
            5: '傌', '-5': '馬',
            6: '炮', '-6': '包',
            7: '兵', '-7': '卒'
        };

        // ----- 主場景 -----
        class GameScene extends Phaser.Scene {
            constructor() {
                super('GameScene');
                this.board = [];
                this.pieces = [];
                this.selectedPiece = null;
                this.validMoves = [];
                this.currentTurn = 1;
                this.moveHistory = [];
                this.gameOver = false;
                this.stateMachine = null;
                this.pool = null;
                this.moveHighlights = [];
                this.cellSize = 0;
                this.pieceSize = 0;
                this.padding = 6;
                this.boardStartX = 0;
                this.boardStartY = 0;
                this.uiText = null;
                this.statusText = null;
                this.resetBtn = null;
            }

            // ----- 場景初始化 -----
            create() {
                console.log('[GameScene] create 開始');
                
                // 初始化物件池
                this.pool = new PiecePool(this);

                // 計算尺寸
                const { width, height } = this.scale;
                console.log(`[GameScene] 螢幕尺寸: ${width}x${height}`);
                
                const maxWidth = width * 0.90;
                const maxHeight = height * 0.78;
                const cellFromWidth = (maxWidth - this.padding * (COLS + 1)) / COLS;
                const cellFromHeight = (maxHeight - this.padding * (ROWS + 1)) / ROWS;
                this.cellSize = Math.min(cellFromWidth, cellFromHeight, 72);
                this.pieceSize = this.cellSize * 0.82;
                console.log(`[GameScene] cellSize: ${this.cellSize}, pieceSize: ${this.pieceSize}`);

                // 計算棋盤起始位置
                this.boardStartX = (width - (this.cellSize + this.padding) * COLS + this.padding) / 2;
                this.boardStartY = (height - (this.cellSize + this.padding) * ROWS + this.padding) / 2;
                console.log(`[GameScene] 棋盤起始: (${this.boardStartX}, ${this.boardStartY})`);

                // ---- 繪製棋盤 ----
                this.drawBoard();

                // ---- 初始化棋子 ----
                this.initPieces();

                // ---- 設置輸入 ----
                this.setupInput();

                // ---- 初始化狀態機 ----
                this.stateMachine = new GameStateMachine(this);

                // ---- UI 文字 ----
                this.uiText = this.add.text(
                    12, 12, 
                    '🔴 紅方回合', 
                    { fontSize: '22px', color: '#FFFFFF', fontFamily: 'Arial', fontStyle: 'bold' }
                ).setDepth(100).setScrollFactor(0);

                this.statusText = this.add.text(
                    this.scale.width - 12, 12,
                    '',
                    { fontSize: '18px', color: '#F1C40F', fontFamily: 'Arial', align: 'right' }
                ).setOrigin(1, 0).setDepth(100).setScrollFactor(0);

                // ---- 重置按鈕 ----
                this.resetBtn = this.add.text(
                    this.scale.width / 2, 
                    this.scale.height - 20,
                    '🔄 重新開始',
                    { 
                        fontSize: '22px', 
                        color: '#FFFFFF', 
                        backgroundColor: '#34495E', 
                        padding: { x: 16, y: 6 },
                        fontFamily: 'Arial',
                        borderRadius: 8
                    }
                ).setOrigin(0.5).setDepth(100)
                  .setInteractive({ useHandCursor: true })
                  .on('pointerdown', () => this.resetGame())
                  .setScrollFactor(0);

                // ---- 生命週期事件 ----
                this.events.on('shutdown', this.shutdown, this);
                this.events.on('destroy', this.destroy, this);

                // 隱藏載入提示
                const loading = document.getElementById('loading');
                if (loading) loading.style.display = 'none';
                
                console.log('[GameScene] create 完成');
            }

            // ----- 繪製棋盤 (使用 Graphics) -----
            drawBoard() {
                console.log('[GameScene] 繪製棋盤');
                const { padding, cellSize, boardStartX, boardStartY } = this;
                
                // 棋盤底色
                const bg = this.add.graphics().setDepth(0);
                bg.fillStyle(0x6B4226, 1);
                bg.fillRoundedRect(
                    boardStartX - padding, 
                    boardStartY - padding, 
                    (cellSize + padding) * COLS + padding, 
                    (cellSize + padding) * ROWS + padding, 
                    10
                );

                // 格子
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const x = boardStartX + c * (cellSize + padding) + padding;
                        const y = boardStartY + r * (cellSize + padding) + padding;
                        const isEven = (r + c) % 2 === 0;
                        const color = isEven ? 0xD4A574 : 0xBF8F5A;
                        
                        const cell = this.add.graphics().setDepth(1);
                        cell.fillStyle(color, 1);
                        cell.fillRoundedRect(x, y, cellSize, cellSize, 4);
                        cell.lineStyle(1, 0x3E2723, 0.2);
                        cell.strokeRoundedRect(x, y, cellSize, cellSize, 4);
                    }
                }
                console.log('[GameScene] 棋盤繪製完成');
            }

            // ----- 初始化棋子 -----
            initPieces() {
                console.log('[GameScene] 初始化棋子');
                this.board = [];
                this.pieces = [];

                for (let r = 0; r < ROWS; r++) {
                    this.board[r] = [];
                    for (let c = 0; c < COLS; c++) {
                        const val = INIT_BOARD[r][c];
                        this.board[r][c] = val;
                        if (val !== 0) {
                            const piece = this.createPiece(r, c, val);
                            this.pieces.push(piece);
                        }
                    }
                }
                console.log(`[GameScene] 創建了 ${this.pieces.length} 個棋子`);
            }

            // ----- 創建單個棋子 -----
            createPiece(row, col, value) {
                const x = this.boardStartX + col * (this.cellSize + this.padding) + this.padding + this.cellSize / 2;
                const y = this.boardStartY + row * (this.cellSize + this.padding) + this.padding + this.cellSize / 2;
                const isRed = value > 0;
                const name = PIECE_NAMES[value] || '?';
                const bgColor = isRed ? '#C0392B' : '#2C3E50';
                const textColor = '#FFFFFF';

                // 棋子本體 (使用 Graphics 繪製圓形底)
                const container = this.add.container(x, y).setDepth(10);
                
                // 陰影
                const shadow = this.add.graphics();
                shadow.fillStyle(0x000000, 0.3);
                shadow.fillCircle(2, 2, this.pieceSize / 2);
                container.add(shadow);

                // 圓形底色
                const circle = this.add.graphics();
                circle.fillStyle(Phaser.Display.Color.HexStringToColor(bgColor).color, 1);
                circle.fillCircle(0, 0, this.pieceSize / 2);
                circle.lineStyle(2, 0xFFFFFF, 0.15);
                circle.strokeCircle(0, 0, this.pieceSize / 2);
                container.add(circle);

                // 文字
                const fontSize = Math.max(18, this.pieceSize * 0.55);
                const text = this.add.text(0, 0, name, {
                    fontSize: fontSize + 'px',
                    color: textColor,
                    fontFamily: 'Arial',
                    fontStyle: 'bold',
                    align: 'center'
                }).setOrigin(0.5);
                container.add(text);

                // 儲存數據到 container
                container.setData({
                    row: row,
                    col: col,
                    value: value,
                    isRed: isRed,
                    name: name
                });

                // 設置互動
                container.setSize(this.pieceSize, this.pieceSize);
                container.setInteractive({ useHandCursor: true });
                container.on('pointerdown', () => {
                    console.log(`[GameScene] 點擊棋子: ${name} at (${row}, ${col})`);
                    this.onPieceClick(container);
                });

                // 儲存 graphics 引用以便清理
                container._graphics = [shadow, circle];
                
                return container;
            }

            // ----- 輸入設置 -----
            setupInput() {
                this.input.on('pointerdown', (pointer, gameObjects) => {
                    // 如果點擊的不是棋子，取消選取
                    if (this.selectedPiece && gameObjects.length === 0) {
                        console.log('[GameScene] 點擊空白處取消選取');
                        this.deselectPiece();
                    }
                });
            }

            // ----- 點擊棋子處理 (由狀態機驅動) -----
            onPieceClick(piece) {
                if (this.gameOver) {
                    this.statusText.setText('遊戲已結束');
                    return;
                }
                
                const row = piece.getData('row');
                const col = piece.getData('col');
                const val = this.board[row][col];
                if (val === 0) return;

                // 檢查是否為當前回合的棋子
                if ((this.currentTurn === 1 && val < 0) || (this.currentTurn === -1 && val > 0)) {
                    this.statusText.setText('⚠️ 請選擇己方棋子');
                    return;
                }

                this.stateMachine.handleInput('PIECE_SELECTED', { piece, row, col });
            }

            // ----- 選取棋子 -----
            selectPiece(piece, row, col) {
                console.log(`[GameScene] 選取棋子: ${piece.getData('name')}`);
                this.deselectPiece();
                this.selectedPiece = piece;
                this.validMoves = this.calculateValidMoves(row, col);
                this.highlightValidMoves(this.validMoves);
                
                // 高亮選取 (變更外框)
                const circle = piece._graphics[1];
                if (circle) {
                    circle.lineStyle(3, 0xF1C40F, 0.9);
                    circle.strokeCircle(0, 0, this.pieceSize / 2);
                }
                this.statusText.setText(`選取: ${piece.getData('name')}`);
            }

            // ----- 取消選取 -----
            deselectPiece() {
                if (this.selectedPiece) {
                    const circle = this.selectedPiece._graphics[1];
                    if (circle) {
                        circle.lineStyle(2, 0xFFFFFF, 0.15);
                        circle.strokeCircle(0, 0, this.pieceSize / 2);
                    }
                    this.selectedPiece = null;
                }
                this.clearHighlights();
                this.validMoves = [];
                this.statusText.setText('');
            }

            // ----- 高亮合法走法 -----
            highlightValidMoves(moves) {
                this.clearHighlights();
                if (!moves || moves.length === 0) return;

                const graphics = this.add.graphics().setDepth(5);
                moves.forEach(({ row, col }) => {
                    const x = this.boardStartX + col * (this.cellSize + this.padding) + this.padding + this.cellSize / 2;
                    const y = this.boardStartY + row * (this.cellSize + this.padding) + this.padding + this.cellSize / 2;
                    
                    // 可移動位置用綠色圓點
                    graphics.fillStyle(0x2ECC71, 0.6);
                    graphics.fillCircle(x, y, this.cellSize * 0.28);
                    
                    // 如果有棋子可吃，加紅色外圈
                    if (this.board[row][col] !== 0) {
                        graphics.lineStyle(3, 0xE74C3C, 0.8);
                        graphics.strokeCircle(x, y, this.cellSize * 0.32);
                    }
                });
                this.moveHighlights.push(graphics);
            }

            clearHighlights() {
                this.moveHighlights.forEach(g => { if (g) g.destroy(); });
                this.moveHighlights = [];
            }

            // ----- 走法生成 (大師級) -----
            calculateValidMoves(row, col) {
                const val = this.board[row][col];
                if (val === 0) return [];
                const isRed = val > 0;
                const moves = [];
                const directions = [[-1,0], [1,0], [0,-1], [0,1]];

                // 基本上下左右移動
                for (const [dr, dc] of directions) {
                    const nr = row + dr;
                    const nc = col + dc;
                    if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
                    const target = this.board[nr][nc];
                    if ((isRed && target > 0) || (!isRed && target < 0)) continue;
                    moves.push({ row: nr, col: nc, target });
                }

                // 炮 (包) 的特殊走法: 隔子跳吃
                if (Math.abs(val) === 6) {
                    for (const [dr, dc] of directions) {
                        let jumped = false;
                        for (let i = 1; i < 4; i++) {
                            const nr = row + dr * i;
                            const nc = col + dc * i;
                            if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) break;
                            const target = this.board[nr][nc];
                            
                            if (!jumped && target === 0) {
                                // 未跳過棋子時，可走空格
                                moves.push({ row: nr, col: nc, target: 0 });
                            } else if (!jumped && target !== 0) {
                                // 遇到第一顆棋子，標記已跳過
                                jumped = true;
                            } else if (jumped && target !== 0) {
                                // 跳過棋子後，遇到第二顆棋子，可吃
                                if ((isRed && target < 0) || (!isRed && target > 0)) {
                                    moves.push({ row: nr, col: nc, target });
                                }
                                break;
                            }
                            // 跳過後若是空格，繼續尋找
                        }
                    }
                }

                console.log(`[GameScene] 走法生成: (${row},${col}) 共 ${moves.length} 步`);
                return moves;
            }

            // ----- 執行移動 (由狀態機調用) -----
            movePiece(fromRow, fromCol, toRow, toCol) {
                console.log(`[GameScene] 移動: (${fromRow},${fromCol}) -> (${toRow},${toCol})`);
                
                const val = this.board[fromRow][fromCol];
                const targetVal = this.board[toRow][toCol];
                
                // 更新棋盤數據
                this.board[toRow][toCol] = val;
                this.board[fromRow][fromCol] = 0;

                // 更新棋子視覺位置
                const movedPiece = this.pieces.find(p => 
                    p.getData('row') === fromRow && p.getData('col') === fromCol
                );
                if (movedPiece) {
                    movedPiece.setData('row', toRow);
                    movedPiece.setData('col', toCol);
                    const x = this.boardStartX + toCol * (this.cellSize + this.padding) + this.padding + this.cellSize / 2;
                    const y = this.boardStartY + toRow * (this.cellSize + this.padding) + this.padding + this.cellSize / 2;
                    movedPiece.setPosition(x, y);
                }

                // 移除被吃掉的棋子
                if (targetVal !== 0) {
                    const eatenIndex = this.pieces.findIndex(p => 
                        p.getData('row') === toRow && p.getData('col') === toCol && p !== movedPiece
                    );
                    if (eatenIndex !== -1) {
                        const eaten = this.pieces[eatenIndex];
                        this.pieces.splice(eatenIndex, 1);
                        this.pool.recycle(eaten);
                        console.log(`[GameScene] 吃掉: ${PIECE_NAMES[targetVal]}`);
                    }
                }

                // 記錄歷史
                this.moveHistory.push({ fromRow, fromCol, toRow, toCol, val, targetVal });
                
                // 取消選取並切換回合
                this.deselectPiece();
                this.switchTurn();

                // 檢查遊戲結束
                this.checkGameOver();
            }

            // ----- 切換回合 -----
            switchTurn() {
                this.currentTurn *= -1;
                const turnText = this.currentTurn === 1 ? '🔴 紅方回合' : '⚫ 黑方回合';
                this.uiText.setText(turnText);
                console.log(`[GameScene] 切換回合: ${turnText}`);
            }

            // ----- 檢查遊戲結束 -----
            checkGameOver() {
                const redPieces = this.board.flat().filter(v => v > 0);
                const blackPieces = this.board.flat().filter(v => v < 0);
                
                if (redPieces.length === 0 || blackPieces.length === 0) {
                    this.gameOver = true;
                    const winner = redPieces.length === 0 ? '⚫ 黑方' : '🔴 紅方';
                    this.statusText.setText(
                // 5. 設置UI (回合/訊息)
                this.uiText = this.add.text(10, 10, '紅方回合', { fontSize: '24px', color: '#fff', fontFamily: 'Arial' })
                    .setDepth(100)
                    .setScrollFactor(0);
                this.statusText = this.add.text(this.scale.width - 10, 10, '', { fontSize: '20px', color: '#F1C40F', fontFamily: 'Arial', align: 'right' })
                    .setOrigin(1, 0)
                    .setDepth(100)
                    .setScrollFactor(0);

                // 重置按鈕
                this.resetBtn = this.add.text(this.scale.width / 2, this.scale.height - 30, '重新開始', { fontSize: '28px', color: '#fff', backgroundColor: '#34495E', padding: { x: 20, y: 8 }, fontFamily: 'Arial' })
                    .setOrigin(0.5)
                    .setDepth(100)
                    .setInteractive({ useHandCursor: true })
                    .on('pointerdown', () => this.resetGame())
                    .setScrollFactor(0);

                this.events.on('shutdown', this.shutdown, this);
                this.events.on('destroy', this.destroy, this);
            }

            drawBoard(startX, startY) {
                const { rows, cols, cellSize, padding, colors } = CONFIG;
                const graphics = this.add.graphics().setDepth(0);

                // 背景
                graphics.fillStyle(colors.board, 1);
                graphics.fillRoundedRect(startX - padding, startY - padding, (cellSize + padding) * cols + padding, (cellSize + padding) * rows + padding, 12);

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const x = startX + c * (cellSize + padding) + padding;
                        const y = startY + r * (cellSize + padding) + padding;
                        const color = (r + c) % 2 === 0 ? colors.cellLight : colors.cellDark;
                        graphics.fillStyle(color, 1);
                        graphics.fillRoundedRect(x, y, cellSize, cellSize, 4);

                        // 繪製網格線 (簡化)
                        graphics.lineStyle(1, 0x3E2723, 0.3);
                        graphics.strokeRoundedRect(x, y, cellSize, cellSize, 4);
                    }
                }
                graphics.generateTexture('boardTexture', this.scale.width, this.scale.height);
                graphics.destroy();
            }

            initPieces() {
                const { rows, cols } = CONFIG;
                this.board = [];
                this.pieces = [];

                for (let r = 0; r < rows; r++) {
                    this.board[r] = [];
                    for (let c = 0; c < cols; c++) {
                        const val = INIT_BOARD[r][c];
                        this.board[r][c] = val;
                        if (val !== 0) {
                            const piece = this.pool.get(r, c, val);
                            this.pieces.push(piece);
                        }
                    }
                }
            }

            // ----- 物件池 (Object Pool) -----
            createPiece(r, c, val) {
                const x = this.boardStartX + c * (CONFIG.cellSize + CONFIG.padding) + CONFIG.padding + CONFIG.cellSize / 2;
                const y = this.boardStartY + r * (CONFIG.cellSize + CONFIG.padding) + CONFIG.padding + CONFIG.cellSize / 2;
                const isRed = val > 0;
                const name = PIECE_NAMES[val] || '?';
                const color = isRed ? CONFIG.colors.red : CONFIG.colors.black;

                const piece = this.add.text(x, y, name, {
                    fontSize: CONFIG.pieceSize * 0.7 + 'px',
                    color: '#FFF',
                    backgroundColor: color,
                    padding: { x: CONFIG.pieceSize * 0.15, y: CONFIG.pieceSize * 0.1 },
                    fontFamily: 'Arial',
                    fontStyle: 'bold',
                    align: 'center',
                    borderRadius: CONFIG.pieceSize * 0.2,
                    shadow: { offsetX: 2, offsetY: 2, color: '#000', blur: 4, fill: true }
                }).setDepth(10)
                  .setOrigin(0.5)
                  .setData({ row: r, col: c, value: val, isRed });

                // 添加邊框
                const border = this.add.graphics().setDepth(9);
                border.fillStyle(0x000000, 0.4);
                border.fillRoundedRect(x - CONFIG.pieceSize / 2, y - CONFIG.pieceSize / 2, CONFIG.pieceSize, CONFIG.pieceSize, CONFIG.pieceSize * 0.2);
                border.destroy(); // 只用作底層陰影

                piece.setInteractive({ useHandCursor: true });
                piece.on('pointerdown', () => this.onPieceClick(piece));

                // 儲存引用以便清理
                piece._border = border;
                piece._pieceData = { row: r, col: c, value: val };
                return piece;
            }

            // 池化回收
            recyclePiece(piece) {
                if (!piece) return;
                piece.destroy(true);
                // 實際池化操作可擴展此處
            }

            // ----- 輸入設置 (事件監聽) -----
            setupInput() {
                this.input.on('pointerdown', (pointer) => {
                    // 點擊空白處取消選取
                    if (this.selectedPiece && !this.gameOver) {
                        this.deselectPiece();
                    }
                });
            }

            // ----- 核心邏輯 (有限狀態機) -----
            onPieceClick(piece) {
                if (this.gameOver) return;
                const row = piece.getData('row');
                const col = piece.getData('col');
                const val = this.board[row][col];
                if (val === 0) return;

                // 判斷是否為當前回合的棋子
                if ((this.currentTurn === 1 && val < 0) || (this.currentTurn === -1 && val > 0)) {
                    this.statusText.setText('請選擇己方棋子');
                    return;
                }

                this.stateMachine.handleInput('PIECE_SELECTED', { piece, row, col });
            }

            selectPiece(piece, row, col) {

                    graphics.fillCircle(x, y, CONFIG.cellSize * 0.35);
                });
                this.moveHighlights.push(graphics);

            clearHighlights() {
                this.moveHighlights.forEach(g => g.destroy());
                this.moveHighlights = [];
            }

            // ----- 走法生成 (大師級簡化) -----
            calculateValidMoves(row, col) {
                const val = this.board[row][col];
                if (val === 0) return [];
                const isRed = val > 0;
                const moves = [];
                const directions = [
                    [-1, 0], [1, 0], [0, -1], [0, 1]
                ];

                // 基本上下左右 (暗棋簡化規則)
                for (const [dr, dc] of directions) {
                    const nr = row + dr;
                    const nc = col + dc;
                    if (nr < 0 || nr >= CONFIG.rows || nc < 0 || nc >= CONFIG.cols) continue;
                    const target = this.board[nr][nc];
                    // 不能吃己方
                    if ((isRed && target > 0) || (!isRed && target < 0)) continue;
                    moves.push({ row: nr, col: nc, target });

                if (Math.abs(val) === 6) {
                    for (const [dr, dc] of directions) {

                        for (let i = 1; i < 4; i++) {
                            const nr = row + dr * i;
                            const nc = col + dc * i;

                            } else if (!jumped && target !== 0) {

                            } else if (jumped && target !== 0) {

                                if ((isRed && target < 0) || (!isRed && target > 0)) {

            const color = piece.color;
            const enemy = color === 'red' ? 'black' : 'red';
            const dirs = {
                [RANK.KING]: [[-1,0],[1,0],[0,-1],[0,1]],
                [RANK.ADVISOR]: [[-1,-1],[-1,1],[1,-1],[1,1]],
                [RANK.ELEPHANT]: [[-2,-2],[-2,2],[2,-2],[2,2]],
                [RANK.ROOK]: [],
                [RANK.KNIGHT]: [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]],
                [RANK.CANNON]: [],
                [RANK.PAWN]: [[-1,0],[1,0],[0,-1],[0,1]]
            };

            if (rank === RANK.KING || rank === RANK.ADVISOR) {
                for (const d of dirs[rank]) {
                    const nr = row + d[0], nc = col + d[1];
                    if (!isOnBoard(nr, nc)) continue;
                    const target = getPiece(nr, nc);
                    if (target && target.color === color) continue;
                    moves.push({ row: nr, col: nc, eat: target || null });
                }
                return moves;
            }

            if (rank === RANK.ELEPHANT) {
                for (const d of dirs[RANK.ELEPHANT]) {
                    const nr = row + d[0], nc = col + d[1];
                    if (!isOnBoard(nr, nc)) continue;
                    const eyeR = row + d[0]/2, eyeC = col + d[1]/2;
                    if (getPiece(eyeR, eyeC)) continue;
                    const target = getPiece(nr, nc);
                    if (target && target.color === color) continue;
                    moves.push({ row: nr, col: nc, eat: target || null });
                }
                return moves;
            }

            if (rank === RANK.ROOK) {
                const directions = [[-1,0],[1,0],[0,-1],[0,1]];
                for (const d of directions) {
                    let r = row + d[0], c = col + d[1];
                    while (isOnBoard(r, c)) {
                        const target = getPiece(r, c);
                        if (target) {
                            if (target.color !== color) moves.push({ row: r, col: c, eat: target });
                            break;
                        }
                        moves.push({ row: r, col: c, eat: null });
                        r += d[0]; c += d[1];
                    }
                }
                return moves;
            }

            if (rank === RANK.KNIGHT) {
                for (const d of dirs[RANK.KNIGHT]) {
                    const nr = row + d[0], nc = col + d[1];
                    if (!isOnBoard(nr, nc)) continue;
                    const legR = row + (Math.abs(d[0]) === 2 ? d[0]/2 : 0);
                    const legC = col + (Math.abs(d[1]) === 2 ? d[1]/2 : 0);
                    if (getPiece(legR, legC)) continue;
                    const target = getPiece(nr, nc);
                    if (target && target.color === color) continue;
                    moves.push({ row: nr, col: nc, eat: target || null });
                }
                return moves;
            }

            if (rank === RANK.CANNON) {
                const directions = [[-1,0],[1,0],[0,-1],[0,1]];
                for (const d of directions) {
                    let r = row + d[0], c = col + d[1];
                    let jumped = false;
                    while (isOnBoard(r, c)) {
                        const target = getPiece(r, c);
                        if (!jumped) {
                            if (target) { jumped = true; }
                            else { moves.push({ row: r, col: c, eat: null }); }
                        } else {
                            if (target) {
                                if (target.color !== color) moves.push({ row: r, col: c, eat: target });
                                break;
                            }
                        }
                        r += d[0]; c += d[1];
                    }
                }
                return moves;
            }

            if (rank === RANK.PAWN) {
                for (const d of dirs[RANK.PAWN]) {
                    const nr = row + d[0], nc = col + d[1];
                    if (!isOnBoard(nr, nc)) continue;
                    const target = getPiece(nr, nc);
                    if (target && target.color === color) continue;
                    moves.push({ row: nr, col: nc, eat: target || null });
                }
                return moves;
            }
            return moves;
        }

        // ---------- 执行移动 (返回是否结束游戏) ----------
        function makeMove(fromR, fromC, toR, toC) {
            const piece = board[fromR][fromC];
            const target = board[toR][toC];
            board[toR][toC] = piece;
            board[fromR][fromC] = null;
            faceUp[toR][toC] = true;

            if (target && target.rank === RANK.KING) {
                gameOver = true;
                const winner = currentTurn === 'red' ? '红方' : '黑方';
                setStatus(`🏆 ${winner} 获胜！吃掉了将/帅！`);
                updateTurnDisplay();
                render();
                return true;
            }

            // 切换回合
            currentTurn = (currentTurn === 'red' ? 'black' : 'red');
            selectedPos = null;
            updateTurnDisplay();
            setStatus(`${currentTurn === 'red' ? '红方' : '黑方'} 走棋`);
            render();

            // 检查是否无子可走（包括不能翻牌？翻牌也是走法，所以需要检查是否有任何可翻或可走的）
            if (!hasAnyLegalAction(currentTurn)) {
                gameOver = true;
                const winner = currentTurn === 'red' ? '黑方' : '红方';
                setStatus(`🏆 ${winner} 获胜！对方无子可走！`);
                updateTurnDisplay();
                render();
                return true;
            }

            // 若轮到黑方，触发 AI
            if (!gameOver && currentTurn === 'black') {
                setTimeout(() => aiTurn(), 300);
            }
            return false;
        }

        // ---------- 检查某方是否有任何合法动作（翻牌或移动） ----------
        function hasAnyLegalAction(color) {
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 4; c++) {
                    const p = getPiece(r, c);
                    if (!p || p.color !== color) continue;
                    if (!faceUp[r][c]) {
                        // 可以翻牌（任何面朝下的己方棋子）
                        return true;
                    } else {
                        // 面朝上，检查是否有移动走法
                        const moves = getLegalMovesForColor(r, c, color);
                        if (moves.length > 0) return true;
                    }
                }
            }
            return false;
        }

        // 获取某个棋子针对特定颜色的走法（不考虑 currentTurn）
        function getLegalMovesForColor(row, col, color) {
            const piece = getPiece(row, col);
            if (!piece || !faceUp[row][col] || piece.color !== color) return [];
            // 保存当前回合，临时切换
            const oldTurn = currentTurn;

<body>
    <div class="game-container" role="main" aria-label="暗棋游戏">
        <!-- 头部 -->
        <div class="header">
            <span class="title">♟ 暗棋 · 大师</span>
            <span class="turn-indicator" id="turnIndicator">⚔️ <span class="highlight" id="turnText">红方</span></span>
        </div>

        <!-- 棋盘 8x4 -->
        <div class="board" id="board"></div>

        <!-- 底部 -->
        <div class="footer">
            <button class="btn" id="btnRestart">🔄 重开</button>
            <span class="status-msg" id="statusMsg">点击棋子翻牌</span>
            <button class="btn btn-primary" id="btnAI">🤖 AI 走一步</button>
        </div>
    </div>

    <script>
        // ================================================================
        //  大师暗棋 · 完整游戏逻辑 (8x4)
        //  规则：红方（帅仕相俥傌炮兵）vs 黑方（将士象车马炮卒）
        //  翻牌 / 移动 / 吃子 / 简单 AI
        // ================================================================

        // ---------- 棋子定义 ----------
        const RANK = {
            KING: 0,    // 帅/将
            ADVISOR: 1, // 仕/士
            ELEPHANT: 2,// 相/象
            ROOK: 3,    // 俥/车
            KNIGHT: 4,  // 傌/马
            CANNON: 5,  // 炮/砲
            PAWN: 6     // 兵/卒
        };

        // 显示字符 & 红黑对应
        const PIECE_CHARS = {
            red: {
                [RANK.KING]: '帅',
                [RANK.ADVISOR]: '仕',
                [RANK.ELEPHANT]: '相',
                [RANK.ROOK]: '俥',
                [RANK.KNIGHT]: '傌',
                [RANK.CANNON]: '炮',
                [RANK.PAWN]: '兵'
            },
            black: {
                [RANK.KING]: '将',
                [RANK.ADVISOR]: '士',
                [RANK.ELEPHANT]: '象',
                [RANK.ROOK]: '车',
                [RANK.KNIGHT]: '马',
                [RANK.CANNON]: '砲',
                [RANK.PAWN]: '卒'
            }
        };

        // 棋子分值（用于 AI 评估）
        const SCORE = {
            [RANK.KING]: 1000,
            [RANK.ADVISOR]: 200,
            [RANK.ELEPHANT]: 200,
            [RANK.ROOK]: 600,
            [RANK.KNIGHT]: 400,
            [RANK.CANNON]: 450,
            [RANK.PAWN]: 100
        };

        // 所有棋子的 rank 列表（用于生成初始阵容）
        const ALL_RANKS = [
            RANK.KING, RANK.ADVISOR, RANK.ELEPHANT,
            RANK.ROOK, RANK.KNIGHT, RANK.CANNON, RANK.PAWN,
            RANK.PAWN, RANK.PAWN, RANK.PAWN, RANK.PAWN
        ];

        // ---------- 游戏状态 ----------
        let board = [];          // 8x4 二维数组，每个格子: { rank, color } 或 null
        let faceUp = [];        // 8x4 boolean
        let currentTurn = 'red'; // 'red' 或 'black'
        let gameOver = false;
        let selectedPos = null; // { row, col } 或 null

        // DOM 引用
        const boardEl = document.getElementById('board');
        const turnText = document.getElementById('turnText');
        const statusMsg = document.getElementById('statusMsg');

        // ---------- 初始化 / 重置 ----------
        function initGame() {
            // 生成 32 个棋子: 红方 16 + 黑方 16
            const pieces = [];
            // 红方
            for (let i = 0; i < 2; i++) {
                for (const r of ALL_RANKS) {
                    pieces.push({ rank: r, color: 'red' });
                }
            }
            // 黑方
            for (let i = 0; i < 2; i++) {
                for (const r of ALL_RANKS) {
                    pieces.push({ rank: r, color: 'black' });
                }
            }
            // 打乱 (Fisher-Yates)
            for (let i = pieces.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pieces[i], pieces[j]] = [pieces[j], pieces[i]];
            }

            // 填充到 8x4
            board = [];
            faceUp = [];
            let idx = 0;
            for (let r = 0; r < 4; r++) {
                const row = [];
                const fRow = [];
                for (let c = 0; c < 8; c++) {
                    row.push(pieces[idx++]);
                    fRow.push(false); // 全部面朝下
                }
                board.push(row);
                faceUp.push(fRow);
            }

            currentTurn = 'red';
            gameOver = false;
            selectedPos = null;
            updateTurnDisplay();
            setStatus('游戏开始！红方先行');
            render();
        }

        // ---------- 渲染 ----------
        function render() {
            boardEl.innerHTML = '';
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 8; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    const piece = board[r][c];
                    const isUp = faceUp[r][c];

                    if (!piece) {
                        // 空格
                        cell.style.background = '#7a6045';
                        cell.style.boxShadow = 'inset 0 -2px 0 #5a4430';
                        cell.textContent = '';
                    } else if (isUp) {
                        // 面朝上
                        const charMap = piece.color === 'red' ? PIECE_CHARS.red : PIECE_CHARS.black;
                        cell.textContent = charMap[piece.rank] || '?';
                        cell.dataset.color = piece.color;
                        // 如果是红方，加一点发光
                        if (piece.color === 'red') {
                            cell.style.textShadow = '0 0 8px rgba(255,60,30,0.3)';
                        } else {
                            cell.style.textShadow = '0 0 8px rgba(0,0,0,0.3)';
                        }
                        cell.classList.remove('face-down');
                    } else {
                        // 面朝下
                        cell.classList.add('face-down');
                        cell.dataset.color = '';
                    }

                    // 高亮：选中的棋子 / 可移动目标
                    if (selectedPos && selectedPos.row === r && selectedPos.col === c) {
                        cell.classList.add('selectable');
                    }

                    // 如果是面朝上的己方棋子且轮到该方，添加点击事件
                    cell.addEventListener('click', () => onCellClick(r, c));
                    // 触摸优化
                    cell.addEventListener('touchstart', (e) => {
                        // 防止双击缩放干扰
                    }, { passive: true });

                    boardEl.appendChild(cell);
                }
            }
        }

        // ---------- 辅助函数 ----------
        function getPiece(row, col) {
            if (row < 0 || row >= 4 || col < 0 || col >= 8) return null;
            return board[row][col];
        }

        function isFaceUp(row, col) {
            if (row < 0 || row >= 4 || col < 0 || col >= 8) return false;
            return faceUp[row][col];
        }

        function isOnBoard(row, col) {
            return row >= 0 && row < 4 && col >= 0 && col < 8;
        }

        function setStatus(msg) {
            statusMsg.textContent = msg;
        }

        function updateTurnDisplay() {
            if (gameOver) {
                turnText.textContent = '🏁 结束';
                return;
            }
            turnText.textContent = currentTurn === 'red' ? '红方' : '黑方';
            turnText.style.color = currentTurn === 'red' ? '#ff6b4a' : '#cccccc';
        }

        // ---------- 核心逻辑：获取合法走法 ----------
        function getLegalMoves(row, col) {
            const piece = getPiece(row, col);
            if (!piece || !faceUp[row][col]) return [];
            if (piece.color !== currentTurn) return [];

            const moves = [];
            const rank = piece.rank;
            const color = piece.color;
            const enemy = color === 'red' ? 'black' : 'red';

            // 方向：红方在上（row 0~1 为红方区域），黑方在下（row 2~3）
            // 但暗棋中移动不限制区域，只按棋子类型
            const dirs = {
                [RANK.KING]: [[-1,0],[1,0],[0,-1],[0,1]],
                [RANK.ADVISOR]: [[-1,-1],[-1,1],[1,-1],[1,1]],
                [RANK.ELEPHANT]: [[-2,-2],[-2,2],[2,-2],[2,2]],
                [RANK.ROOK]: [], // 特殊处理
                [RANK.KNIGHT]: [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]],
                [RANK.CANNON]: [], // 特殊处理
                [RANK.PAWN]: [[-1,0],[1,0],[0,-1],[0,1]]
            };

            // ---- 帅/将 ----
            if (rank === RANK.KING) {
                for (const d of dirs[RANK.KING]) {
                    const nr = row + d[0], nc = col + d[1];
                    if (!isOnBoard(nr, nc)) continue;
                    const target = getPiece(nr, nc);
                    if (target && target.color === color) continue;
                    moves.push({ row: nr, col: nc, eat: target || null });
                }
                return moves;
            }

            // ---- 仕/士 ----
            if (rank === RANK.ADVISOR) {
                for (const d of dirs[RANK.ADVISOR]) {
                    const nr = row + d[0], nc = col + d[1];
                    if (!isOnBoard(nr, nc)) continue;
                    const target = getPiece(nr, nc);
                    if (target && target.color === color) continue;
                    moves.push({ row: nr, col: nc, eat: target || null });
                }
                return moves;
            }

            // ---- 相/象 ----
            if (rank === RANK.ELEPHANT) {
                for (const d of dirs[RANK.ELEPHANT]) {
                    const nr = row + d[0], nc = col + d[1];
                    if (!isOnBoard(nr, nc)) continue;
                    // 象眼（田字中心）不能有棋子
                    const eyeR = row + d[0]/2, eyeC = col + d[1]/2;
                    if (getPiece(eyeR, eyeC)) continue;
                    const target = getPiece(nr, nc);
                    if (target && target.color === color) continue;
                    moves.push({ row: nr, col: nc, eat: target || null });
                }
                return moves;
            }

            // ---- 俥/车 ----
            if (rank === RANK.ROOK) {
                const directions = [[-1,0],[1,0],[0,-1],[0,1]];
                for (const d of directions) {
                    let r = row + d[0], c = col + d[1];
                    while (isOnBoard(r, c)) {
                        const target = getPiece(r, c);
                        if (target) {
                            if (target.color !== color) {
                                moves.push({ row: r, col: c, eat: target });
                            }
                            break;
                        }
                        moves.push({ row: r, col: c, eat: null });
                        r += d[0];
                        c += d[1];
                    }
                }
                return moves;
            }

            // ---- 傌/马 ----
            if (rank === RANK.KNIGHT) {
                for (const d of dirs[RANK.KNIGHT]) {
                    const nr = row + d[0], nc = col + d[1];
                    if (!isOnBoard(nr, nc)) continue;
                    // 蹩马腿：检查横/竖方向一步
                    const legR = row + (Math.abs(d[0]) === 2 ? d[0]/2 : 0);
                    const legC = col + (Math.abs(d[1]) === 2 ? d[1]/2 : 0);
                    if (getPiece(legR, legC)) continue;
                    const target = getPiece(nr, nc);
                    if (target && target.color === color) continue;
                    moves.push({ row: nr, col: nc, eat: target || null });
                }
                return moves;
            }

            // ---- 炮/砲 ----
            if (rank === RANK.CANNON) {
                const directions = [[-1,0],[1,0],[0,-1],[0,1]];
                for (const d of directions) {
                    let r = row + d[0], c = col + d[1];
                    let jumped = false;
                    while (isOnBoard(r, c)) {
                        const target = getPiece(r, c);
                        if (!jumped) {
                            if (target) {
                                // 炮架
                                jumped = true;
                            } else {
                                moves.push({ row: r, col: c, eat: null });
                            }
                        } else {
                            if (target) {
                                if (target.color !== color) {
                                    moves.push({ row: r, col: c, eat: target });
                                }
                                break;
                            }
                            // 跳过炮架后不能走空位
                        }
                        r += d[0];
                        c += d[1];
                    }
                }
                return moves;
            }

            // ---- 兵/卒 ----
            if (rank === RANK.PAWN) {
                // 兵：红方在上，初始只能向下（+1），过河后可左右
                // 简化：暗棋中兵可以上下左右走一步
                for (const d of dirs[RANK.PAWN]) {
                    const nr = row + d[0], nc = col + d[1];
                    if (!isOnBoard(nr, nc)) continue;
                    const target = getPiece(nr, nc);
                    if (target && target.color === color) continue;
                    moves.push({ row: nr, col: nc, eat: target || null });
                }
                return moves;
            }

            return moves;
        }

        // ---------- 执行走法 ----------
        function makeMove(fromRow, fromCol, toRow, toCol) {
            const piece = board[fromRow][fromCol];
            const target = board[toRow][toCol];
            // 执行
            board[toRow][toCol] = piece;
            board[fromRow][fromCol] = null;
            faceUp[toRow][toCol] = true; // 翻开的棋子保持翻开
            // 如果目标有棋子且被吃，从棋盘移除 (已覆盖)

            // 检查胜利条件：吃掉将/帅
            if (target && target.rank === RANK.KING) {
                gameOver = true;
                const winner = currentTurn === 'red' ? '红方' : '黑方';
                setStatus(`🏆 ${winner} 获胜！吃掉了将/帅！`);
                updateTurnDisplay();
                render();
                return true;
            }

            // 切换玩家
            currentTurn = (currentTurn === 'red' ? 'black' : 'red');
            selectedPos = null;
            updateTurnDisplay();
            setStatus(`${currentTurn === 'red' ? '红方' : '黑方'} 走棋`);
            render();

            // 检查是否游戏结束（无子可走？简单检测：如果一方没有棋子了）
            let hasPiece = false;
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 8; c++) {
                    if (board[r][c] && board[r][c].color === currentTurn && faceUp[r][c]) {
                        hasPiece = true;
                        break;
                    }
                }
                if (hasPiece) break;
            }
            if (!hasPiece) {
                gameOver = true;
                const winner = currentTurn === 'red' ? '黑方' : '红方';
                setStatus(`🏆 ${winner} 获胜！对方无子可走！`);
                updateTurnDisplay();
                render();
                return true;
            }

            // 如果当前轮到 AI（黑方），自动触发 AI
            if (!gameOver && currentTurn === 'black') {
                setTimeout(() => aiMove(), 300);
            }
            return false;
        }

        // ---------- 点击处理 ----------
        function onCellClick(row, col) {
            if (gameOver) {
                setStatus('游戏已结束，点击「重开」再来一局');
                return;
            }

            // 如果当前是 AI 回合（黑方），禁止操作
            if (currentTurn === 'black') {
                setStatus('🤖 AI 思考中，请稍候...');
                return;
            }

            const piece = getPiece(row, col);
            const isUp = faceUp[row][col];

            // 1. 如果格子为空 -> 取消选中
            if (!piece) {
                if (selectedPos) {
                    selectedPos = null;
                    render();
                    setStatus('已取消选择');
                }
                return;
            }

            // 2. 如果面朝下 -> 翻牌（必须是当前玩家的棋子）
            if (!isUp) {
                if (piece.color !== currentTurn) {
                    setStatus(`⛔ 不能翻对方的棋子`);
                    return;
                }
                // 翻牌
                faceUp[row][col] = true;
                // 翻牌后检查是否触发胜利？（翻到将帅不算，但翻到后如果对方无子可走？）
                // 暗棋规则：翻牌后如果翻到己方棋子，可以继续走；但这里简化：翻牌后切换回合
                // 更符合暗棋：翻牌后如果翻到己方棋子，可以继续翻或走；但为了简单，翻牌后切换回合。
                // 但很多暗棋规则是翻牌后可以继续翻，直到翻到对方棋子或选择移动。
                // 我们采用更标准规则：翻牌后，如果翻到的是己方棋子，玩家可以继续操作（翻或移动）。
                // 但这里为了交互清晰，翻牌后保持当前玩家回合，并允许继续。
                // 然而在移动逻辑中，只有面朝上的己方棋子才能被选中移动。
                // 所以我们保持 currentTurn 不变，但取消选中状态。
                selectedPos = null;
                render();
                setStatus(`翻开了 ${piece.color === 'red' ? '红' : '黑'}方棋子`);
                // 检查是否无子可走
                checkNoMoves();
                return;
            }

            // 3. 面朝上
            // 如果点击的是己方棋子 -> 选中 / 取消选中
            if (piece.color === currentTurn) {
                if (selectedPos && selectedPos.row === row && selectedPos.col === col) {
                    // 取消选中
                    selectedPos = null;
                    render();
                    setStatus('已取消选择');
                    return;
                }
                // 检查该棋子是否有合法走法
                const moves = getLegalMoves(row, col);
                if (moves.length === 0) {
                    setStatus('⛔ 该棋子无路可走');
                    return;
                }
                selectedPos = { row, col };
                render();
                setStatus(`选中 ${piece.color === 'red' ? '红' : '黑'}方${PIECE_CHARS[piece.color][piece.rank]}，点击目标位置`);
                return;
            }

            // 4. 点击的是对方棋子（面朝上） -> 如果有选中的己方棋子，尝试吃子
            if (selectedPos) {
                const from = selectedPos;
                const fromPiece = getPiece(from.row, from.col);
                if (!fromPiece) {
                    selectedPos = null;
                    render();
                    return;
                }
                // 检查走法
                const moves = getLegalMoves(from.row, from.col);
                const found = moves.find(m => m.row === row && m.col === col);
                if (found) {
                    // 执行走法
                    makeMove(from.row, from.col, row, col);
                } else {
                    setStatus('⛔ 无法走到该位置');
                    // 取消选中
                    selectedPos = null;
                    render();
                }
                return;
            }

            // 5. 点击对方棋子但没有选中 -> 忽略
            setStatus(`这是 ${piece.color === 'red' ? '红' : '黑'}方棋子`);
        }

        // ---------- 检查是否无子可走 (仅当前玩家) ----------
        function checkNoMoves() {
            if (gameOver) return;
            let hasMove = false;
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 8; c++) {
                    if (board[r][c] && board[r][c].color === currentTurn && faceUp[r][c]) {
                        const moves = getLegalMoves(r, c);
                        if (moves.length > 0) {
                            hasMove = true;
                            break;
                        }
                    }
                }
                if (hasMove) break;
            }
            if (!hasMove) {
                gameOver = true;
                const winner = currentTurn === 'red' ? '黑方' : '红方';
                setStatus(`🏆 ${winner} 获胜！对方无子可走！`);
                updateTurnDisplay();
                render();
            }
        }

        // ---------- AI 走法 (简单评分) ----------
        function aiMove() {
            if (gameOver) return;
            if (currentTurn !== 'black') return;

            // 收集所有黑方面朝上的棋子及其走法
            let allMoves = [];
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 8; c++) {
                    const p = getPiece(r, c);
                    if (p && p.color === 'black' && faceUp[r][c]) {
                        const moves = getLegalMoves(r, c);
                        for (const m of moves) {
                            allMoves.push({
                                fromRow: r,
                                fromCol: c,
                                toRow: m.row,
                                toCol: m.col,
                                eat: m.eat,
                                score: 0
                            });
                        }
                    }
                }
            }

            if (allMoves.length === 0) {
                // 无子可走，判负（但会在 checkNoMoves 中处理）
                checkNoMoves();
                return;
            }

            // 评分：优先吃子，吃分值高的子
            for (const mv of allMoves) {
                if (mv.eat) {
                    mv.score = SCORE[mv.eat.rank] || 0;
                    // 如果吃的是将/帅，额外加分
                    if (mv.eat.rank === RANK.KING) mv.score += 10000;
                } else {
                    // 随机小权重，倾向于翻牌（但这里只移动已翻开的棋子）
                    mv.score = Math.random() * 0.1;
                }
                // 轻微随机打破平局
                mv.score += Math.random() * 0.5;
            }

            // 按分数降序排列
            allMoves.sort((a, b) => b.score - a.score);
            const best = allMoves[0];

            // 执行最佳走法
            const gameEnded = makeMove(best.fromRow, best.fromCol, best.toRow, best.toCol);
            if (!gameEnded && currentTurn === 'black') {
                // 如果 AI 还是黑方（比如翻牌后还是黑方？但我们的 makeMove 切换了回合）
                // 但 makeMove 会切换回合，所以不会出现这种情况
            }
        }

        // ---------- 重新开始 ----------
        function restart() {
            initGame();
            // 如果初始是黑方先手？不，红方先手
            // 如果 AI 先手？这里红方先手，玩家执红
            // 如果希望玩家执黑，可调整，但这里默认玩家红方
            setStatus('新游戏！红方先行');
            selectedPos = null;
            render();
        }

        // ---------- 手动触发 AI (调试/辅助) ----------
        function triggerAI() {
            if (gameOver) {
                setStatus('游戏已结束');
                return;
            }
            if (currentTurn !== 'black') {
                setStatus('⏳ 当前不是 AI 回合');
                return;
            }
            aiMove();
        }

        // ---------- 启动 ----------
        document.addEventListener('DOMContentLoaded', () => {
            initGame();
            document.getElementById('btnRestart').addEventListener('click', restart);
            document.getElementById('btnAI').addEventListener('click', triggerAI);
        });

        // ---------- 额外：在移动端防止双击缩放 ----------
        document.addEventListener('dblclick', (e) => e.preventDefault());
    </script>
</body>
</html>
