<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>大師級暗棋 · RWD 完美適配版</title>
<style>
  :root {
    --glass-bg: rgba(255, 255, 255, 0.06);
    --glass-border: rgba(255, 255, 255, 0.1);
    --board-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 2px 5px rgba(255,255,255,0.1);
  }

  body { 
    margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    /* 核心修正：使用 dvh 完美適配 iOS Safari 動態高度，避免底部被遮擋 */
    min-height: 100dvh; 
    background: linear-gradient(135deg, #1f242d 0%, #0d1013 100%);
    color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    touch-action: manipulation; overflow: hidden;
    box-sizing: border-box;
    padding-bottom: env(safe-area-inset-bottom); /* 留出 iPhone 底部橫條安全區域 */
  }

  /* 頂部 HUD - 寬度與棋盤精準同步 */
  #hud {
    /* 使用 min 限制，高度不夠時自動縮小寬度，防溢出 */
    width: min(86vw, 340px, 40dvh);
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; padding: 10px 14px; 
    background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border); border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .hud-box { display: flex; flex-direction: column; gap: 2px; }
  .hud-label { font-size: 0.7rem; color: rgba(255,255,255,0.5); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .hud-val { font-size: 0.95rem; font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
  
  #turn-indicator { 
    padding: 5px 12px; border-radius: 12px; font-size: 0.8rem; font-weight: 700; 
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: all 0.3s ease;
  }

  /* 核心棋盤 - 4x8 完美視區鎖定 */
  #board {
    display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(8, 1fr);
    gap: 8px; padding: 12px; 
    background: #181b22;
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 24px; box-shadow: var(--board-shadow);
    
    /* 關鍵響應式公式：寬度最大不超過螢幕寬的 86%、不超過實體 340px、且高度換算絕不超過垂直可用空間的 40dvh */
    width: min(86vw, 340px, 40dvh); 
    aspect-ratio: 4 / 8; /* 嚴格鎖定 1:2 棋盤比例 */
  }
  
  /* 下沉式棋格 */
  .cell {
    background: #111318; border-radius: 50%; 
    display: flex; justify-content: center; align-items: center; position: relative;
    box-shadow: inset 0 4px 8px rgba(0,0,0,0.7), inset 0 -1px 2px rgba(255,255,255,0.05);
    border: 1px solid rgba(0,0,0,0.4);
  }

  /* 棋子 3D 物理質感 */
  .piece {
    width: 92%; height: 92%; border-radius: 50%; display: flex; 
    justify-content: center; align-items: center; 
    font-size: 1.4rem; /* 適度縮減字型以防小螢幕溢出 */
    font-weight: 900; 
    cursor: pointer; user-select: none; position: relative;
    transform-style: preserve-3d;
    transition: transform 0.22s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.22s;
  }
  
  /* 未翻開：立體暗金屬 */
  .unrevealed { 
    background: radial-gradient(circle at 30% 30%, #3e4452 0%, #252932 60%, #15181e 100%);
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 
      0 1px 0 #121418, 0 2px 0 #0e1013, 0 3px 0 #0a0b0e, 0 4px 0 #07080a,
      0 6px 12px rgba(0,0,0,0.6), inset 0 2px 3px rgba(255,255,255,0.2);
    transform: translateY(-4px);
  }
  .unrevealed::after { content: '?'; color: rgba(255,255,255,0.12); font-size: 1.1rem; }
  .unrevealed:active { 
    transform: translateY(-1px);
    box-shadow: 0 1px 0 #0a0b0e, 0 2px 5px rgba(0,0,0,0.5), inset 0 2px 3px rgba(255,255,255,0.1);
  }

  /* 已翻開：球面象牙瓷磚 */
  .revealed { 
    background: radial-gradient(circle at 30% 30%, #ffffff 0%, #f6f6f6 45%, #e0e0e0 85%, #d5d5d5 100%);
    transform: translateY(-4px);
  }
  
  .red { 
    color: #d63031; border: 1px solid #ff7675;
    box-shadow: 
      0 1px 0 #c2c2c2, 0 2px 0 #b0b0b0, 0 3px 0 #9e9e9e, 0 4px 0 #8c8c8c,
      0 7px 12px rgba(214, 48, 49, 0.25), inset 0 2px 4px rgba(255,255,255,1);
    text-shadow: 1px 1px 1px rgba(255,255,255,0.9), -1px -1px 1px rgba(0,0,0,0.2);
  }
  
  .black { 
    color: #2d3436; border: 1px solid #b2bec3;
    box-shadow: 
      0 1px 0 #c2c2c2, 0 2px 0 #b0b0b0, 0 3px 0 #9e9e9e, 0 4px 0 #8c8c8c,
      0 7px 12px rgba(0, 0, 0, 0.4), inset 0 2px 4px rgba(255,255,255,1);
    text-shadow: 1px 1px 1px rgba(255,255,255,0.9), -1px -1px 1px rgba(0,0,0,0.3);
  }
  
  /* 選中拔高狀態 */
  .selected { transform: scale(1.03) translateY(-12px) !important; z-index: 50; }
  .selected.red { 
    box-shadow: 
      0 1px 0 #cc6666, 0 3px 0 #b35959, 0 5px 0 #994d4d, 0 7px 0 #804040,
      0 16px 25px rgba(214, 48, 49, 0.45), inset 0 2px 5px rgba(255,255,255,1);
  }
  .selected.black { 
    box-shadow: 
      0 1px 0 #777, 0 3px 0 #555, 0 5px 0 #444, 0 7px 0 #333,
      0 16px 25px rgba(0, 0, 0, 0.5), inset 0 2px 5px rgba(255,255,255,1);
  }
</style>
</head>
<body>

<div id="hud">
  <div class="hud-box">
    <span class="hud-label">對弈陣營</span>
    <span id="status" class="hud-val">點擊棋子開局</span>
  </div>
  <div id="turn-indicator">初始化中</div>
</div>

<div id="board"></div>

<script>
const PIECES = {
  R_K: { name: '帥', color: 'red', rank: 7 }, R_A: { name: '仕', color: 'red', rank: 6 },
  R_E: { name: '相', color: 'red', rank: 5 }, R_R: { name: '俥', color: 'red', rank: 4 },
  R_H: { name: '傌', color: 'red', rank: 3 }, R_C: { name: '炮', color: 'red', rank: 2 },
  R_P: { name: '兵', color: 'red', rank: 1 }, B_K: { name: '將', color: 'black', rank: 7 },
  B_A: { name: '士', color: 'black', rank: 6 }, B_E: { name: '象', color: 'black', rank: 5 },
  B_R: { name: '車', color: 'black', rank: 4 }, B_H: { name: '馬', color: 'black', rank: 3 },
  B_C: { name: '砲', color: 'black', rank: 2 }, B_P: { name: '卒', color: 'black', rank: 1 }
};

let deck = [
  'R_K','R_A','R_A','R_E','R_E','R_R','R_R','R_H','R_H','R_C','R_C','R_P','R_P','R_P','R_P','R_P',
  'B_K','B_A','B_A','B_E','B_E','B_R','B_R','B_H','B_H','B_C','B_C','B_P','B_P','B_P','B_P','B_P'
];

let board = [];
let turn = 'player';
let playerColor = null;
let aiColor = null;
let selectedIdx = -1;
let isGameActive = true;

function initGame() {
  deck.sort(() => Math.random() - 0.5);
  board = deck.map(id => ({ piece: PIECES[id], isRevealed: false, isEmpty: false }));
  render();
  updateUI();
}

function render() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  board.forEach((cell, idx) => {
    const div = document.createElement('div');
    div.className = 'cell';
    div.onclick = () => handlePlayerAction(idx);
    
    if (!cell.isEmpty) {
      const pieceDiv = document.createElement('div');
      if (cell.isRevealed) {
        pieceDiv.className = `piece revealed ${cell.piece.color} ${idx === selectedIdx ? 'selected' : ''}`;
        pieceDiv.innerText = cell.piece.name;
      } else {
        pieceDiv.className = 'piece unrevealed';
      }
      div.appendChild(pieceDiv);
    }
    boardEl.appendChild(div);
  });
}

function updateUI() {
  if (playerColor) {
    const pStr = playerColor === 'red' ? '<span style="color:#ff7675">紅方</span>' : '<span style="color:#b2bec3">黑方</span>';
    const aStr = aiColor === 'red' ? '<span style="color:#ff7675">紅方</span>' : '<span style="color:#b2bec3">黑方</span>';
    document.getElementById('status').innerHTML = `您:${pStr} ｜ AI:${aStr}`;
  }
  
  const ti = document.getElementById('turn-indicator');
  if (turn === 'player') {
    ti.innerText = playerColor ? '您的回合' : '首翻開局';
    ti.style.background = 'rgba(46, 204, 113, 0.15)';
    ti.style.color = '#2ecc71';
    ti.style.borderColor = 'rgba(46, 204, 113, 0.3)';
  } else {
    ti.innerText = 'AI 思考中';
    ti.style.background = 'rgba(230, 126, 34, 0.15)';
    ti.style.color = '#e67e22';
    ti.style.borderColor = 'rgba(230, 126, 34, 0.3)';
  }
}

function isValidMove(from, to, currentBoard) {
  if (from === to) return false; 

  const dx = Math.abs((from % 4) - (to % 4));
  const dy = Math.abs(Math.floor(from / 4) - Math.floor(to / 4));
  const attacker = currentBoard[from].piece;
  const target = currentBoard[to];

  if (attacker.rank === 2) { 
    if (dx !== 0 && dy !== 0) return false; 
    let count = 0;
    let step = (dy === 0) ? (to > from ? 1 : -1) : (to > from ? 4 : -4);
    for (let i = from + step; i !== to; i += step) {
      if (!currentBoard[i].isEmpty) count++;
    }
    if (count === 0 && target.isEmpty && (dx + dy === 1)) return true;
    if (count === 1 && !target.isEmpty && target.isRevealed && target.piece.color !== attacker.color) return true;
    return false;
  } else {
    if (dx + dy !== 1) return false; 
    if (target.isEmpty) return true; 
    if (!target.isRevealed) return false; 
    if (target.piece.color === attacker.color) return false; 
    
    if (attacker.rank === 7 && target.piece.rank === 1) return false;
    if (attacker.rank === 1 && target.piece.rank === 7) return true;
    return attacker.rank >= target.piece.rank;
  }
}

function handlePlayerAction(idx) {
  if (turn !== 'player' || !isGameActive) return;
  const cell = board[idx];

  if (!cell.isEmpty && !cell.isRevealed) {
    if (selectedIdx !== -1) { selectedIdx = -1; render(); return; }
    executeFlip(idx, true);
  } 
  else if (!cell.isEmpty && cell.isRevealed && cell.piece.color === playerColor) {
    selectedIdx = idx === selectedIdx ? -1 : idx; 
    render();
  } 
  else if (selectedIdx !== -1) {
    if (isValidMove(selectedIdx, idx, board)) {
      executeMove(selectedIdx, idx);
    } else {
      selectedIdx = -1;
      render();
    }
  }
}

function executeFlip(idx, isPlayer) {
  board[idx].isRevealed = true;
  if (!playerColor) {
    playerColor = isPlayer ? board[idx].piece.color : (board[idx].piece.color === 'red' ? 'black' : 'red');
    aiColor = playerColor === 'red' ? 'black' : 'red';
  }
  endTurn();
}

function executeMove(from, to) {
  board[to] = board[from];
  board[from] = { isEmpty: true };
  endTurn();
}

function endTurn() {
  selectedIdx = -1;
  checkWin();
  if (!isGameActive) return;
  turn = turn === 'player' ? 'ai' : 'player';
  render();
  updateUI();
  if (turn === 'ai') setTimeout(aiPlay, 500); 
}

function checkWin() {
  let red = 0, black = 0;
  board.forEach(c => {
    if (!c.isEmpty) c.piece.color === 'red' ? red++ : black++;
  });
  if (red === 0 || black === 0) {
    isGameActive = false;
    render();
    setTimeout(() => alert(red === 0 ? "黑方獲勝！" : "紅方獲勝！"), 100);
  }
}

function isThreatenedByEnemy(targetIdx, myColor) {
  for (let i = 0; i < 32; i++) {
    const c = board[i];
    if (!c.isEmpty && c.isRevealed && c.piece.color !== myColor) {
      if (isValidMove(i, targetIdx, board)) return true;
    }
  }
  return false;
}

function aiPlay() {
  if (!isGameActive) return;
  let unrevealed = [];
  let myPieces = [];
  
  board.forEach((c, i) => {
    if (!c.isEmpty) {
      if (!c.isRevealed) unrevealed.push(i);
      else if (aiColor && c.piece.color === aiColor) myPieces.push(i);
    }
  });

  let actions = [];

  if (unrevealed.length > 0) {
    const rIdx = unrevealed[Math.floor(Math.random() * unrevealed.length)];
    actions.push({ type: 'flip', idx: rIdx, score: 14 + Math.random() * 5 });
  }

  if (aiColor) {
    for (let from of myPieces) {
      for (let to = 0; to < 32; to++) {
        if (isValidMove(from, to, board)) {
          let score = 2; 
          let target = board[to];
          
          if (!target.isEmpty) {
            score += target.piece.rank * 12;
            if (target.piece.rank === 7) score += 500;
          }
          
          if (isThreatenedByEnemy(from, aiColor)) {
            score += board[from].piece.rank * 10;
          }
          
          let tempFrom = board[from];
          let tempTo = board[to];
          board[from] = { isEmpty: true };
          board[to] = tempFrom;
          
          if (isThreatenedByEnemy(to, aiColor)) {
            score -= tempFrom.piece.rank * 18; 
          }
          
          board[from] = tempFrom;
          board[to] = tempTo;
          
          actions.push({ type: 'move', from, to, score: score + Math.random() });
        }
      }
    }
  }

  actions.sort((a, b) => b.score - a.score);
  let best = actions[0];
  
  if (!best || best.score < -100) { 
    alert("AI 判斷無路可走，玩家獲勝！"); 
    isGameActive = false; return; 
  }

  if (best.type === 'flip') executeFlip(best.idx, false);
  else executeMove(best.from, best.to);
}

initGame();
</script>
</body>
</html>
