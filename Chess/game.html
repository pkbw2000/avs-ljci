<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1a120e" />
    <title>暗棋 · 極簡 PWA</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/265f.png" />
    
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#1a120e] flex items-center justify-center min-h-screen text-stone-100 p-3 select-none">
    <div id="root" class="w-full max-w-md h-full flex flex-col items-center justify-center"></div>

    <script type="module">
        import React, { useState, useEffect, useCallback, memo } from 'https://esm.sh/react@18.2.0';
        import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';
        import { motion, AnimatePresence } from 'https://esm.sh/framer-motion@10.16.4';
        import htm from 'https://esm.sh/htm@3.1.1';

        const html = htm.bind(React.createElement);
        
        // 此處嵌入您的遊戲核心邏輯 (App 組件與邏輯)...
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(html`<${React.StrictMode}><App /><//>`);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .catch(err => console.log('SW 註冊失敗: ', err));
            });
        }
    </script>
</body>
</html>
