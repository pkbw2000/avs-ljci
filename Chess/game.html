<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1a120e" />
    <title>暗棋 · 極簡 PWA</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/265f.png" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        wood: {
                            50: '#f7efe6',
                            100: '#ede0d0',
                            200: '#dcc4aa',
                            300: '#c9a884',
                            400: '#b88f66',
                            500: '#a57850',
                            600: '#8a6240',
                            700: '#724e31',
                            800: '#5c3e26',
                            900: '#462f1d',
                            950: '#1a120e'
                        }
                    },
                    boxShadow: {
                        'inner-heavy': 'inset 0 4px 12px 0 rgba(0, 0, 0, 0.4)',
                        'wood-md': '0 4px 6px -1px rgba(70, 47, 29, 0.2), 0 2px 4px -1px rgba(70, 47, 29, 0.1)'
                    },
                    backgroundImage: {
                        'board-pattern': "radial-gradient(#8a6240 1px, transparent 1px)"
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&display=swap');
        .font-serif-tc { font-family: 'Noto Serif TC', serif; }
        body { background-color: #1a120e; -webkit-tap-highlight-color: transparent; }
        .piece-hidden {
            background: linear-gradient(135deg, #b88f66 0%, #8a6240 50%, #5c3e26 100%);
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.2), 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen text-stone-100 p-3 select-none overflow-hidden">
    <div id="root" class="w-full max-w-md h-full flex flex-col items-center justify-center"></div>

    <script type="module">
        // ---- [修改區塊]：修正為 GitHub Pages 最穩定的共用實體 ESM 載入點，杜絕 useState 衝突 ----
        import React, { useState, useEffect, useCallback, useRef, memo } from 'https://esm.sh/react@18.2.0';
        import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';
        import { motion, AnimatePresence } from 'https://esm.sh/framer-motion@10.16.4?external=react';
        import htm from 'https://esm.sh/htm@3.1.1?external=react';

        const html = htm.bind(React.createElement);

        // Web Audio API 電子合成音效（純代碼免外部音效檔，完美支援離線）
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            if (type === 'click') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.08);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now); osc.stop(now + 0.08);
            } else if (type === 'flip') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(440, now + 0.12);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now); osc.stop(now + 0.12);
            } else if (type === 'move') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(90, now + 0.1);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'capture') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.linearRampToValueAtTime(30, now + 0.25);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now); osc.stop(now + 0.25);
            } else if (type === 'win') {
                const notes = [261.6, 329.6, 392.0, 523.3];
                notes.forEach((freq, idx) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.frequency.setValueAtTime(freq, now + idx * 0.12);
                    g.gain.setValueAtTime(0.15, now + idx * 0.12);
                    g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.12 + 0.3);
                    o.start(now + idx * 0.12); o.stop(now + idx * 0.12 + 0.3);
                });
            }
        }

        const CHESS_TYPES = {
            red: { K: '帥', G: '仕', M: '相', R: '俥', N: '傌', C: '炮', P: '兵' },
            black: { k: '將', g: '士', m: '象', r: '車', n: '馬', c: '包', p: '卒' }
        };
        const RANK_ORDER = ['K', 'G', 'M', 'R', 'N', 'P', 'C'];
        const RANK_ORDER_B = ['k', 'g', 'm', 'r', 'n', 'p', 'c'];

        function getRank(sym) {
            const index = RANK_ORDER.indexOf(sym);
            return index !== -1 ? index : RANK_ORDER_B.indexOf(sym);
        }

        function createInitialBoard() {
            const pool = [
                'K', 'k',
                'G','G','g','g',
                'M','M','m','m',
                'R','R','r','r',
                'N','N','n','n',
                'C','C','c','c',
                'P','P','P','P','P','p','p','p','p','p'
            ];
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }
            return Array.from({ length: 32 }, (_, i) => ({
                id: i,
                symbol: pool[i],
                color: pool[i] === pool[i].toUpperCase() ? 'red' : 'black',
                isRevealed: false
            }));
        }

        function getRowCol(index) {
            return { row: Math.floor(index / 4), col: index % 4 };
        }
        function getIndex(row, col) {
            return row * 4 + col;
        }

        function isAdjacent(idx1, idx2) {
            const p1 = getRowCol(idx1);
            const p2 = getRowCol(idx2);
            return (Math.abs(p1.row - p2.row) === 1 && p1.col === p2.col) ||
                   (Math.abs(p1.col - p2.col) === 1 && p1.row === p2.row);
        }

        function countBetween(idx1, idx2, board) {
            const p1 = getRowCol(idx1);
            const p2 = getRowCol(idx2);
            if (p1.row !== p2.row && p1.col !== p2.col) return -1;
            let count = 0;
            if (p1.row === p2.row) {
                const min = Math.min(p1.col, p2.col);
                const max = Math.max(p1.col, p2.col);
                for (let c = min + 1; c < max; c++) {
                    if (board[getIndex(p1.row, c)]) count++;
                }
            } else {
                const min = Math.min(p1.row, p2.row);
                const max = Math.max(p1.row, p2.row);
                for (let r = min + 1; r < max; r++) {
                    if (board[getIndex(r, p1.col)]) count++;
                }
            }
            return count;
        }

        function canCapture(attacker, defender, distance, count) {
            const atkSym = attacker.symbol.toUpperCase();
            const defSym = defender.symbol.toUpperCase();
            if (atkSym === 'C') return count === 1;
            if (distance !== 1) return false;
            if (atkSym === 'K' && defSym === 'P') return false;
            if (atkSym === 'P' && defSym === 'K') return true;
            return getRank(attacker.symbol) <= getRank(defender.symbol);
        }

        function evaluateBoard(board, aiColor) {
            let score = 0;
            const values = { K: 900, G: 300, M: 120, R: 90, N: 60, C: 150, P: 30 };
            board.forEach(p => {
                if (!p) return;
                const sym = p.symbol.toUpperCase();
                const base = values[sym] || 0;
                let val = base;
                if (!p.isRevealed) {
                    val = base * 0.4;
                }
                if (p.color === aiColor) score += val;
                else score -= val;
            });
            return score;
        }

        function getPossibleMoves(board, turnColor) {
            const moves = [];
            board.forEach((p, from) => {
                if (!p || !p.isRevealed || p.color !== turnColor) return;
                const p1 = getRowCol(from);
                const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
                dirs.forEach(([dr, dc]) => {
                    const r2 = p1.row + dr, c2 = p1.col + dc;
                    if (r2 >= 0 && r2 < 8 && c2 >= 0 && c2 < 4) {
                        const to = getIndex(r2, c2);
                        const target = board[to];
                        if (!target) {
                            moves.push({ type: 'move', from, to });
                        } else if (target.isRevealed && target.color !== turnColor) {
                            if (canCapture(p, target, 1, 0)) {
                                moves.push({ type: 'capture', from, to });
                            }
                        }
                    }
                });
                if (p.symbol.toUpperCase() === 'C') {
                    for (let to = 0; to < 32; to++) {
                        const target = board[to];
                        if (target && target.isRevealed && target.color !== turnColor) {
                            const cnt = countBetween(from, to, board);
                            if (cnt === 1) {
                                moves.push({ type: 'capture', from, to });
                            }
                        }
                    }
                }
            });
            return moves;
        }

        function getBestMove(board, aiColor) {
            const moves = getPossibleMoves(board, aiColor);
            const unrevealed = board.reduce((acc, p, idx) => p && !p.isRevealed ? [...acc, idx] : acc, []);
            if (moves.length === 0 && unrevealed.length === 0) return null;
            
            let bestScore = -Infinity;
            let choices = [];

            moves.forEach(m => {
                const nextBoard = [...board];
                if (m.type === 'move') {
                    nextBoard[m.to] = nextBoard[m.from];
                    nextBoard[m.from] = null;
                } else {
                    nextBoard[m.to] = nextBoard[m.from];
                    nextBoard[m.from] = null;
                }
                const score = evaluateBoard(nextBoard, aiColor);
                if (score > bestScore) {
                    bestScore = score;
                    choices = [m];
                } else if (score === bestScore) {
                    choices.push(m);
                }
            });

            if (unrevealed.length > 0) {
                const revealScore = evaluateBoard(board, aiColor) - 5;
                if (revealScore > bestScore) {
                    bestScore = revealScore;
                    choices = unrevealed.map(idx => ({ type: 'reveal', to: idx }));
                } else if (revealScore === bestScore) {
                    unrevealed.forEach(idx => choices.push({ type: 'reveal', to: idx }));
                }
            }

            if (choices.length > 0) {
                return choices[Math.floor(Math.random() * choices.length)];
            }
            return null;
        }

        const Piece = memo(({ piece, index, isSelected, onClick }) => {
            if (!piece) {
                return html`
                    <div onClick=${onClick} class="aspect-square rounded-2xl bg-wood-950/40 border border-wood-900/30 shadow-inner-heavy flex items-center justify-center cursor-pointer transition-all duration-150 relative overflow-hidden backdrop-blur-xs">
                        <div class="absolute inset-0 bg-board-pattern bg-[size:8px_8px] opacity-10"></div>
                    </div>
                `;
            }

            const rCol = piece.color === 'red' ? 'text-red-500 border-red-700 bg-stone-900' : 'text-stone-400 border-stone-700 bg-stone-900';
            const selectStyle = isSelected ? 'ring-4 ring-amber-400 scale-[0.98] z-10 shadow-2xl' : 'shadow-wood-md';

            return html`
                <${motion.div}
                    layout
                    initial=${{ scale: 0.9, opacity: 0 }}
                    animate=${{ scale: 1, opacity: 1 }}
                    exit=${{ scale: 0.8, opacity: 0 }}
                    transition=${{ type: 'spring', stiffness: 350, damping: 25 }}
                    onClick=${onClick}
                    class="aspect-square rounded-2xl font-serif-tc font-black text-2xl flex items-center justify-center cursor-pointer border-2 transition-all duration-150 select-none relative ${piece.isRevealed ? rCol : 'piece-hidden'} ${selectStyle}"
                >
                    ${piece.isRevealed 
                        ? html`
                            <span class="transform transition-transform duration-150">${CHESS_TYPES[piece.color][piece.symbol] || piece.symbol}</span>
                          `
                        : html`<div class="w-6 h-6 border-2 border-wood-600/30 rounded-full flex items-center justify-center opacity-40 text-[10px]">♟</div>`
                    }
                <//>
            `;
        });

        function App() {
            const [board, setBoard] = useState(createInitialBoard);
            const [selected, setSelected] = useState(null);
            const [turn, setTurn] = useState(null); 
            const [gameMode, setGameMode] = useState('pve'); 
            const [winner, setWinner] = useState(null);
            const [counts, setCounts] = useState({ red: 16, black: 16 });

            useEffect(() => {
                let r = 0, b = 0;
                board.forEach(p => {
                    if (p) { p.color === 'red' ? r++ : b++; }
                });
                setCounts({ red: r, black: b });
                
                if (turn !== null) {
                    if (r === 0) { setWinner('black'); playSound('win'); }
                    else if (b === 0) { setWinner('red'); playSound('win'); }
                }
            }, [board, turn]);

            useEffect(() => {
                if (gameMode === 'pve' && turn === 'black' && !winner) {
                    const timer = setTimeout(() => {
                        const aiMove = getBestMove(board, 'black');
                        if (!aiMove) {
                            setWinner('red');
                            playSound('win');
                            return;
                        }
                        if (aiMove.type === 'reveal') {
                            setBoard(prev => {
                                const next = [...prev];
                                next[aiMove.to] = { ...next[aiMove.to], isRevealed: true };
                                return next;
                            });
                            playSound('flip');
                            setTurn('red');
                        } else {
                            setBoard(prev => {
                                const next = [...prev];
                                const isCap = next[aiMove.to] !== null;
                                next[aiMove.to] = next[aiMove.from];
                                next[aiMove.from] = null;
                                playSound(isCap ? 'capture' : 'move');
                                return next;
                            });
                            setTurn('red');
                        }
                    }, 500);
                    return () => clearTimeout(timer);
                }
            }, [turn, gameMode, board, winner]);

            const handleTileClick = useCallback((index) => {
                if (winner) return;
                if (gameMode === 'pve' && turn === 'black') return;

                const piece = board[index];

                if (selected === null) {
                    if (!piece) return;
                    if (!piece.isRevealed) {
                        setBoard(prev => {
                            const next = [...prev];
                            next[index] = { ...next[index], isRevealed: true };
                            return next;
                        });
                        playSound('flip');
                        if (turn === null) {
                            setTurn(piece.color);
                        } else {
                            setTurn(prev => prev === 'red' ? 'black' : 'red');
                        }
                    } else {
                        if (turn !== null && piece.color !== turn) return;
                        setSelected(index);
                        playSound('click');
                    }
                } else {
                    if (selected === index) {
                        setSelected(null);
                        playSound('click');
                        return;
                    }
                    const activePiece = board[selected];
                    if (piece && piece.isRevealed && piece.color === activePiece.color) {
                        setSelected(index);
                        playSound('click');
                        return;
                    }

                    const p1 = getRowCol(selected);
                    const p2 = getRowCol(index);
                    const dist = Math.abs(p1.row - p2.row) + Math.abs(p1.col - p2.col);

                    if (!piece) {
                        if (activePiece.symbol.toUpperCase() === 'C') {
                            const cnt = countBetween(selected, index, board);
                            if (cnt !== 0) { setSelected(null); return; }
                        } else {
                            if (dist !== 1) { setSelected(null); return; }
                        }
                        setBoard(prev => {
                            const next = [...prev];
                            next[index] = next[selected];
                            next[selected] = null;
                            return next;
                        });
                        playSound('move');
                        setSelected(null);
                        setTurn(prev => prev === 'red' ? 'black' : 'red');
                    } else {
                        if (piece.color === activePiece.color || !piece.isRevealed) {
                            setSelected(null);
                            return;
                        }
                        const cnt = countBetween(selected, index, board);
                        if (canCapture(activePiece, piece, dist, cnt)) {
                            setBoard(prev => {
                                const next = [...prev];
                                next[index] = next[selected];
                                next[selected] = null;
                                return next;
                            });
                            playSound('capture');
                            setSelected(null);
                            setTurn(prev => prev === 'red' ? 'black' : 'red');
                        } else {
                            setSelected(null);
                        }
                    }
                }
            }, [board, selected, turn, gameMode, winner]);

            const handleRestart = useCallback(() => {
                setBoard(createInitialBoard());
                setSelected(null);
                setTurn(null);
                setWinner(null);
                playSound('click');
            }, []);

            const toggleMode = useCallback(() => {
                setGameMode(prev => prev === 'pve' ? 'pvp' : 'pve');
                handleRestart();
            }, [handleRestart]);

            return html`
                <div class="w-full flex flex-col gap-4 p-4 rounded-3xl bg-gradient-to-b from-wood-900 to-wood-950 border border-wood-800/60 shadow-2xl relative overflow-hidden max-h-[96vh]">
                    <div class="flex items-center justify-between border-b border-wood-800/60 pb-3 flex-shrink-0">
                        <div>
                            <h1 class="text-xl font-black font-serif-tc text-wood-100 tracking-wider flex items-center gap-2">
                                <span>暗棋 · 極簡 PWA</span>
                            </h1>
                            <p class="text-[10px] text-wood-400 mt-0.5 tracking-wide">
                                ${gameMode === 'pve' ? '🤖 經典人機對戰模式' : '👥 本地雙人棋局對弈'}
                            </p>
                        </div>
                        <div class="flex items-center gap-1.5 text-xs font-black bg-wood-950/80 px-3 py-1.5 rounded-xl border border-wood-800/40">
                            <span class="w-2 h-2 rounded-full ${winner ? 'bg-stone-500 animate-ping' : 'bg-green-500 animate-pulse'}"></span>
                            <span class="text-wood-300 tracking-widest">
                                ${winner ? '棋局已結束' : turn === null ? '翻首子決定陣營' : turn === 'red' ? '紅方回合' : '黑方回合'}
                            </span>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2 flex-shrink-0">
                        <div class="bg-stone-900/40 border border-wood-900/40 rounded-2xl p-2.5 flex items-center justify-between shadow-inner">
                            <span class="font-serif-tc font-black text-red-500 text-sm flex items-center gap-1.5">🔴 紅方帥營</span>
                            <span class="font-mono text-sm font-black bg-red-950/60 border border-red-900/30 px-2 py-0.5 rounded-lg text-red-400">${counts.red} 子</span>
                        </div>
                        <div class="bg-stone-900/40 border border-wood-900/40 rounded-2xl p-2.5 flex items-center justify-between shadow-inner">
                            <span class="font-serif-tc font-black text-stone-400 text-sm flex items-center gap-1.5">⚫ 黑方將營</span>
                            <span class="font-mono text-sm font-black bg-stone-950/60 border border-stone-800/30 px-2 py-0.5 rounded-lg text-stone-400">${counts.black} 子</span>
                        </div>
                    </div>

                    <div class="bg-gradient-to-br from-wood-950 via-[#1f1612] to-wood-950 p-2 rounded-2xl border border-wood-900/60 shadow-inner-heavy flex-grow flex items-center justify-center">
                        <div class="grid grid-cols-4 gap-1.5 w-full aspect-[4/8] max-h-[58vh]">
                            ${board.map((piece, idx) => html`
                                <<${Piece}
                                    key=${idx}
                                    index=${idx}
                                    piece=${piece}
                                    isSelected=${selected === idx}
                                    onClick=${() => handleTileClick(idx)}
                                />
                            `)}
                        </div>
                    </div>

                    <div class="flex flex-col gap-2 mt-1 flex-shrink-0">
                        <${AnimatePresence}>
                            ${winner && html`
                                <${motion.div}
                                    initial=${{ opacity: 0, y: 10 }}
                                    animate=${{ opacity: 1, y: 0 }}
                                    exit=${{ opacity: 0, y: -10 }}
                                    class="p-3 rounded-2xl text-center font-serif-tc font-black border text-sm tracking-widest bg-amber-950/40 border-amber-500/30 text-amber-300"
                                >
                                    🏆 恭喜 — ${winner === 'red' ? '🔴 紅方帥營' : '⚫ 黑方將營'} 獲得本局勝利！
                                <//>
                            `}
                        <//>

                        <div class="grid grid-cols-2 gap-3 px-1 flex-shrink-0">
                            <button onClick=${toggleMode} class="py-3.5 rounded-2xl text-sm font-black transition-all duration-150 border tracking-widest bg-wood-900/40 border-wood-700/60 shadow-md text-amber-300 active:scale-[0.98]">
                                ${gameMode === 'pvp' ? '👥 雙人對戰' : '🤖 電腦對戰'}
                            </button>
                            <button onClick=${handleRestart} class="py-3.5 rounded-2xl bg-gradient-to-r from-wood-700 to-wood-600 hover:from-wood-600 hover:to-wood-500 active:scale-[0.98] transition-all duration-150 text-wood-100 text-sm font-black border border-wood-500/40 backdrop-blur-sm shadow-md tracking-widest">
                                ↺ 重新新局
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(html`<${React.StrictMode}><${App} /><//>`);

        // 註冊 Service Worker（確保在 DOM 載入後執行）
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('ServiceWorker 註冊成功，範圍: ', reg.scope))
                    .catch(err => console.log('ServiceWorker 註冊失敗: ', err));
            });
        }
    </script>
</body>
</html>
