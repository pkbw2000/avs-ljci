<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>數獨牛 - 邏輯推理大師</title>
<style>
:root{
  --bg:#e8f0fe;--surface:#fff;--text:#1a1a2e;--text-sec:#555;--text-tri:#999;
  --border:0.5px solid #d0d7e0;--radius:12px;--radius-lg:20px;
  --c0:#fbbf24;--c1:#34d399;--c2:#60a5fa;--c3:#f87171;--c4:#c084fc;
  --c5:#fb923c;--c6:#a3e635;--c7:#22d3ee;--c8:#e879f9;--c9:#94a3b8;
  --accent:#6366f1;--accent-light:#eef2ff;--danger:#ef4444;--success:#22c55e;
  --shadow:0 2px 12px rgba(0,0,0,.06);--shadow-lg:0 8px 30px rgba(0,0,0,.12);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0f172a;--surface:#1e293b;--text:#e2e8f0;--text-sec:#94a3b8;--text-tri:#64748b;
    --border:0.5px solid #334155;--shadow:0 2px 12px rgba(0,0,0,.3);--shadow-lg:0 8px 30px rgba(0,0,0,.4);
    --accent-light:#312e81;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;font-family:-apple-system,'PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);transition:background .3s}
#app{width:100%;max-width:480px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}

/* Menu */
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;z-index:20;background:var(--bg)}
.menu-logo{font-size:64px;margin-bottom:8px;animation:float 3s ease-in-out infinite}
.menu-title{font-size:32px;font-weight:800;margin:0 0 4px;background:linear-gradient(135deg,var(--accent),#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.menu-sub{font-size:14px;color:var(--text-tri);margin-bottom:30px}
.menu-btn{width:85%;max-width:320px;padding:16px;border:none;border-radius:var(--radius-lg);font-size:17px;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .15s;margin-bottom:10px}
.btn-primary{background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff;box-shadow:0 6px 20px rgba(99,102,241,.3)}
.btn-primary:active{transform:scale(.96)}
.btn-secondary{background:var(--surface);color:var(--text);border:var(--border)}
.btn-secondary:active{transform:scale(.96)}
.menu-stats{margin-top:20px;font-size:13px;color:var(--text-tri);text-align:center}
.menu-stats b{color:var(--accent);font-size:20px}

/* Level Select */
#levelSelect{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg);z-index:15}
.ls-header{display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:var(--border)}
.ls-back{font-size:22px;cursor:pointer;color:var(--accent);padding:4px 8px}
.ls-title{font-size:18px;font-weight:700}
.ls-grid{flex:1;overflow-y:auto;padding:15px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.ls-cell{aspect-ratio:1;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:700;cursor:pointer;transition:transform .15s;position:relative}
.ls-cell:active{transform:scale(.9)}
.ls-cell.unlocked{background:var(--surface);border:var(--border);color:var(--text)}
.ls-cell.locked{background:var(--bg);color:var(--text-tri);opacity:.4}
.ls-cell.completed{background:var(--accent-light);border:1px solid var(--accent);color:var(--accent)}
.ls-cell .sz{font-size:10px;font-weight:400;color:var(--text-tri)}
.ls-cell.current{box-shadow:0 0 0 3px var(--accent)}

/* Game */
#game{display:none;flex-direction:column;width:100%;height:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:8px}
.topbar-left{display:flex;align-items:center;gap:8px}
.btn-icon{width:36px;height:36px;border-radius:10px;border:none;background:var(--surface);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);transition:transform .1s}
.btn-icon:active{transform:scale(.88)}
.level-badge{font-size:13px;font-weight:700;color:var(--text);background:var(--surface);padding:6px 14px;border-radius:20px;box-shadow:var(--shadow)}
.lives{display:flex;gap:4px;font-size:20px}
.lives .heart.lost{filter:grayscale(1) opacity(.3);transform:scale(.75);transition:all .2s}

.rules{display:flex;gap:6px;padding:0 12px;margin-bottom:4px}
.rule{flex:1;background:var(--surface);border-radius:10px;padding:6px 8px;font-size:10px;color:var(--text-sec);display:flex;align-items:center;justify-content:center;gap:4px;box-shadow:var(--shadow);text-align:center}

.info{display:flex;justify-content:space-between;padding:0 16px;margin:6px 0 2px}
.info-item{background:var(--surface);padding:4px 12px;border-radius:16px;font-size:13px;color:var(--text-sec);display:flex;align-items:center;gap:4px;box-shadow:var(--shadow)}
.info-item b{color:var(--text)}

.board-area{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 12px;min-height:0}
#board{display:grid;gap:3px;width:100%;aspect-ratio:1;max-width:420px}

.cell{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:transform .12s;overflow:hidden}
.cell:active{transform:scale(.9)}
.cell .mark{font-size:min(6vw,30px);animation:pop .2s cubic-bezier(.18,.89,.32,1.28)}
.cell .queen{font-size:min(6.5vw,32px);animation:pop .2s cubic-bezier(.18,.89,.32,1.28)}
.cell .xmark{color:var(--danger);opacity:.5;font-size:min(5vw,24px);font-weight:900}
.cell .err{color:var(--danger);font-size:min(5vw,24px);animation:shake .4s}
.cell.conflict{animation:flash .5s}
.cell.hint-glow{animation:hintPulse 1s infinite alternate}
.cell.tut-target{z-index:5}
.cell.tut-target::after{content:'';position:absolute;inset:-4px;border:3px solid var(--accent);border-radius:12px;animation:pulse 1s infinite;pointer-events:none}

@keyframes pop{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes flash{0%,100%{filter:none}50%{filter:brightness(1.3) saturate(1.5)}}
@keyframes hintPulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}100%{box-shadow:0 0 0 8px rgba(34,197,94,0)}}
@keyframes pulse{0%{transform:scale(.92);opacity:1}50%{transform:scale(1.08);opacity:.5}100%{transform:scale(.92);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

/* Tutorial Panel */
#tutPanel{display:none;background:var(--surface);border-radius:var(--radius);margin:0 16px 6px;padding:12px 14px;box-shadow:var(--shadow-lg);border-left:4px solid var(--accent)}
#tutPanel.show{display:flex;flex-direction:column;gap:6px;animation:slideUp .3s}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.tut-h{display:flex;align-items:center;gap:8px}
.tut-ico{font-size:22px}
.tut-t{font-weight:700;font-size:14px}
.tut-d{font-size:13px;color:var(--text-sec);line-height:1.4}
.tut-l{background:var(--accent-light);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--accent);line-height:1.4}

/* Footer */
.footer{display:flex;justify-content:center;gap:30px;padding:8px 0 20px}
.fbtn{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--text-tri);font-size:11px;transition:transform .1s}
.fbtn:active{transform:scale(.9)}
.fbtn .ficon{width:44px;height:44px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:var(--shadow)}

/* Modal */
#modal{position:absolute;inset:0;z-index:500;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);backdrop-filter:blur(6px)}
#modal.show{display:flex}
.modal-card{background:var(--surface);width:85%;max-width:340px;border-radius:24px;padding:28px 24px;box-shadow:var(--shadow-lg);text-align:center;animation:pop .35s cubic-bezier(.18,.89,.32,1.28)}
.modal-ico{font-size:52px;margin-bottom:8px}
.modal-t{font-size:20px;font-weight:800;margin:0 0 8px}
.modal-d{font-size:14px;color:var(--text-sec);line-height:1.5;margin-bottom:16px}
.modal-stat{display:flex;justify-content:center;gap:20px;margin-bottom:16px}
.modal-stat div{font-size:12px;color:var(--text-tri)}
.modal-stat b{display:block;font-size:18px;color:var(--accent)}
.modal-btn{width:100%;padding:13px;border:none;border-radius:16px;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:8px;transition:transform .1s}
.modal-btn:active{transform:scale(.96)}
.m-btn-p{background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#fff}
.m-btn-s{background:var(--bg);color:var(--text);border:var(--border)}
</style>
</head>
<body>
<div id="app">
<div id="menu">
<div class="menu-logo">🐮</div>
<h1 class="menu-title">數獨牛</h1>
<p class="menu-sub">邏輯推理大師 · 無限關卡</p>
<button class="menu-btn btn-primary" onclick="enterGame()">開始挑戰</button>
<button class="menu-btn btn-secondary" onclick="showLevelSelect()">選擇關卡</button>
<div class="menu-stats" id="menuStats"></div>
</div>

<div id="levelSelect">
<div class="ls-header">
<span class="ls-back" onclick="showMenu()">←</span>
<span class="ls-title">選擇關卡</span>
</div>
<div class="ls-grid" id="lsGrid"></div>
</div>

<div id="game">
<div class="topbar">
<div class="topbar-left">
<button class="btn-icon" onclick="showMenu()">←</button>
<span class="level-badge" id="lvBadge">第 1 關</span>
</div>
<div class="lives" id="lives"><span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span></div>
</div>
<div class="rules">
<div class="rule">🎨 每色1牛</div>
<div class="rule">⬜ 行列唯一</div>
<div class="rule">🚫 不相鄰</div>
</div>
<div class="info">
<div class="info-item">🐮 剩 <b id="remain">0</b></div>
<div class="info-item" id="timer">⏱️ 01:00</div>
</div>
<div class="board-area"><div id="board"></div></div>
<div id="tutPanel">
<div class="tut-h"><span class="tut-ico" id="tutIco">📖</span><span class="tut-t" id="tutT"></span></div>
<div class="tut-d" id="tutD"></div>
<div class="tut-l" id="tutL"></div>
</div>
<div class="footer">
<div class="fbtn" onclick="doHint()"><div class="ficon">💡</div>提示</div>
<div class="fbtn" onclick="doUndo()"><div class="ficon">↩️</div>撤回</div>
<div class="fbtn" onclick="doReset()"><div class="ficon">🔄</div>重玩</div>
</div>
</div>

<div id="modal">
<div class="modal-card">
<div class="modal-ico" id="mIco"></div>
<h2 class="modal-t" id="mT"></h2>
<p class="modal-d" id="mD"></p>
<div class="modal-stat" id="mStat"></div>
<button class="modal-btn m-btn-p" id="mBtn1" onclick="modalAction1()"></button>
<button class="modal-btn m-btn-s" id="mBtn2" onclick="modalAction2()"></button>
</div>
</div>
</div>

<script>
// ===================== Seeded RNG (Mulberry32) =====================
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// ===================== Color Palette =====================
const PALETTE=['#fbbf24','#34d399','#60a5fa','#f87171','#c084fc','#fb923c','#a3e635','#22d3ee','#e879f9'];
const COLOR_NAMES={'#fbbf24':'黃','#34d399':'綠','#60a5fa':'藍','#f87171':'紅','#c084fc':'紫','#fb923c':'橙','#a3e635':'萊姆','#22d3ee':'青','#e879f9':'洋紅'};

// ===================== N-Queens Solver (Backtracking) =====================
function solveNQueens(n){
  const solutions=[];
  const cols=Array(n).fill(-1);
  function safe(r,c){
    for(let i=0;i<r;i++){
      if(cols[i]===c)return false;
      if(Math.abs(cols[i]-c)===Math.abs(i-r))return false;
    }
    return true;
  }
  function bt(r){
    if(r===n){
      solutions.push(cols.slice());
      return;
    }
    for(let c=0;c<n;c++){
      if(safe(r,c)){
        cols[r]=c;
        bt(r+1);
        cols[r]=-1;
      }
    }
  }
  bt(0);
  return solutions;
}

// Pick a solution where no two queens are adjacent (including diagonal)
function pickNonAdjacentSolution(n,rng){
  const all=solveNQueens(n);
  // shuffle
  for(let i=all.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[all[i],all[j]]=[all[j],all[i]]}
  for(const sol of all){
    let ok=true;
    for(let i=0;i<n&&ok;i++){
      for(let j=i+1;j<n;j++){
        if(Math.abs(i-j)<=1&&Math.abs(sol[i]-sol[j])<=1){ok=false;break}
      }
    }
    if(ok)return sol;
  }
  // fallback: return first
  return all[0]||Array(n).fill(0).map((_,i)=>i);
}

// ===================== Color Region Generator (Weighted Random Growth) =====================
function generateRegions(size,queenCols,rng){
  const regions=Array.from({length:size},()=>Array(size).fill(-1));
  const queens=queenCols.map((c,r)=>({r,c,id:r}));

  // Multi-source BFS with randomized priority to create irregular regions
  const queue=[];
  const visited=Array.from({length:size},()=>Array(size).fill(false));
  for(const q of queens){
    regions[q.r][q.c]=q.id;
    visited[q.r][q.c]=true;
    queue.push({...q,priority:rng()});
  }

  while(queue.length>0){
    // Sort by priority (lowest first = grows slowest), creates irregular shapes
    queue.sort((a,b)=>a.priority-b.priority);
    // Take a random chunk from the front to add variance
    const take=Math.min(queue.length,1+Math.floor(rng()*3));
    const batch=queue.splice(0,take);
    for(const q of batch){
      const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
      // Shuffle directions
      for(let i=dirs.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[dirs[i],dirs[j]]=[dirs[j],dirs[i]]}
      for(const [dr,dc] of dirs){
        const nr=q.r+dr,nc=q.c+dc;
        if(nr<0||nr>=size||nc<0||nc>=size)continue;
        if(visited[nr][nc])continue;
        visited[nr][nc]=true;
        regions[nr][nc]=q.id;
        queue.push({r:nr,c:nc,id:q.id,priority:q.priority+rng()*0.5});
      }
    }
  }

  // Verify each region is connected and fix disconnected cells
  for(let qid=0;qid<size;qid++){
    const qf=Array.from({length:size},()=>Array(size).fill(false));
    const stack=[{r:qid,c:queenCols[qid]}];
    qf[qid][queenCols[qid]]=true;
    while(stack.length){
      const{r,c}=stack.pop();
      for(const[dr,dc]of[[-1,0],[1,0],[0,-1],[0,1]]){
        const nr=r+dr,nc=c+dc;
        if(nr<0||nr>=size||nc<0||nc>=size)continue;
        if(qf[nr][nc])continue;
        if(regions[nr][nc]!==qid)continue;
        qf[nr][nc]=true;
        stack.push({r:nr,c:nc});
      }
    }
    for(let r=0;r<size;r++)for(let c=0;c<size;c++){
      if(regions[r][c]===qid&&!qf[r][c]){
        for(const[dr,dc]of[[-1,0],[1,0],[0,-1],[0,1]]){
          const nr=r+dr,nc=c+dc;
          if(nr<0||nr>=size||nc<0||nc>=size)continue;
          if(regions[nr][nc]!==qid&&regions[nr][nc]!==-1){
            regions[r][c]=regions[nr][nc];
            break;
          }
        }
      }
    }
  }

  const colors=Array.from({length:size},()=>Array(size).fill('#fff'));
  for(let r=0;r<size;r++)for(let c=0;c<size;c++){
    colors[r][c]=PALETTE[regions[r][c]%PALETTE.length];
  }
  return colors;
}

// ===================== Constraint Propagation Solver =====================
// Simulates human logic: place queens, propagate exclusions, find forced cells.
// Returns { solvable: bool, chainLength: int } where chainLength = reasoning steps.
function isSolvableByLogic(size,colors,queenCols){
  const regionMap={};
  let rid=0;
  for(let r=0;r<size;r++)for(let c=0;c<size;c++){
    const col=colors[r][c];
    if(!(col in regionMap))regionMap[col]=rid++;
  }

  // board: 0=unknown, 1=queen, -1=excluded
  const board=Array.from({length:size},()=>Array(size).fill(0));
  let placed=0;
  let chainLength=0;

  function propagate(r,c){
    // Exclude all cells conflicting with queen at (r,c)
    const reg=regionMap[colors[r][c]];
    for(let rr=0;rr<size;rr++){
      for(let cc=0;cc<size;cc++){
        if(board[rr][cc]!==0)continue;
        if(rr===r||cc===c){board[rr][cc]=-1;continue}
        if(regionMap[colors[rr][cc]]===reg){board[rr][cc]=-1;continue}
        if(Math.abs(rr-r)<=1&&Math.abs(cc-c)<=1){board[rr][cc]=-1;continue}
      }
    }
  }

  while(placed<size){
    let progress=false;

    // Find forced queen: only unknown cell in a row
    for(let r=0;r<size;r++){
      const unknowns=[];
      let hasQ=false;
      for(let c=0;c<size;c++){
        if(board[r][c]===0)unknowns.push(c);
        if(board[r][c]===1)hasQ=true;
      }
      if(!hasQ&&unknowns.length===1){
        board[r][unknowns[0]]=1;
        placed++;
        chainLength++;
        propagate(r,unknowns[0]);
        progress=true;
      }
    }

    // Find forced queen: only unknown cell in a column
    if(!progress){
      for(let c=0;c<size;c++){
        const unknowns=[];
        let hasQ=false;
        for(let r=0;r<size;r++){
          if(board[r][c]===0)unknowns.push(r);
          if(board[r][c]===1)hasQ=true;
        }
        if(!hasQ&&unknowns.length===1){
          board[unknowns[0]][c]=1;
          placed++;
          chainLength++;
          propagate(unknowns[0],c);
          progress=true;
        }
      }
    }

    // Find forced queen: only unknown cell in a color region
    if(!progress){
      const groups={};
      for(let r=0;r<size;r++)for(let c=0;c<size;c++){
        const col=colors[r][c];
        if(!groups[col])groups[col]=[];
        groups[col].push({r,c});
      }
      for(const col in groups){
        const cells=groups[col];
        const hasQ=cells.some(({r,c})=>board[r][c]===1);
        const unknowns=cells.filter(({r,c})=>board[r][c]===0);
        if(!hasQ&&unknowns.length===1){
          board[unknowns[0].r][unknowns[0].c]=1;
          placed++;
          chainLength++;
          propagate(unknowns[0].r,unknowns[0].c);
          progress=true;
          break;
        }
      }
    }

    // Advanced: pointing pairs/triples - if a region's unknowns are all in one row or column,
    // exclude other cells in that row/column
    if(!progress){
      const groups={};
      for(let r=0;r<size;r++)for(let c=0;c<size;c++){
        const col=colors[r][c];
        if(!groups[col])groups[col]=[];
        groups[col].push({r,c});
      }
      for(const col in groups){
        const cells=groups[col];
        const hasQ=cells.some(({r,c})=>board[r][c]===1);
        if(hasQ)continue;
        const unknowns=cells.filter(({r,c})=>board[r][c]===0);
        if(unknowns.length<2)continue;
        // Check if all unknowns are in the same row
        const rows=[...new Set(unknowns.map(u=>u.r))];
        if(rows.length===1){
          // All unknowns in this region are in one row - exclude other cells in that row
          for(let c=0;c<size;c++){
            if(board[rows[0]][c]===0&&colors[rows[0]][c]!==col){
              board[rows[0]][c]=-1;progress=true;
            }
          }
        }
        // Check if all unknowns are in the same column
        if(!progress){
          const cols=[...new Set(unknowns.map(u=>u.c))];
          if(cols.length===1){
            for(let r=0;r<size;r++){
              if(board[r][cols[0]]===0&&colors[r][cols[0]]!==col){
                board[r][cols[0]]=-1;progress=true;
              }
            }
          }
        }
      }
    }

    // Advanced: hidden single in row - if a row's queen can only go in one region,
    // and that region doesn't have a queen yet, exclude other cells in that region
    if(!progress){
      for(let r=0;r<size&&!progress;r++){
        let hasQ=false;
        const unknowns=[];
        for(let c=0;c<size;c++){
          if(board[r][c]===1)hasQ=true;
          if(board[r][c]===0)unknowns.push(c);
        }
        if(hasQ||unknowns.length<2)continue;
        // Check if all unknown cells in this row belong to the same region
        const regions=new Set(unknowns.map(c=>regionMap[colors[r][c]]));
        if(regions.size===1){
          const reg=[...regions][0];
          // Exclude other cells in this region (not in this row)
          for(let rr=0;rr<size;rr++){
            if(rr===r)continue;
            for(let c=0;c<size;c++){
              if(board[rr][c]===0&&regionMap[colors[rr][c]]===reg){
                board[rr][c]=-1;progress=true;
              }
            }
          }
        }
      }
    }

    // Advanced: hidden single in column - same logic for columns
    if(!progress){
      for(let c=0;c<size&&!progress;c++){
        let hasQ=false;
        const unknowns=[];
        for(let r=0;r<size;r++){
          if(board[r][c]===1)hasQ=true;
          if(board[r][c]===0)unknowns.push(r);
        }
        if(hasQ||unknowns.length<2)continue;
        const regions=new Set(unknowns.map(r=>regionMap[colors[r][c]]));
        if(regions.size===1){
          const reg=[...regions][0];
          for(let cc=0;cc<size;cc++){
            if(cc===c)continue;
            for(let r=0;r<size;r++){
              if(board[r][cc]===0&&regionMap[colors[r][cc]]===reg){
                board[r][cc]=-1;progress=true;
              }
            }
          }
        }
      }
    }

    if(!progress)break;
  }

  // Verify: placed queens match the provided solution
  let matches=true;
  for(let r=0;r<size&&matches;r++){
    let qCol=-1;
    for(let c=0;c<size;c++){
      if(board[r][c]===1){qCol=c;break}
    }
    if(qCol!==queenCols[r])matches=false;
  }

  return {solvable: placed===size && matches, chainLength};
}

// Unique solution check via backtracking (fallback for larger boards)
function hasUniqueSolution(size,colors,queenCols){
  const regionMap={};
  let rid=0;
  for(let r=0;r<size;r++)for(let c=0;c<size;c++){
    const col=colors[r][c];
    if(!(col in regionMap))regionMap[col]=rid++;
  }
  const cols=Array(size).fill(-1);
  const usedCols=Array(size).fill(false);
  const usedRegions=Array(rid).fill(false);
  let solutionCount=0;

  function backtrack(r){
    if(solutionCount>1)return;
    if(r===size){solutionCount++;return}
    for(let c=0;c<size;c++){
      if(usedCols[c])continue;
      const reg=regionMap[colors[r][c]];
      if(usedRegions[reg])continue;
      if(r>0&&cols[r-1]>=0&&Math.abs(cols[r-1]-c)<=1)continue;
      cols[r]=c;usedCols[c]=true;usedRegions[reg]=true;
      backtrack(r+1);
      cols[r]=-1;usedCols[c]=false;usedRegions[reg]=false;
      if(solutionCount>1)return;
    }
  }
  backtrack(0);
  return solutionCount===1;
}

// ===================== Level Generator =====================
function getLevelSize(level){
  // level is 0-indexed
  if(level<5)return 4;
  if(level<15)return 5;
  if(level<30)return 6;
  if(level<50)return 7;
  if(level<80)return 8;
  return 9;
}

function getTimeForSize(size){
  return{4:90,5:120,6:180,7:240,8:300,9:360}[size]||120;
}

function generateLevel(level){
  const size=getLevelSize(level);
  const seed=level*1000+42;
  const rng=mulberry32(seed);

  // Target reasoning chain length increases within same size
  // Map level to position within its size band (0-indexed)
  const bandStart={4:0,5:5,6:15,7:30,8:50,9:80};
  const bandStartLv=bandStart[size]||0;
  const posInBand=level-bandStartLv;
  const bandSize={4:5,5:10,6:15,7:20,8:30,9:20}[size]||20;
  // Target: minimum chain length grows from size to size*2 across the band
  const minChain=size+Math.floor((posInBand/bandSize)*size);

  let bestLevel=null;
  let bestChain=0;

  const maxAttempts = size<=7 ? 300 : 80;
  for(let attempt=0;attempt<maxAttempts;attempt++){
    const queenCols=pickNonAdjacentSolution(size,rng);
    const colors=generateRegions(size,queenCols,rng);

    // 1. Each color has exactly one queen
    const colorSet=new Set();
    let valid=true;
    for(let r=0;r<size&&valid;r++){
      const c=queenCols[r];
      const col=colors[r][c];
      if(colorSet.has(col)){valid=false;break}
      colorSet.add(col);
    }
    if(!valid)continue;

    // 2. No two queens adjacent
    let adj=false;
    for(let i=0;i<size-1&&!adj;i++){
      if(Math.abs(queenCols[i]-queenCols[i+1])<=1)adj=true;
    }
    if(adj)continue;

    // 3. Check solvable by constraint propagation
    const result=isSolvableByLogic(size,colors,queenCols);
    if(result.solvable){
      // Prefer levels that meet or exceed the target chain length
      if(result.chainLength>=minChain){
        return{size,colors,solution:queenCols.map((c,r)=>({x:c,y:r})),chainLength:result.chainLength};
      }
      // Track best fallback
      if(result.chainLength>bestChain){
        bestChain=result.chainLength;
        bestLevel={size,colors,solution:queenCols.map((c,r)=>({x:c,y:r})),chainLength:result.chainLength};
      }
    } else {
      // For large boards where propagation stalls, accept if unique solution exists
      if(!bestLevel && hasUniqueSolution(size,colors,queenCols)){
        bestLevel={size,colors,solution:queenCols.map((c,r)=>({x:c,y:r})),chainLength:0};
      }
    }
  }

  // Fallback: use best found level (or first valid if none solvable)
  if(bestLevel)return bestLevel;
  const queenCols=pickNonAdjacentSolution(size,rng);
  const colors=generateRegions(size,queenCols,rng);
  return{size,colors,solution:queenCols.map((c,r)=>({x:c,y:r})),chainLength:0};
}

// Cache generated levels
const levelCache={};
function getLevel(n){
  if(!levelCache[n])levelCache[n]=generateLevel(n);
  return levelCache[n];
}

function snd(type){
  if(!actx)return;
  try{
    const o=actx.createOscillator(),g=actx.createGain();
    o.connect(g);g.connect(actx.destination);
    const t=actx.currentTime;
    if(type==='place'){o.frequency.value=660;g.gain.setValueAtTime(.15,t);o.start(t);o.stop(t+.1);if(navigator.vibrate)navigator.vibrate(10)}
    else if(type==='cross'){o.frequency.value=350;g.gain.setValueAtTime(.08,t);o.start(t);o.stop(t+.06);if(navigator.vibrate)navigator.vibrate(5)}
    else if(type==='win'){o.frequency.value=523;g.gain.setValueAtTime(.2,t);o.start(t);o.stop(t+.15);setTimeout(()=>{const o2=actx.createOscillator(),g2=actx.createGain();o2.connect(g2);g2.connect(actx.destination);o2.frequency.value=784;g2.gain.setValueAtTime(.2,actx.currentTime);o2.start();o2.stop(actx.currentTime+.2)},150);if(navigator.vibrate)navigator.vibrate([50,30,50,30,100])}
    else if(type==='lose'){o.frequency.value=200;g.gain.setValueAtTime(.12,t);o.start(t);o.stop(t+.4);if(navigator.vibrate)navigator.vibrate([100,50,100])}
    else if(type==='err'){o.frequency.value=150;g.gain.setValueAtTime(.15,t);o.start(t);o.stop(t+.25);if(navigator.vibrate)navigator.vibrate([20,30,20])}
    else if(type==='tut'){o.frequency.value=440;g.gain.setValueAtTime(.1,t);o.start(t);o.stop(t+.08);if(navigator.vibrate)navigator.vibrate(8)}
  }catch(e){}
}

// ===================== Board Rendering =====================
function renderBoard(){
  const d=GS.data;if(!d)return;
  const b=document.getElementById('board');
  b.style.gridTemplateColumns=`repeat(${d.size},1fr)`;
  b.innerHTML='';
  let placed=0;

  for(let y=0;y<d.size;y++){
    for(let x=0;x<d.size;x++){
      const div=document.createElement('div');
      div.className='cell';
      div.style.backgroundColor=d.colors[y][x];
      const cell=GS.board[y][x];

      if(cell.state===1){
        const sp=document.createElement('span');
        sp.className='queen';
        sp.textContent='🐮';
        div.appendChild(sp);
        placed++;
      }else if(cell.state===2){
        const sp=document.createElement('span');
        sp.className='xmark';
        sp.textContent='✕';
        div.appendChild(sp);
      }

      // Cycle interaction: tap empty->X, tap X->queen, tap queen->empty
      div.addEventListener('click',function(e){
        e.preventDefault();
        if(GS.locked)return;
        handleCellClick(x,y);
      });

      // Swipe to mark X (for non-tutorial)
      div.addEventListener('touchstart',function(e){
        if(GS.locked||GS.tutorial)return;
        if(cell.state===0){
          cell.state=2;
          snd('cross');
          renderBoard();
        }
      },{passive:true});

      b.appendChild(div);
    }
  }
  document.getElementById('remain').innerText=d.size-placed;
  updateLives();
  checkWin();
}

// ===================== Cell Click Handler =====================
let lastTap=0;
function handleCellClick(x,y){
  const cell=GS.board[y][x];
  const now=Date.now();

  // During tutorial, only allow specific targets
  if(GS.tutorial&&tutStep>=0){
    const target=tutSteps[tutStep];
    if(!target||(target.x!==x||target.y!==y))return;
  }

  // Cycle: 0(empty) -> 2(X) -> 1(queen) -> 0
  if(cell.state===0){
    // Place X
    cell.state=2;
    snd('cross');
    saveHistory();
    renderBoard();
  }else if(cell.state===2){
    // Place queen
    if(checkConflict(x,y)){
      cell.state=0; // revert to empty, show error
      cell.err=true;
      GS.lives--;
      snd('err');
      renderBoard();
      // flash conflict
      const idx=y*GS.data.size+x;
      const el=document.querySelectorAll('#board .cell')[idx];
      if(el)el.classList.add('conflict');
      setTimeout(()=>{if(el)el.classList.remove('conflict')},500);
      if(GS.lives<=0){setTimeout(()=>gameOver(),600)}
    }else{
      saveHistory();
      cell.state=1;
      snd('place');
      renderBoard();
    }
  }else if(cell.state===1){
    // Remove queen
    saveHistory();
    cell.state=0;
    snd('cross');
    renderBoard();
  }
}

function saveHistory(){
  GS.history.push(GS.board.map(row=>row.map(c=>({...c}))));
  if(GS.history.length>50)GS.history.shift();
}

// ===================== Conflict Detection =====================
function checkConflict(x,y){
  const d=GS.data,sz=d.size,col=d.colors[y][x];
  // Check row
  for(let i=0;i<sz;i++){
    if(i===x)continue;
    if(GS.board[y][i].state===1)return true;
  }
  // Check column
  for(let i=0;i<sz;i++){
    if(i===y)continue;
    if(GS.board[i][x].state===1)return true;
  }
  // Check color region
  for(let r=0;r<sz;r++){
    for(let c=0;c<sz;c++){
      if(r===y&&c===x)continue;
      if(d.colors[r][c]===col&&GS.board[r][c].state===1)return true;
    }
  }
  // Check adjacency (8 directions)
  for(let dr=-1;dr<=1;dr++){
    for(let dc=-1;dc<=1;dc++){
      if(dr===0&&dc===0)continue;
      const nr=y+dr,nc=x+dc;
      if(nr>=0&&nr<sz&&nc>=0&&nc<sz){
        if(GS.board[nr][nc].state===1)return true;
      }
    }
  }
  return false;
}

// ===================== Win Check =====================
function checkWin(){
  const d=GS.data;if(!d)return;
  const sz=d.size;
  // Check all queens placed
  let count=0;
  for(let y=0;y<sz;y++)for(let x=0;x<sz;x++)if(GS.board[y][x].state===1)count++;
  if(count!==sz)return;

  // Check all constraints
  const rows=Array(sz).fill(0),cols=Array(sz).fill(0);
  const colorCount={};
  for(let y=0;y<sz;y++){
    for(let x=0;x<sz;x++){
      if(GS.board[y][x].state===1){
        rows[y]++;cols[x]++;
        const c=d.colors[y][x];
        colorCount[c]=(colorCount[c]||0)+1;
        // Check adjacency
        for(let dr=-1;dr<=1;dr++){
          for(let dc=-1;dc<=1;dc++){
            if(dr===0&&dc===0)continue;
            const nr=y+dr,nc=x+dc;
            if(nr>=0&&nr<sz&&nc>=0&&nc<sz){
              if(GS.board[nr][nc].state===1)return; // adjacent queens
            }
          }
        }
      }
    }
  }
  for(let i=0;i<sz;i++){
    if(rows[i]!==1||cols[i]!==1)return;
  }
  for(const c in colorCount){
    if(colorCount[c]!==1)return;
  }

  // Win!
  clearInterval(GS.timeId);
  GS.locked=true;
  snd('win');
  if(GS.level+1>GS.maxLevel){
    GS.maxLevel=GS.level+1;
    try{localStorage.setItem('cow_save',JSON.stringify({max:GS.maxLevel}))}catch(e){}
  }
  setTimeout(()=>showWinModal(),600);
}

function doHint(){
  if(GS.locked)return;
  const d=GS.data;
  // Find a queen in solution not yet placed
  const remaining=d.solution.filter(s=>GS.board[s.y][s.x].state!==1);
  if(remaining.length===0)return;

  // Find one that can be logically deduced
  let best=null;
  for(const s of remaining){
    // Check if placing this queen is the only option in its row
    let rowOpts=0;
    for(let c=0;c<d.size;c++){
      if(GS.board[s.y][c].state!==2&&!hasConflictWithPlaced(c,s.y))rowOpts++;
    }
    if(rowOpts===1){best=s;break}

    // Check column
    let colOpts=0;
    for(let r=0;r<d.size;r++){
      if(GS.board[r][s.x].state!==2&&!hasConflictWithPlaced(s.x,r))colOpts++;
    }
    if(colOpts===1){best=s;break}

    // Check color region
    const col=d.colors[s.y][s.x];
    let colorOpts=0;
    for(let r=0;r<d.size;r++){
      for(let c=0;c<d.size;c++){
        if(d.colors[r][c]===col&&GS.board[r][c].state!==2&&!hasConflictWithPlaced(c,r))colorOpts++;
      }
    }
    if(colorOpts===1){best=s;break}
  }

  // Fallback: just show next solution position
  if(!best)best=remaining[0];
  GS.hintsUsed++;

  const idx=best.y*d.size+best.x;
  const cells=document.querySelectorAll('#board .cell');
  if(cells[idx]){
    cells[idx].classList.add('hint-glow');
    setTimeout(()=>cells[idx].classList.remove('hint-glow'),2500);
  }
}

function hasConflictWithPlaced(x,y){
  const d=GS.data,sz=d.size,col=d.colors[y][x];
  for(let i=0;i<sz;i++){
    if(GS.board[y][i].state===1)return true;
    if(GS.board[i][x].state===1)return true;
  }
  for(let r=0;r<sz;r++)for(let c=0;c<sz;c++){
    if(d.colors[r][c]===col&&GS.board[r][c].state===1)return true;
  }
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
    if(dr===0&&dc===0)continue;
    const nr=y+dr,nc=x+dc;
    if(nr>=0&&nr<sz&&nc>=0&&nc<sz&&GS.board[nr][nc].state===1)return true;
  }
  return false;
}

// ===================== Tutorial System =====================
let tutSteps=[];
let tutStep=-1;

function startTutorial(level){
  const d=GS.data;
  const sz=d.size;
  tutSteps=[];
  tutStep=-1;

  // Step 1: Place first queen
  const q0=d.solution[0];
  const c0=d.colors[q0.y][q0.x];
  const cn0=COLOR_NAMES[c0]||'該';
  tutSteps.push({
    x:q0.x,y:q0.y,type:'queen',
    title:`第 1 步：放置牛`,
    desc:`點擊高亮的${cn0}色格子兩次（空→✕→🐮），放置第一頭牛！`,
    logic:`💡 推理：這個格子的同行、同列、同色區域以及周圍8格都沒有其他牛，是唯一安全的位置。`
  });

  // Step 2: Mark X on same row
  let xTarget=null;
  for(let c=0;c<sz;c++){
    if(c===q0.x)continue;
    if(d.colors[q0.y][c]!==c0){xTarget={x:c,y:q0.y};break}
  }
  if(xTarget){
    tutSteps.push({
      x:xTarget.x,y:xTarget.y,type:'x',
      title:`第 2 步：行列排除`,
      desc:`點擊高亮格子標記 ✕，排除這個位置！`,
      logic:`💡 推理：這一行已經有一頭牛（${cn0}色），根據「每行只能1頭牛」規則，其他格子都不能放牛。`
    });
  }

  // Step 3: Mark X on adjacent cell
  const neighbors=[];
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
    if(dr===0&&dc===0)continue;
    const nr=q0.y+dr,nc=q0.x+dc;
    if(nr>=0&&nr<sz&&nc>=0&&nc<sz){
      if(!d.solution.some(s=>s.x===nc&&s.y===nr))neighbors.push({x:nc,y:nr});
    }
  }
  // Pick a neighbor not already targeted
  const adjTarget=neighbors.find(n=>!xTarget||n.x!==xTarget.x||n.y!==xTarget.y);
  if(adjTarget){
    tutSteps.push({
      x:adjTarget.x,y:adjTarget.y,type:'x',
      title:`第 3 步：相鄰排除`,
      desc:`牛的四周不能有牛。點擊高亮格子標記 ✕！`,
      logic:`💡 推理：這個格子緊鄰剛才放置的牛，根據「牛不相鄰」規則，這裡絕對不能放牛。`
    });
  }

  // Step 4 (level 2+): Color exclusion
  if(level>=1){
    // Find a cell in same color region as q0 but different row/col
    let colorTarget=null;
    for(let r=0;r<sz&&!colorTarget;r++){
      for(let c=0;c<sz;c++){
        if(r===q0.y&&c===q0.x)continue;
        if(d.colors[r][c]===c0&&r!==q0.y&&c!==q0.x){
          if(d.solution.some(s=>s.x===c&&s.y===r))continue;
          colorTarget={x:c,y:r};break;
        }
      }
    }
    if(colorTarget){
      tutSteps.push({
        x:colorTarget.x,y:colorTarget.y,type:'x',
        title:`第 4 步：顏色排除`,
        desc:`同一顏色區域只能有1頭牛。點擊標記 ✕！`,
        logic:`💡 推理：這個格子和已放置的牛同屬${cn0}色區域，根據「每色1頭牛」規則，此處不能再放牛。`
      });
    }
  }

  // Step 5 (level 3+): Combined reasoning
  if(level>=2){
    // Find a queen position deducible by elimination
    const q1=d.solution[1];
    const c1=d.colors[q1.y][q1.x];
    const cn1=COLOR_NAMES[c1]||'該';
    tutSteps.push({
      x:q1.x,y:q1.y,type:'queen',
      title:`第 5 步：組合推理`,
      desc:`現在試著用排除法找出第二頭牛！點擊高亮格子放置 🐮！`,
      logic:`💡 推理：綜合行列、顏色和相鄰規則，這個${cn1}色格子是當前唯一能放牛的位置。`
    });
  }

  nextTutStep();
}

function nextTutStep(){
  tutStep++;
  if(tutStep>=tutSteps.length){
    finishTutorial();
    return;
  }
  const step=tutSteps[tutStep];
  const d=GS.data;

  // Highlight target
  document.querySelectorAll('#board .cell').forEach(el=>{
    el.classList.remove('tut-target');
  });
  const idx=step.y*d.size+step.x;
  const cells=document.querySelectorAll('#board .cell');
  if(cells[idx])cells[idx].classList.add('tut-target');

  // Show panel
  document.getElementById('tutIco').textContent=step.type==='queen'?'🐮':'✕';
  document.getElementById('tutT').textContent=step.title;
  document.getElementById('tutD').textContent=step.desc;
  document.getElementById('tutL').textContent=step.logic;
  document.getElementById('tutPanel').classList.add('show');
  snd('tut');

  // Wait for player to complete the step
  const checkInterval=setInterval(()=>{
    if(tutStep>=tutSteps.length){clearInterval(checkInterval);return}
    const cell=GS.board[step.y][step.x];
    let done=false;
    if(step.type==='queen'&&cell.state===1)done=true;
    if(step.type==='x'&&cell.state===2)done=true;
    if(done){
      clearInterval(checkInterval);
      document.getElementById('tutPanel').classList.remove('show');
      setTimeout(()=>nextTutStep(),300);
    }
  },200);

  // Timeout after 60s
  setTimeout(()=>{
    clearInterval(checkInterval);
    if(tutStep<tutSteps.length){
      document.getElementById('tutPanel').classList.remove('show');
      finishTutorial();
    }
  },60000);
}

function finishTutorial(){
  document.querySelectorAll('#board .cell').forEach(el=>el.classList.remove('tut-target'));
  document.getElementById('tutPanel').classList.remove('show');
  GS.tutorial=false;
  tutStep=-1;
  tutSteps=[];

  // Show completion message
  document.getElementById('tutIco').textContent='🎯';
  document.getElementById('tutT').textContent='教學完成！';
  document.getElementById('tutD').textContent='你已經學會了邏輯排除法，找出剩下的牛吧！';
  document.getElementById('tutL').textContent='💡 遇到困難時，點擊下方的「提示」按鈕。';
  document.getElementById('tutPanel').classList.add('show');
  setTimeout(()=>document.getElementById('tutPanel').classList.remove('show'),5000);
}

// ===================== Init =====================
updateMenuStats();
</script>
