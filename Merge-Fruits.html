n" aria-label="靜音開關">🔊</button>             </div>         </div>     </div>          <div class="game-canvas-wrapper">         <canvas id="game-canvas"></canvas>         <div class="pause-overlay" id="pause-overlay">⏸️</div>     </div>          <div id="praise-popup">         <span id="praise-emoji"></span>         <p id="praise-text">太棒了！</p>     </div>      <div id="start-modal" class="modal-overlay show">         <div class="modal-content">             <h2>🍉 歡迎來到水果樂園 🍇</h2>             <p>小朋友叫什麼名字呢?</p>             <input type="text" id="player-name-input" class="name-input" placeholder="請輸入名字" maxlength="6" autocomplete="off">             <br>             <button id="start-game-btn" class="start-btn">開始玩遊戲</button>         </div>     </div>      <div id="game-over-modal" class="modal-overlay">         <div class="modal-content">             <h2>🎈 遊戲結束啦!</h2>             <p><span id="end-player-name"></span> 小朋友的最終得分是:</p>             <p id="final-score" style="font-weight: bold; font-size: 42px; color: #FF8C00; margin: 10px 0;">0</p>             <p id="combo-final" style="font-size: 18px; color: #FF6B6B;"></p>             <div id="leaderboard-display"></div>             <div class="btn-group">                 <button id="restart-btn" class="restart-btn">再玩一次 ✨</button>                 <button id="share-btn" class="share-btn">分享成績 📤</button>             </div>         </div>     </div>      <div id="leaderboard-modal" class="modal-overlay">         <div class="modal-content">             <h2>🏆 排行榜</h2>             <div id="leaderboard-list"></div>             <button id="close-rank-btn" class="start-btn" style="margin-top: 10px;">關閉</button>         </div>     </div>      <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>     <script>         // 禁止右键/长按菜单         document.addEventListener('contextmenu', (e) => e.preventDefault());         document.addEventListener('selectstart', (e) => e.preventDefault());                  const CONFIG = {             MAX_CANVAS_WIDTH: 600,             GRAVITY: 1.2,             DANGER_LINE_RATIO: 0.15,             DROP_COOLDOWN: 600,             BGM_VOLUME: 0.5,             BGM_URL: "https://cdn.jsdelivr.net/gh/pkbw2000/avs-ljci@main/BGM.mp3",             LEADERBOARD_SIZE: 10,             COMBO_TIMEOUT: 3000         };                  const LeaderboardManager = {             getLeaderboard() {                 const data = localStorage.getItem('watermelon_leaderboard');                 return data ? JSON.parse(data) : [];             },             addScore(name, score, combo) {                 const leaderboard = this.getLeaderboard();                 leaderboard.push({ name, score, combo, date: new Date().toISOString() });                 leaderboard.sort((a, b) => b.score - a.score);                 const trimmed = leaderboard.slice(0, CONFIG.LEADERBOARD_SIZE);                 localStorage.setItem('watermelon_leaderboard', JSON.stringify(trimmed));                 return trimmed.findIndex(item => item.name === name && item.score === score) + 1;             },             displayLeaderboard(maxItems = CONFIG.LEADERBOARD_SIZE) {                 const leaderboard = this.getLeaderboard();                 const list = document.getElementById('leaderboard-list');                 list.innerHTML = '';                 if (leaderboard.length === 0) {                     list.innerHTML = '<p style="color: #999;">還沒有記錄呢，快來挑戰一下吧！</p>';                     return;                 }                 leaderboard.slice(0, maxItems).forEach((item, index) => {                     const rank = index + 1;                     let rankClass = '';                     let medal = '🥇';                     if (rank === 1) rankClass = 'gold';                     else if (rank === 2) { rankClass = 'silver'; medal = '🥈'; }                     else if (rank === 3) { rankClass = 'bronze'; medal = '🥉'; }                     const div = document.createElement('div');                     div.className = `leaderboard-item ${rankClass}`;                     div.innerHTML = `<div><span class="rank">${medal} ${rank}.</span><span>${item.name}</span></div><span class="score">${item.score}分${item.combo ? ` 🔥${item.combo}` : ''}</span>`;                     list.appendChild(div);                 });             }         };                  const AudioManager = {             bgmAudio: null,             isMuted: false,             init() {                 if (!this.bgmAudio) {                     this.bgmAudio = new Audio();                     this.bgmAudio.loop = true;                     this.bgmAudio.volume = CONFIG.BGM_VOLUME;                     this.bgmAudio.src = CONFIG.BGM_URL;                     this.bgmAudio.load();                 }             },             play() {                 if (this.isMuted || !this.bgmAudio || !this.bgmAudio.paused) return;                 this.bgmAudio.play().catch(e => console.log("BGM 播放需要用戶交互", e));             },             pause() { if (this.bgmAudio) this.bgmAudio.pause(); },             resume() { if (this.bgmAudio && !this.isMuted) this.bgmAudio.play().catch(() => {}); },             stop() { if (this.bgmAudio) { this.bgmAudio.pause(); this.bgmAudio.currentTime = 0; } },             toggleMute() {                 this.isMuted = !this.isMuted;                 const muteBtn = document.getElementById('mute-btn');                 muteBtn.innerText = this.isMuted ? '🔇' : '🔊';                 if (this.bgmAudio) { if (this.isMuted) this.bgmAudio.pause(); else this.play(); }             }         };                  const SoundManager = {             audioCtx: null,             init() {                 if (!this.audioCtx) {                     try { this.audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }                      catch (e) { console.warn("Audio Context 不支持", e); }                 }                 if (this.audioCtx && this.audioCtx.state === 'suspended') this.audioCtx.resume();             },             play(type, level) {                 if (AudioManager.isMuted || !this.audioCtx) return;                 try {                     const osc = this.audioCtx.createOscillator();                     const gainNode = this.audioCtx.createGain();                     osc.connect(gainNode);                     gainNode.connect(this.audioCtx.destination);                     if (type === 'drop') {                         osc.type = 'sine';                         osc.frequency.setValueAtTime(400, this.audioCtx.currentTime);                         osc.frequency.exponentialRampToValueAtTime(100, this.audioCtx.currentTime + 0.15);                         gainNode.gain.setValueAtTime(0.3, this.audioCtx.currentTime);                         gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.15);                         osc.start(); osc.stop(this.audioCtx.currentTime + 0.15);                     } else if (type === 'merge') {                         const freq = 440 + (level * 50);                         osc.type = 'triangle';                         osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime);                         gainNode.gain.setValueAtTime(0.3, this.audioCtx.currentTime);                         gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.3);                         osc.start(); osc.stop(this.audioCtx.currentTime + 0.3);                     }                 } catch (e) { console.warn("音效播放失敗", e); }             }         };                  const { Engine, Runner, Bodies, Composite, Events, World } = Matter;         let engine, runner, world, canvas, ctx, width, height;         let currentX = 0, canDrop = true, nextFruitLevel = 0;         let score = 0, bestScore = parseInt(localStorage.getItem('watermelon_best_score')) || 0, isGameOver = false, dangerLineY = 100;         let isPaused = false, combo = 0, comboTimer = null;         let unlockedLevels = [];         let playerName = "小朋友";         let resizeTimer = null;                  const FRUIT_PRAISE_SETS = [             [ "哇！小葡萄蹦蹦跳！", "葡萄小寶貝來囉！", "甜甜的葡萄真可愛！" ],             [ "櫻桃好朋友！", "紅紅櫻桃笑哈哈！", "兩顆櫻桃甜蜜蜜！" ],             [ "好棒的橘子！", "橘子太陽圓滾滾！", "維他命C橘子讚！" ],             [ "酸酸甜甜檸檬！", "檸檬小黃帽！", "活力檸檬清爽喔！" ],             [ "獼猴桃真厲害！", "綠色小奇異果！", "奇異果充滿能量！" ],             [ "紅彤彤番茄！", "番茄妹妹臉紅紅！", "營養小番茄棒棒！" ],             [ "粉嫩嫩桃子！", "水蜜桃軟綿綿！", "桃子香味飄飄～" ],             [ "大鳳梨香噴噴！", "鳳梨戴皇冠！", "金黃鳳梨好神氣！" ],             [ "椰子硬邦邦！", "清涼椰子水！", "椰子樹上摘下來！" ],             [ "哈密瓜甜滋滋！", "綠網紋哈密瓜！", "哈密瓜球好美味！" ],             [ "超級大西瓜！", "圓圓西瓜慶豐收！", "西瓜王國萬歲！" ]         ];                  const SCORE_PRAISES = [             { emoji: "🏆", text: "太厲害啦！突破5000分！" },             { emoji: "🌟", text: "水果大師！分數高高～" },             { emoji: "🎉", text: "哇！你真是合成高手！" },             { emoji: "⭐", text: "又拿到5000分！好棒！" },             { emoji: "✨", text: "閃閃發光！分數衝衝衝！" },             { emoji: "🍭", text: "甜甜分數！超級開心！" },             { emoji: "🎈", text: "再加油！往一萬分前進！" },             { emoji: "🏅", text: "優勝！水果小英雄！" }         ];                  const FRUITS = [             { radius: 16, color: '#9C27B0', score: 2, emoji: '🍇' },             { radius: 24, color: '#F44336', score: 4, emoji: '🍒' },             { radius: 32, color: '#FF9800', score: 8, emoji: '🍊' },             { radius: 40, color: '#FFEB3B', score: 16, emoji: '🍋' },             { radius: 50, color: '#8BC34A', score: 32, emoji: '🥝' },             { radius: 62, color: '#F48FB1', score: 64, emoji: '🍅' },             { radius: 74, color: '#FFCCBC', score: 128, emoji: '🍑' },             { radius: 86, color: '#FFF59D', score: 256, emoji: '🍍' },             { radius: 100, color: '#E0F7FA', score: 512, emoji: '🥥' },             { radius: 115, color: '#C8E6C9', score: 1024, emoji: '🍈' },             { radius: 130, color: '#4CAF50', score: 2048, emoji: '🍉' }         ];                  function updateCombo() {             combo++;             clearTimeout(comboTimer);             const comboBox = document.getElementById('combo-box');             if (combo > 1) comboBox.classList.add('show');             document.getElementById('combo-count').innerText = combo;             comboTimer = setTimeout(() => { combo = 0; comboBox.classList.remove('show'); }, CONFIG.COMBO_TIMEOUT);         }                  function showPopup(emoji, message) {             const popup = document.getElementById('praise-popup');             const emojiSpan = document.getElementById('praise-emoji');             const textSpan = document.getElementById('praise-text');             emojiSpan.innerText = emoji;             textSpan.innerText = message;             popup.classList.remove('show');             requestAnimationFrame(() => {                 popup.classList.add('show');                 setTimeout(() => popup.classList.remove('show'), 5000);             });         }                  function showFruitPraise(level) {             if (unlockedLevels.includes(level)) return;             unlockedLevels.push(level);             const praises = FRUIT_PRAISE_SETS[level];             if (!praises) return;             const randomIndex = Math.floor(Math.random() * praises.length);             const praiseText = praises[randomIndex];             const fruitEmoji = FRUITS[level].emoji;             showPopup(fruitEmoji, praiseText);         }                  function showScoreMilestonePraise(milestone) {             const randomIndex = Math.floor(Math.random() * SCORE_PRAISES.length);             const { emoji, text } = SCORE_PRAISES[randomIndex];             showPopup(emoji, text + " (" + milestone + "分)");         }                  // ========== 爆炸清屏效果（两个大西瓜碰撞时触发） ==========         function explodeAndClear() {             const bodies = Composite.allBodies(world);             let totalBonus = 0;             for (let i = bodies.length - 1; i >= 0; i--) {                 const body = bodies[i];                 if (!body.isStatic && body.gameLevel !== undefined) {                     totalBonus += FRUITS[body.gameLevel].score;                     World.remove(world, body);                 }             }             totalBonus += 10000;             addScore(totalBonus);             SoundManager.play('merge', 10);             showPopup('💥🍉✨', '哇！！西瓜大爆炸！清屏 +10000分！！');             if (navigator.vibrate) navigator.vibrate(200);         }                  function togglePause() {             if (isGameOver) return;             isPaused = !isPaused;             const pauseBtn = document.getElementById('pause-btn');             const pauseOverlay = document.getElementById('pause-overlay');             const canvasElem = document.getElementById('game-canvas');             pauseBtn.innerText = isPaused ? '▶️' : '⏸️';             pauseOverlay.classList.toggle('show');             canvasElem.classList.toggle('paused');                          if (isPaused) {                 Runner.stop(runner);                 canDrop = false;                 AudioManager.pause();             } else {                 Runner.start(runner, engine);                 const bodies = Composite.allBodies(world);                 const now = Date.now();                 for (let i = 0; i < bodies.length; i++) {                     const body = bodies[i];                     if (!body.isStatic && body.gameLevel !== undefined) {                         body.spawnTime = now;                     }                 }                 setTimeout(() => { canDrop = true; }, 200);                 AudioManager.resume();             }         }                  function shareScore() {             const text = `🎉 我在快樂合成大西瓜中得到 ${score} 分！🏆 最高連擊 ${combo}x 🔥\n快來挑戰我吧！\n`;             const gameUrl = window.location.href;             if (navigator.share) {                 navigator.share({ title: '快樂合成大西瓜', text: text, url: gameUrl }).catch(err => console.log('分享取消:', err));             } else {                 const fullText = text + gameUrl;                 navigator.clipboard.writeText(fullText).then(() => alert('✅ 成績已複製到剪貼板！\n' + fullText)).catch(() => alert('成績：' + fullText));             }         }                  function rebuildWalls() {             const bodies = Composite.allBodies(world);             for (let i = bodies.length - 1; i >= 0; i--) {                 if (bodies[i].isStatic) World.remove(world, bodies[i]);             }             const ground = Bodies.rectangle(width / 2, height + 30, width, 60, { isStatic: true });             const leftWall = Bodies.rectangle(-30, height / 2, 60, height, { isStatic: true });             const rightWall = Bodies.rectangle(width + 30, height / 2, 60, height, { isStatic: true });             World.add(world, [ground, leftWall, rightWall]);         }                  function centerCurrentX() {             if (!FRUITS[nextFruitLevel]) return;             const radius = FRUITS[nextFruitLevel].radius;             const center = width / 2;             currentX = Math.max(radius, Math.min(width - radius, center));         }                  function resizeCanvasSync() {             const maxWidth = Math.min(window.innerWidth, CONFIG.MAX_CANVAS_WIDTH);             width = maxWidth;             const header = document.querySelector('.game-header');             let headerHeight = header ? header.offsetHeight : 70;             const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;             height = Math.max(400, viewportHeight - headerHeight - 5);                          canvas.style.width = width + 'px';             canvas.style.height = height + 'px';             canvas.width = width;             canvas.height = height;             ctx.setTransform(1, 0, 0, 1, 0, 0);             rebuildWalls();             dangerLineY = height * CONFIG.DANGER_LINE_RATIO;             centerCurrentX();         }                  function resizeCanvas() {             if (resizeTimer) cancelAnimationFrame(resizeTimer);             resizeTimer = requestAnimationFrame(() => {                 resizeCanvasSync();             });         }                  function getSafeDropY(radius) {             let safeY = dangerLineY - radius - 5;             return Math.max(safeY, radius + 10);         }                  function initGame() {             canvas = document.getElementById('game-canvas');             ctx = canvas.getContext('2d');             document.getElementById('best-score').innerText = bestScore;             engine = Engine.create();             world = engine.world;             engine.gravity.y = CONFIG.GRAVITY;                          resizeCanvasSync();                          if (window.visualViewport) {                 window.visualViewport.addEventListener('resize', () => { setTimeout(resizeCanvas, 30); });             }             window.addEventListener('resize', () => { resizeCanvas(); });             window.addEventListener('orientationchange', () => { setTimeout(resizeCanvas, 30); });                          canvas.addEventListener('pointermove', handleMove);             canvas.addEventListener('pointerup', handleDrop);             // 禁止 canvas 上的触摸滚动             canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });             canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });             window.addEventListener('touchmove', function(e) {                 if (e.target === canvas || canvas.contains(e.target)) {                     e.preventDefault();                 }             }, { passive: false });                          document.getElementById('restart-btn').addEventListener('click', restartGame);             document.getElementById('pause-btn').addEventListener('click', togglePause);             document.getElementById('rank-btn').addEventListener('click', showLeaderboard);             document.getElementById('close-rank-btn').addEventListener('click', closeLeaderboard);             document.getElementById('share-btn').addEventListener('click', shareScore);             document.getElementById('mute-btn').addEventListener('click', () => AudioManager.toggleMute());             Events.on(engine, 'collisionStart', onCollisionStart);                          runner = Runner.create();             Runner.run(runner, engine);             nextFruitLevel = getRandomFruitLevel();             canDrop = true;             requestAnimationFrame(renderLoop);         }                  function getRandomFruitLevel() {             let maxLevel = 2;             if (score > 500) maxLevel = 3;             if (score > 1500) maxLevel = 4;             return Math.floor(Math.random() * (maxLevel + 1));         }                  function handleMove(e) {             e.preventDefault();             if (isGameOver || isPaused) return;             const rect = canvas.getBoundingClientRect();             let x = e.clientX - rect.left;             const radius = FRUITS[nextFruitLevel].radius;             currentX = Math.max(radius, Math.min(x, width - radius));         }                  function handleDrop(e) {             e.preventDefault();             if (!canDrop || isGameOver || isPaused) return;             canDrop = false;             SoundManager.play('drop');             canvas.classList.add('dropping');             setTimeout(() => canvas.classList.remove('dropping'), 150);             const radius = FRUITS[nextFruitLevel].radius;             const dropY = getSafeDropY(radius);             createFruit(currentX, dropY, nextFruitLevel);             nextFruitLevel = getRandomFruitLevel();             centerCurrentX();             setTimeout(() => { canDrop = true; }, CONFIG.DROP_COOLDOWN);         }                  function createFruit(x, y, level) {             const fruitConfig = FRUITS[level];             const fruit = Bodies.circle(x, y, fruitConfig.radius, {                 restitution: 0.2,                 label: 'fruit_' + level,                 render: { fillStyle: fruitConfig.color }             });             fruit.gameLevel = level;             fruit.spawnTime = Date.now();             World.add(world, fruit);         }                  function onCollisionStart(event) {             const pairs = event.pairs;             for (let i = 0; i < pairs.length; i++) {                 const bodyA = pairs[i].bodyA, bodyB = pairs[i].bodyB;                 if (bodyA.gameLevel !== undefined && bodyB.gameLevel !== undefined) {                     if (bodyA.gameLevel === 10 && bodyB.gameLevel === 10) {                         explodeAndClear();                         return;                     }                     if (bodyA.gameLevel === bodyB.gameLevel && bodyA.gameLevel < FRUITS.length - 1) {                         const newLevel = bodyA.gameLevel + 1;                         const midX = (bodyA.position.x + bodyB.position.x) / 2;                         const midY = (bodyA.position.y + bodyB.position.y) / 2;                         World.remove(world, [bodyA, bodyB]);                         createFruit(midX, midY, newLevel);                         SoundManager.play('merge', newLevel);                         updateCombo();                         showFruitPraise(newLevel);                         addScore(FRUITS[newLevel].score);                     }                 }             }         }                  function addScore(points) {             const oldScore = score;             score += points;             document.getElementById('current-score').innerText = score;             if (score > bestScore) {                 bestScore = score;                 localStorage.setItem('watermelon_best_score', bestScore);                 document.getElementById('best-score').innerText = bestScore;             }             const oldMilestone = Math.floor(oldScore / 5000);             const newMilestone = Math.floor(score / 5000);             if (newMilestone > oldMilestone) {                 for (let m = oldMilestone + 1; m <= newMilestone; m++) {                     showScoreMilestonePraise(m * 5000);                 }             }         }                  function checkGameOver() {             if (isGameOver || isPaused) return;             const bodies = Composite.allBodies(world);             const now = Date.now();             for (let i = 0; i < bodies.length; i++) {                 const body = bodies[i];                 if (!body.isStatic && body.gameLevel !== undefined &&                     (now - body.spawnTime > 1500) && body.position.y < dangerLineY && body.speed < 0.05) {                     endGame();                     break;                 }             }         }                  function endGame() {             isGameOver = true;             Runner.stop(runner);             document.getElementById('final-score').innerText = score;             document.getElementById('end-player-name').innerText = playerName;             const rank = LeaderboardManager.addScore(playerName, score, combo);             if (combo > 5) document.getElementById('combo-final').innerText = `🔥 最高連擊: ${combo}x`;             else document.getElementById('combo-final').innerText = '';             const display = document.getElementById('leaderboard-display');             display.innerHTML = `<p style="color: #FF6B6B; font-weight: bold; margin-bottom: 10px;">🏆 你在排行榜第 ${rank} 名！</p>`;             display.innerHTML += '<h3 style="color: #FF8C00; margin: 10px 0 5px 0; font-size: 16px;">📊 排行榜前三名：</h3>';             const previewList = document.createElement('div');             previewList.style.cssText = 'font-size: 14px; max-height: 200px; overflow-y: auto;';             display.appendChild(previewList);             const leaderboard = LeaderboardManager.getLeaderboard().slice(0, 3);             if (leaderboard.length === 0) previewList.innerHTML = '<p style="color: #999;">暫無排行記錄</p>';             else {                 leaderboard.forEach((item, idx) => {                     let medal = '🥇';                     if (idx === 1) medal = '🥈';                     else if (idx === 2) medal = '🥉';                     const itemDiv = document.createElement('div');                     itemDiv.style.cssText = 'padding: 8px; margin: 5px 0; background: #f9f9f9; border-radius: 10px; display: flex; justify-content: space-between;';                     itemDiv.innerHTML = `<span>${medal} ${item.name}</span><span style="color: #4CAF50; font-weight: bold;">${item.score}分${item.combo ? ` 🔥${item.combo}` : ''}</span>`;                     previewList.appendChild(itemDiv);                 });             }             document.getElementById('game-over-modal').classList.add('show');             AudioManager.stop();         }                  function showLeaderboard() {             LeaderboardManager.displayLeaderboard();             document.getElementById('leaderboard-modal').classList.add('show');         }                  function closeLeaderboard() {             document.getElementById('leaderboard-modal').classList.remove('show');         }                  function restartGame() {             const bodies = Composite.allBodies(world);             for (let i = bodies.length - 1; i >= 0; i--) {                 if (!bodies[i].isStatic) World.remove(world, bodies[i]);             }             score = 0;             combo = 0;             isGameOver = false;             isPaused = false;             unlockedLevels = [];             document.getElementById('current-score').innerText = '0';             const comboBox = document.getElementById('combo-box');             comboBox.classList.remove('show');             document.getElementById('pause-btn').innerText = '⏸️';             document.getElementById('game-canvas').classList.remove('paused');             document.getElementById('pause-overlay').classList.remove('show');             document.getElementById('game-over-modal').classList.remove('show');             nextFruitLevel = getRandomFruitLevel();             canDrop = true;             centerCurrentX();             Runner.start(runner, engine);             if (!AudioManager.isMuted && AudioManager.bgmAudio) {                 AudioManager.bgmAudio.currentTime = 0;                 AudioManager.play();             }         }                  function shadeColor(color, percent) {             let R = parseInt(color.substring(1,3), 16);             let G = parseInt(color.substring(3,5), 16);             let B = parseInt(color.substring(5,7), 16);             R = Math.min(255, parseInt(R * (100 + percent) / 100));             G = Math.min(255, parseInt(G * (100 + percent) / 100));             B = Math.min(255, parseInt(B * (100 + percent) / 100));             const RR = ((R.toString(16).length===1)?"0"+R.toString(16):R.toString(16));             const GG = ((G.toString(16).length===1)?"0"+G.toString(16):G.toString(16));             const BB = ((B.toString(16).length===1)?"0"+B.toString(16):B.toString(16));             return "#"+RR+GG+BB;         }                  function renderLoop() {             ctx.clearRect(0, 0, width, height);             ctx.beginPath();             ctx.setLineDash([10, 10]);             ctx.moveTo(0, dangerLineY);             ctx.lineTo(width, dangerLineY);             ctx.strokeStyle = 'rgba(255, 0, 0, 0.6)';             ctx.lineWidth = 3;             ctx.stroke();             ctx.setLineDash([]);                          const bodies = Composite.allBodies(world);             for (let i = 0; i < bodies.length; i++) {                 const body = bodies[i];                 if (body.isStatic) continue;                 const radius = body.circleRadius;                 const x = body.position.x;                 const y = body.position.y;                 const level = body.gameLevel;                 const fruitData = FRUITS[level];                 ctx.beginPath();                 ctx.arc(x, y, radius, 0, Math.PI * 2);                 const gradient = ctx.createRadialGradient(x - radius/3, y - radius/3, radius/10, x, y, radius);                 gradient.addColorStop(0, '#FFFFFF');                 gradient.addColorStop(0.3, fruitData.color);                 gradient.addColorStop(1, shadeColor(fruitData.color, -40));                 ctx.fillStyle = gradient;                 ctx.fill();                 ctx.closePath();                                  const fontSize = Math.max(16, Math.floor(radius * 1.2));                 ctx.font = `${fontSize}px "Apple Color Emoji", "AppleColorEmoji", "Segoe UI Emoji", "Noto Color Emoji", "Helvetica Neue", sans-serif`;                 ctx.textAlign = "center";                 ctx.textBaseline = "middle";                 ctx.fillStyle = '#000000';                 ctx.fillText(fruitData.emoji, x, y + radius * 0.05);             }                          if (!isGameOver) {                 const nextRadius = FRUITS[nextFruitLevel].radius;                 const previewY = getSafeDropY(nextRadius);                 ctx.beginPath();                 ctx.moveTo(currentX, previewY + nextRadius);                 ctx.lineTo(currentX, height);                 ctx.strokeStyle = '#00FF66';                 ctx.lineWidth = 4;                 ctx.setLineDash([8, 8]);                 ctx.stroke();                 ctx.setLineDash([]);                 ctx.beginPath();                 ctx.arc(currentX, previewY, nextRadius, 0, Math.PI * 2);                 const nextGradient = ctx.createRadialGradient(currentX - nextRadius/3, previewY - nextRadius/3, nextRadius/10, currentX, previewY, nextRadius);                 nextGradient.addColorStop(0, '#FFFFFF');                 nextGradient.addColorStop(0.3, FRUITS[nextFruitLevel].color);                 nextGradient.addColorStop(1, shadeColor(FRUITS[nextFruitLevel].color, -40));                 ctx.fillStyle = nextGradient;                 ctx.fill();                 ctx.closePath();                 const previewFontSize = Math.max(16, Math.floor(nextRadius * 1.2));                 ctx.font = `${previewFontSize}px "Apple Color Emoji", "AppleColorEmoji", "Segoe UI Emoji", "Noto Color Emoji", "Helvetica Neue", sans-serif`;                 ctx.textAlign = "center";                 ctx.textBaseline = "middle";                 ctx.fillStyle = '#000000';                 ctx.fillText(FRUITS[nextFruitLevel].emoji, currentX, previewY + nextRadius * 0.05);             }             checkGameOver();             requestAnimationFrame(renderLoop);         }                  // 启动游戏         document.getElementById('start-game-btn').addEventListener('click', function() {             const nameInput = document.getElementById('player-name-input');             playerName = nameInput.value.trim() || '小朋友';             document.getElementById('start-modal').classList.remove('show');             SoundManager.init();             AudioManager.init();             AudioManager.play();             initGame();         });                  if ('serviceWorker' in navigator) {             navigator.serviceWorker.register('sw.js')                 .then(reg => console.log('Service Worker 註冊成功'))                 .catch(err => console.log('註冊失敗', err));         }     </script> </body> </html>
