<!DOCTYPE html> <html lang="zh-TW"> <head>     <meta charset="UTF-8">     <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">     <title>無限射擊｜連擊·排行榜·無限關卡</title>     <script src="https://cdn.tailwindcss.com"></script>     <style>         * { user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }         body { background: #020205; margin: 0; overflow: hidden; font-family: 'Share Tech Mono', monospace; position: fixed; width: 100%; height: 100%; }         .glass-panel { background: rgba(2,10,18,0.8); backdrop-filter: blur(8px); border: 1px solid rgba(16,185,129,0.5); border-radius: 16px; }         .neon-text { text-shadow: 0 0 5px #10b981, 0 0 8px #10b981; }         button { cursor: pointer; transition: 0.2s; touch-action: manipulation; }         button:active { transform: scale(0.96); }         .game-overlay { z-index: 10000; position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.9); backdrop-filter: blur(12px); }         .game-overlay .glass-panel { width: 85%; max-width: 320px; pointer-events: auto; }         canvas { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }         body.game-over-canvas canvas { pointer-events: none; }         .ui-top { position: fixed; top: 12px; left: 12px; right: 12px; z-index: 30; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; pointer-events: none; }         .ui-top > div { pointer-events: auto; }         .stat-card { padding: 6px 12px; font-size: 14px; backdrop-filter: blur(8px); }         .stat-value { font-size: 22px; margin-left: 6px; }         @media (max-width:600px){ .stat-card{padding:4px 10px;font-size:12px;} .stat-value{font-size:18px;} }         .control-hint { position: fixed; bottom: 70px; left:0; right:0; text-align:center; color:#10b981aa; font-size:12px; z-index:20; pointer-events:none; }         .boss-health-bar { position: fixed; top: 80px; left: 10%; width: 80%; height: 12px; background: #330000; border-radius: 6px; z-index: 35; overflow: hidden; border: 1px solid #f00; }         .boss-health-fill { height: 100%; width: 100%; background: #f00; transition: width 0.2s; }         .weapon-icon { position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.6); padding: 5px 12px; border-radius: 20px; font-size: 12px; color: #0f0; z-index: 30; pointer-events: none; }         .bomb-button { position: fixed; bottom: 20px; left: 20px; width: 55px; height: 55px; background: radial-gradient(circle at 30% 30%, #ffaa33, #cc7700); border: 2px solid #ffdd88; box-shadow: 0 0 15px #ffaa33; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; color: #fff; text-shadow: 0 0 5px #000; cursor: pointer; z-index: 40; transition: 0.1s; touch-action: manipulation; border-radius: 50%; }         .bomb-button:active { transform: scale(0.92); background: radial-gradient(circle at 30% 30%, #ffcc66, #dd8800); }         .bomb-count { position: fixed; bottom: 85px; left: 85px; background: rgba(0,0,0,0.7); color: #ffaa33; font-size: 18px; font-weight: bold; padding: 2px 8px; border-radius: 20px; border: 1px solid #ffaa33; z-index: 40; pointer-events: none; }         .restart-button { display: inline-block; margin-left: auto; }         .combo-badge { position: fixed; bottom: 120px; right: 20px; background: rgba(0,0,0,0.8); padding: 6px 12px; border-radius: 30px; font-size: 18px; font-weight: bold; color: #ff44ff; border: 1px solid #f0f; box-shadow: 0 0 8px #f0f; pointer-events: none; z-index: 30; }         .rank-list { position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.7); padding: 6px 12px; border-radius: 8px; font-size: 11px; color: #ffaa33; z-index: 30; backdrop-filter: blur(4px); pointer-events: none; text-align: right; }         .custom-dialog { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 20001; }         .custom-dialog .dialog-box { background: #0a0f1a; border: 2px solid #ffaa33; border-radius: 24px; padding: 24px; width: 280px; text-align: center; color: #ffaa33; }         .custom-dialog input { background: #1a1f2a; border: 1px solid #ffaa33; padding: 8px; margin: 12px 0; width: 100%; color: white; border-radius: 12px; text-align: center; }         .custom-dialog button { background: #ffaa33; color: #000; border: none; padding: 8px 20px; border-radius: 30px; font-weight: bold; margin-top: 8px; }     </style> </head> <body>     <div class="ui-top">         <div class="glass-panel stat-card flex items-center gap-2"><span class="text-emerald-400 font-bold">🎯 SCORE</span><span id="scoreValue" class="text-white font-mono font-bold stat-value neon-text">0</span></div>         <div class="glass-panel stat-card flex items-center gap-2"><span class="text-red-400 font-bold">❤️ LIVES</span><span id="livesValue" class="text-white font-mono font-bold stat-value">3</span></div>         <div class="glass-panel stat-card flex items-center gap-2"><span class="text-yellow-400 font-bold">🏆 BEST</span><span id="highScoreValue" class="text-yellow-300 font-mono font-bold stat-value">0</span></div>         <div class="glass-panel stat-card flex items-center gap-2"><span class="text-cyan-400 text-sm font-bold">🌟 LEVEL</span><span id="levelValue" class="text-cyan-300 font-mono font-bold stat-value">1</span></div>         <div class="glass-panel stat-card flex items-center gap-2"><span class="text-purple-400 text-sm font-bold">🔫 LVL</span><span id="weaponLevel" class="text-purple-300 font-mono font-bold stat-value">1</span></div>         <div class="glass-panel stat-card flex items-center gap-2"><span class="text-pink-400 text-sm font-bold">🎯 NEXT BOSS</span><span id="goalScore" class="text-pink-300 font-mono font-bold stat-value">5000</span></div>         <div class="restart-button w-full flex justify-end mt-1"><button id="restartBtn" class="glass-panel px-3 py-1 text-emerald-300 text-sm border border-emerald-500/50 active:scale-95">🔄 重啟</button></div>     </div>     <div id="bossHealthBar" class="boss-health-bar" style="display: none;"><div id="bossHealthFill" class="boss-health-fill"></div></div>     <div class="control-hint">← 手指左右滑動 → &nbsp;&nbsp;|&nbsp;&nbsp; 自動連射 | 💣 光束炸彈(3秒) | 🤖 子戰機 | 🏆 連擊加成 | LEVEL=關卡難度 LVL=武器等級</div>     <div id="bombBtn" class="bomb-button">💣</div>     <div id="bombCountDisplay" class="bomb-count">x3</div>     <div id="startOverlay" class="game-overlay" style="z-index: 20000; background: rgba(0,0,0,0.95);">         <div class="glass-panel p-8 text-center bg-black/95 border-emerald-500 w-80">             <div class="text-5xl mb-4">🚀</div>             <div class="text-2xl font-bold text-white mb-2">無限射擊·連擊挑戰</div>             <div class="text-emerald-400 text-sm mb-4">無限關卡 | 分數召喚BOSS | 連擊加成</div>             <button id="startGameBtn" class="bg-emerald-700 hover:bg-emerald-600 text-white px-6 py-3 rounded-lg font-bold text-lg w-full active:scale-95">開始遊戲</button>         </div>     </div>     <div id="gameOverPanel" class="game-overlay opacity-0 pointer-events-none transition-opacity duration-300">         <div class="glass-panel p-6 text-center bg-black/95 border-emerald-500">             <div class="text-5xl mb-2 text-red-500">☠️</div>             <div class="text-2xl font-bold text-white mb-2" id="gameOverMsg">GAME OVER</div>             <div class="text-emerald-400 text-lg mb-4">最終積分: <span id="finalScore" class="text-xl">0</span></div>             <div class="flex gap-3 mt-2">                 <button id="gameOverContinue" class="bg-emerald-700 hover:bg-emerald-600 text-white px-4 py-2 rounded-lg font-bold flex-1 active:scale-95">▶ 繼續遊戲</button>                 <button id="gameOverRestartBtn" class="bg-cyan-700 hover:bg-cyan-600 text-white px-4 py-2 rounded-lg font-bold flex-1 active:scale-95">🔄 重新開始</button>             </div>         </div>     </div>     <canvas id="gameCanvas"></canvas>     <div class="weapon-icon" id="weaponStatus">⚡ 基本激光</div>     <div class="combo-badge" id="comboDisplay">COMBO 0 (x1.0)</div>     <div class="rank-list" id="rankList">🏆 排行<br>載入中...</div>      <script>         (function(){             // ---------- DOM 元素 ----------             const canvas = document.getElementById('gameCanvas');             const ctx = canvas.getContext('2d');             const scoreSpan = document.getElementById('scoreValue');             const livesSpan = document.getElementById('livesValue');             const highScoreSpan = document.getElementById('highScoreValue');             const levelSpan = document.getElementById('levelValue');             const weaponLevelSpan = document.getElementById('weaponLevel');             const goalSpan = document.getElementById('goalScore');             const gameOverPanel = document.getElementById('gameOverPanel');             const finalScoreSpan = document.getElementById('finalScore');             const restartBtn = document.getElementById('restartBtn');             const gameOverContinue = document.getElementById('gameOverContinue');             const gameOverRestartBtn = document.getElementById('gameOverRestartBtn');             const bossHealthBar = document.getElementById('bossHealthBar');             const bossHealthFill = document.getElementById('bossHealthFill');             const gameOverMsgSpan = document.getElementById('gameOverMsg');             const weaponStatus = document.getElementById('weaponStatus');             const bombBtn = document.getElementById('bombBtn');             const bombCountDisplay = document.getElementById('bombCountDisplay');             const startOverlay = document.getElementById('startOverlay');             const startGameBtn = document.getElementById('startGameBtn');             const comboDisplay = document.getElementById('comboDisplay');             const rankListDiv = document.getElementById('rankList');              // 音效系統 (略)             let audioCtx = null, audioUnlocked = false;             function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }             function unlockAudio() {                 if(audioUnlocked) return Promise.resolve();                 if(!audioCtx) initAudio();                 if(audioCtx.state === 'suspended') return audioCtx.resume().then(()=>{ audioUnlocked=true; });                 audioUnlocked=true; return Promise.resolve();             }             function playSound(type) {                 if(!audioCtx || !audioUnlocked) return;                 const now = audioCtx.currentTime;                 const osc = audioCtx.createOscillator();                 const gain = audioCtx.createGain();                 osc.connect(gain); gain.connect(audioCtx.destination);                 switch(type){                     case 'explosion': osc.type='sawtooth'; osc.frequency.setValueAtTime(180,now); osc.frequency.exponentialRampToValueAtTime(40,now+0.25); gain.gain.setValueAtTime(0.3,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.3); break;                     case 'hit': osc.type='sine'; osc.frequency.setValueAtTime(880,now); osc.frequency.exponentialRampToValueAtTime(440,now+0.08); gain.gain.setValueAtTime(0.12,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.1); break;                     case 'laser': osc.type='triangle'; osc.frequency.setValueAtTime(800,now); osc.frequency.exponentialRampToValueAtTime(300,now+0.1); gain.gain.setValueAtTime(0.15,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.12); break;                     case 'damage': osc.type='square'; osc.frequency.setValueAtTime(300,now); osc.frequency.exponentialRampToValueAtTime(150,now+0.15); gain.gain.setValueAtTime(0.25,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.2); break;                     case 'upgrade': osc.type='sine'; osc.frequency.setValueAtTime(1200,now); osc.frequency.exponentialRampToValueAtTime(800,now+0.1); gain.gain.setValueAtTime(0.2,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.2); break;                     case 'bossHit': osc.type='sawtooth'; osc.frequency.setValueAtTime(400,now); osc.frequency.exponentialRampToValueAtTime(200,now+0.1); gain.gain.setValueAtTime(0.2,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.15); break;                     case 'clear': osc.type='sine'; osc.frequency.setValueAtTime(880,now); osc.frequency.setValueAtTime(1320,now+0.1); gain.gain.setValueAtTime(0.3,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.3); break;                     case 'bomb': osc.type='sine'; osc.frequency.setValueAtTime(300,now); osc.frequency.exponentialRampToValueAtTime(80,now+0.4); gain.gain.setValueAtTime(0.4,now); gain.gain.exponentialRampToValueAtTime(0.001,now+0.5); break;                 }                 osc.start(); osc.stop(now+0.4);             }              // ---------- 全域變數 ----------             let totalScore = 0, lives = 3, highScore = 0, isGameOver = false, gameStarted = false;             let currentLevel = 1;             let enemies = [], bullets = [], particles = [], floatingTexts = [], powerups = [], bombPowerups = [], stars = [];             let subFighters = [];             let boss = null;             let levelState = 'spawn';             let scoreThisLevel = 0;             let goalScore = 5000;             let spawnBaseRate = 0.01;             let lastShootTime = 0;             const shootDelay = 120;             let weaponLevel = 1;             let weaponConfig = { hasMissile: false, hasTracking: false };             let bombCount = 3;             let activeTrackingMissiles = 0;             let invincibleUntil = 0;             let subFighterDroppedThisLevel = false;             let giantSpawnTimer = 0;             const GIANT_SPAWN_DELAY = 600;             let savedWeaponLevel = 1;             let savedWeaponConfig = null;             let combo = 0;             let lastHitFrame = 0;             const COMBO_DECAY_MS = 2000;             let bombActive = false;             let bombEndTime = 0;             let bombBeamX = 0, bombBeamTopY = 0, bombBeamBottomY = 0;             let player = { x: 0, y: 0, width: 44, height: 44 };             let moveTargetX = 0;              // 成群敵機計數 (用於掉落武器升級)             let activeSquadCount = 0;              function getDifficulty() {                 let lvl = currentLevel;                 return {                     spawnRate: 0.01 + Math.min(lvl * 0.0025, 0.045),                     enemySpeedBase: 0.9 + lvl * 0.035,                     bossHp: 30 + Math.floor(lvl * 2.2),                     bossSpeed: 0.8 + lvl * 0.055,                     bulletSpeed: 4 + lvl * 0.15,                     goalScore: 5000 + Math.floor(lvl * 500)                 };             }              // 自訂對話框             function showCustomDialog(title, callback) {                 const dialogDiv = document.createElement('div');                 dialogDiv.className = 'custom-dialog';                 dialogDiv.innerHTML = `                     <div class="dialog-box">                         <div style="font-size:24px;">🏆 新紀錄！</div>                         <div style="margin:12px 0;">請輸入您的名字</div>                         <input type="text" id="playerNameInput" maxlength="12" placeholder="ACE_PILOT">                         <div><button id="confirmNameBtn">確認</button></div>                     </div>                 `;                 document.body.appendChild(dialogDiv);                 const input = dialogDiv.querySelector('#playerNameInput');                 input.focus();                 const confirmBtn = dialogDiv.querySelector('#confirmNameBtn');                 const onSubmit = () => {                     let name = input.value.trim();                     if(name === '') name = 'ACE_PILOT';                     callback(name);                     dialogDiv.remove();                 };                 confirmBtn.addEventListener('click', onSubmit);                 input.addEventListener('keypress', (e) => { if(e.key === 'Enter') onSubmit(); });             }              function loadRanking() {                 let rank = JSON.parse(localStorage.getItem('infinite_shooter_rank')) || [];                 rank.sort((a,b)=>b.score - a.score);                 rank = rank.slice(0,5);                 let html = '<strong>🏆 排行</strong><br>';                 if(rank.length===0) html += '暫無紀錄';                 else rank.forEach((r,i)=> html += `${i+1}. ${r.name} ${r.score}<br>`);                 rankListDiv.innerHTML = html;                 return rank;             }             function saveRanking(score, playerName) {                 let rank = JSON.parse(localStorage.getItem('infinite_shooter_rank')) || [];                 rank.push({ name: playerName, score: score, date: new Date().toLocaleDateString() });                 rank.sort((a,b)=>b.score - a.score);                 rank = rank.slice(0,5);                 localStorage.setItem('infinite_shooter_rank', JSON.stringify(rank));                 loadRanking();             }             function checkHighScore(score) {                 let rank = JSON.parse(localStorage.getItem('infinite_shooter_rank')) || [];                 rank.sort((a,b)=>b.score - a.score);                 if(rank.length < 5 || score > rank[4].score) {                     showCustomDialog('新紀錄', (name) => {                         saveRanking(score, name.substring(0,12));                     });                 }             }              function updateComboUI() { let mult = 1 + Math.min(combo/100, 1); comboDisplay.innerText = `COMBO ${combo} (x${mult.toFixed(1)})`; }             function addCombo() { combo++; lastHitFrame = performance.now(); updateComboUI(); }             function breakCombo() { if(combo>5) playSound('hit'); combo=0; updateComboUI(); }             function updateComboDecay() { if(combo>0 && performance.now()-lastHitFrame>COMBO_DECAY_MS) breakCombo(); }             function getScoreMultiplier() { return 1 + Math.min(combo/100, 1); }             function addScore(baseScore) {                 let mult = getScoreMultiplier();                 let gain = Math.floor(baseScore * mult);                 totalScore += gain;                 scoreThisLevel += gain;                 addCombo();                 updateScoreUI();                 floatingTexts.push(new FloatingScore(player.x+player.width/2, player.y-20, `+${gain} (x${mult.toFixed(1)})`, '#ffaa00'));                 return gain;             }              function updateScoreUI(){ scoreSpan.innerText=totalScore; if(totalScore>highScore) highScoreSpan.innerText=totalScore; else highScoreSpan.innerText=highScore; }             function updateLivesUI(){ livesSpan.innerText=lives; }             function showMessage(msg,col){ let d=document.createElement('div'); d.className='fixed bottom-20 left-1/2 transform -translate-x-1/2 glass-panel px-4 py-2 text-emerald-300 z-50 toast-msg'; d.innerText=msg; d.style.color=col; document.body.appendChild(d); setTimeout(()=>d.remove(),1500); }              function startLevel(level) {                 currentLevel = level;                 levelSpan.innerText = currentLevel;                 let diff = getDifficulty();                 goalScore = diff.goalScore;                 goalSpan.innerText = goalScore;                 levelState = 'spawn';                 boss = null;                 enemies = [];                 scoreThisLevel = 0;                 bossHealthBar.style.display = 'none';                 subFighterDroppedThisLevel = false;                 giantSpawnTimer = GIANT_SPAWN_DELAY;                 spawnBaseRate = diff.spawnRate;                 showMessage(`第 ${currentLevel} 關　目標分數: ${goalScore}`, "#10b981");             }              function getGiantHp() { return 5 + Math.floor(currentLevel/2); }              const ENEMY_TYPES = {                 NORMAL_FAST: { name:'高速偵察機', color:'#10b981', hp:1, score:35, baseSpeed:1.6, size:34, weight:25, glow:'#10b981', behavior:'linear', shoot:false, unlockLevel:1 },                 NORMAL_SLOW: { name:'偵察機', color:'#10b981', hp:1, score:30, baseSpeed:1.0, size:36, weight:30, glow:'#10b981', behavior:'linear', shoot:false, unlockLevel:1 },                 SWING_FAST:  { name:'高速擺盪機', color:'#f97316', hp:1, score:52, baseSpeed:1.8, size:30, weight:15, glow:'#f97316', behavior:'sine', shoot:false, unlockLevel:3 },                 SWING_SLOW:  { name:'擺盪機', color:'#f97316', hp:1, score:45, baseSpeed:1.2, size:32, weight:15, glow:'#f97316', behavior:'sine', shoot:false, unlockLevel:3 },                 SHOOTER_FAST:{ name:'高速射擊機', color:'#3b82f6', hp:1, score:70, baseSpeed:1.4, size:32, weight:10, glow:'#3b82f6', behavior:'linear', shoot:true, shootDelay:80, unlockLevel:4 },                 SHOOTER_SLOW:{ name:'射擊機', color:'#3b82f6', hp:1, score:60, baseSpeed:0.9, size:34, weight:12, glow:'#3b82f6', behavior:'linear', shoot:true, shootDelay:90, unlockLevel:4 },                 BOMBER_FAST: { name:'高速自爆機', color:'#a855f7', hp:1, score:95, baseSpeed:2.2, size:28, weight:8, glow:'#a855f7', behavior:'chase', shoot:false, unlockLevel:5 },                 BOMBER_SLOW: { name:'自爆機', color:'#a855f7', hp:1, score:80, baseSpeed:1.4, size:30, weight:8, glow:'#a855f7', behavior:'chase', shoot:false, unlockLevel:5 },                 UPGRADE:     { name:'強化艦', color:'#fbbf24', hp:1, score:120, baseSpeed:1.1, size:38, weight:2, glow:'#f59e0b', behavior:'linear', isSpecial:true, upgradeDrop:true, unlockLevel:1 },                 GIANT:       { name:'巨型裝甲艦', color:'#aa44ff', hp:5, score:500, baseSpeed:0.4, size:80, weight:0, glow:'#aa44ff', behavior:'linear', unlockLevel:1, isGiant:true },                 HYPER:       { name:'超高速穿梭機', color:'#ff00ff', hp:1, score:100, baseSpeed:4.5, size:40, weight:4, glow:'#ff00ff', behavior:'hyper', shoot:false, unlockLevel:2 }             };              function getCurrentEnemySpeed(base) { return base + (currentLevel-1)*0.045; }             function getRandomEnemyType() {                 let avail = [];                 for(let k in ENEMY_TYPES) if(ENEMY_TYPES[k].unlockLevel <= currentLevel && !ENEMY_TYPES[k].isGiant) avail.push(k);                 if(avail.length===0) return 'NORMAL_SLOW';                 let totalWeight = 0;                 for(let k of avail) totalWeight += ENEMY_TYPES[k].weight;                 let rand = Math.random() * totalWeight;                 let cum = 0;                 for(let k of avail) {                     cum += ENEMY_TYPES[k].weight;                     if(rand < cum) return k;                 }                 return 'NORMAL_SLOW';             }              function drawGiant(ctx, e) {                 const x = e.x, y = e.y, size = e.size;                 ctx.save();                 ctx.shadowBlur = 12;                 ctx.shadowColor = '#ff44ff';                 ctx.beginPath();                 ctx.ellipse(x+size/2, y+size/2, size/2, size/2.5, 0, 0, Math.PI*2);                 ctx.fillStyle = e.flash>0 ? '#ff8888' : '#aa44ff';                 ctx.fill();                 ctx.beginPath();                 ctx.ellipse(x+size/2, y+size/2, size/2.8, size/3, 0, 0, Math.PI*2);                 ctx.strokeStyle = '#ffccff';                 ctx.lineWidth = 2;                 ctx.stroke();                 ctx.fillStyle = '#ff6600';                 ctx.beginPath();                 ctx.rect(x+size/2-12, y+size/2-8, 24, 16);                 ctx.fill();                 ctx.fillStyle = '#ffff00';                 ctx.beginPath();                 ctx.rect(x+size/2-4, y+size/2-12, 8, 8);                 ctx.fill();                 ctx.fillStyle = '#ffffff';                 ctx.beginPath();                 ctx.arc(x+size*0.35, y+size*0.4, 6, 0, Math.PI*2);                 ctx.fill();                 ctx.beginPath();                 ctx.arc(x+size*0.65, y+size*0.4, 6, 0, Math.PI*2);                 ctx.fill();                 ctx.fillStyle = '#000000';                 ctx.beginPath();                 ctx.arc(x+size*0.33, y+size*0.38, 3, 0, Math.PI*2);                 ctx.fill();                 ctx.beginPath();                 ctx.arc(x+size*0.67, y+size*0.38, 3, 0, Math.PI*2);                 ctx.fill();                 ctx.font = 'bold 20px monospace';                 ctx.fillStyle = '#fff';                 ctx.fillText("🦾", x+size/2-10, y+size/2+15);                 ctx.restore();                 let percent = e.hp / e.maxHp;                 ctx.fillStyle = '#222';                 ctx.fillRect(x, y-10, size, 6);                 ctx.fillStyle = '#ff44ff';                 ctx.fillRect(x, y-10, size*percent, 6);             }              class Enemy {                 constructor(typeKey, x, y, isSquadMember = false) {                     this.type = ENEMY_TYPES[typeKey];                     this.typeKey = typeKey;                     this.x = x; this.y = y;                     this.hp = (typeKey==='GIANT') ? getGiantHp() : this.type.hp;                     this.maxHp = this.hp;                     let diff = getDifficulty();                     let spdBase = diff.enemySpeedBase;                     this.speedX = (Math.random() - 0.5) * 1.0;                     this.speedY = (this.type.baseSpeed + (currentLevel-1)*0.04) + (Math.random()*0.3-0.15);                     this.size = this.type.size;                     this.flash = 0;                     this.shootTimer = 0;                     this.angle = Math.random() * Math.PI * 2;                     this.isSquadMember = isSquadMember;  // 標記是否為成群敵機                     if(this.type.behavior === 'hyper') {                         let dir = Math.random() < 0.5 ? -1 : 1;                         this.speedX = dir * (12 + Math.random()*6);                         this.speedY = (Math.random() - 0.5) * 3;                         this.y = y;                     }                 }                 update() {                     switch(this.type.behavior) {                         case 'sine': lay.innerText=`x${bombCount}`;                 weaponLevelSpan.innerText='1';                 weaponStatus.innerText="⚡ 基本激光";                 enemies=[]; bullets=[]; particles=[]; floatingTexts=[]; powerups=[]; bombPowerups=[];                 boss=null; levelState='spawn';                 updateScoreUI(); updateLivesUI(); updateComboUI();                 startLevel(1);                 player.y = canvas.height - 50; player.x = canvas.width/2 - player.width/2; moveTargetX = player.x;                 lastShootTime=0;                 startOverlay.classList.remove('opacity-0','pointer-events-none');                 startOverlay.classList.add('opacity-100','pointer-events-auto');                 startOverlay.style.display = 'flex';                 bombActive = false;             }              function startGame() {                 gameStarted = true;                 startOverlay.classList.add('opacity-0','pointer-events-none');                 startOverlay.style.display = 'none';                 unlockAudio();             }              function updatePlayerPosition() {                 let dx = moveTargetX - player.x;                 player.x += dx * 0.25;                 player.x = Math.min(Math.max(player.x, 5), canvas.width - player.width - 5);                 player.y = canvas.height - 50;             }              function handleMove(clientX) {                 const rect = canvas.getBoundingClientRect();                 let ratioX = canvas.width / rect.width;                 let canvasX = (clientX - rect.left) * ratioX;                 canvasX = Math.min(Math.max(canvasX, player.width/2), canvas.width - player.width/2);                 moveTargetX = canvasX - player.width/2;             }              function onMouseMove(e) { if(gameStarted && !isGameOver) handleMove(e.clientX); }             function onTouchMove(e) { if(gameStarted && !isGameOver) { e.preventDefault(); handleMove(e.touches[0].clientX); } }              function shoot() {                 if(!gameStarted || isInvincibleWaiting() || weaponLevel===0) return;                 let now=Date.now(); if(now-lastShootTime<shootDelay) return;                 lastShootTime=now; let cx=player.x+player.width/2, cy=player.y;                 let baseBullets = [];                 let laserCount = 1;                 if(weaponLevel>=2 && weaponLevel<4) laserCount=2;                 else if(weaponLevel>=4 && weaponLevel<7) laserCount=3;                 else if(weaponLevel>=7) laserCount=4;                 for(let i=0;i<laserCount;i++){                     let offset = (i - (laserCount-1)/2) * 8;                     baseBullets.push(new Bullet(cx+offset-4, cy-15, offset*0.2, -9, 5, false));                 }                 if(weaponConfig.hasMissile && (weaponLevel%2==0 || weaponLevel>=8)){                     baseBullets.push(new Bullet(cx-8, cy-12, -1, -8, 8, false, true));                     baseBullets.push(new Bullet(cx+4, cy-12, 1, -8, 8, false, true));                 }                 if(weaponConfig.hasTracking && weaponLevel>=7 && activeTrackingMissiles < 2) {                     baseBullets.push(new Bullet(cx, cy-10, 0, -7, 6, false, false, true));                     activeTrackingMissiles++;                     if(weaponLevel>=9 && activeTrackingMissiles < 2) {                         baseBullets.push(new Bullet(cx-6, cy-10, -0.8, -7, 6, false, false, true));                         activeTrackingMissiles++;                     }                     if(weaponLevel>=10 && activeTrackingMissiles < 2) {                         baseBullets.push(new Bullet(cx+6, cy-10, 0.8, -7, 6, false, false, true));                         activeTrackingMissiles++;                     }                 }                 bullets.push(...baseBullets);                 playSound('laser');             }              function updateInvincibleWeapon() {                 if(!isInvincibleWaiting() && weaponLevel === 0 && savedWeaponLevel > 0) {                     weaponLevel = savedWeaponLevel;                     weaponConfig = savedWeaponConfig;                     weaponLevelSpan.innerText = weaponLevel;                     let statusText = `🔫 Lv.${weaponLevel} `;                     if(weaponConfig.hasTracking) statusText += " 🚀追蹤導彈";                     else if(weaponConfig.hasMissile) statusText += " 💥高爆飛彈";                     else statusText += " ⚡強化雷射";                     weaponStatus.innerText = statusText;                     showMessage("武器系統恢復！", "#10b981");                 }             }              let squadCooldown = 0;             function updateLevelProgression() {                 if(levelState === 'spawn') {                     if(Math.random() < spawnBaseRate) spawnNormalEnemy();                     if(giantSpawnTimer <= 0 && enemies.filter(e=>e.typeKey==='GIANT').length===0){                         spawnGiantEnemy();                         giantSpawnTimer = GIANT_SPAWN_DELAY;                     } else giantSpawnTimer--;                                          if(squadCooldown <= 0 && currentLevel >= 2 && Math.random() < 0.015) {                         spawnSquad();                         squadCooldown = 450;                     } else squadCooldown--;                      if(scoreThisLevel >= goalScore && !boss) {                         boss = new Boss();                         levelState = 'boss';                         bossHealthBar.style.display = 'block';                         bossHealthFill.style.width = '100%';                         showMessage(`⚠️ 魔王降臨！ 第${currentLevel}關⚠️`, "#ff4444");                     }                 } else if(levelState === 'boss' && boss) {                     boss.update();                     bossHealthFill.style.width = (boss.hp / boss.maxHp * 100) + '%';                     let newBullets = boss.shoot();                     if(newBullets) bullets.push(...newBullets);                     for(let i=0;i<bullets.length;i++) {                         let b = bullets[i];                         if(b.isEnemy) continue;                         let rect = boss.getRect();                         if(b.x>rect.x && b.x<rect.x+rect.w && b.y>rect.y && b.y<rect.y+rect.h) {                             let dmg = b.isMissile ? 3 : (b.isTracking ? 2 : 1);                             let dead = boss.takeDamage(dmg);                             bullets.splice(i,1); i--;                             playSound('bossHit');                             for(let p=0;p<5;p++) particles.push(new Particle(b.x,b.y,'#ffaa66',4));                             if(dead) bossDefeated();                             break;                         }                     }                     if(boss){                         let pr = {x:player.x, y:player.y, w:player.width, h:player.height};                         let br = boss.getRect();                         if(pr.x < br.x+br.w && pr.x+pr.w > br.x && pr.y < br.y+br.h && pr.y+pr.h > br.y && !isInvincibleWaiting()) {                             loseLife();                             boss=null;                             bossHealthBar.style.display='none';                             showMessage("你撞到了魔王！重新挑戰本關", "#ff5555");                             startLevel(currentLevel);                         }                     }                 }             }              function spawnNormalEnemy() {                 let type = getRandomEnemyType();                 let size = ENEMY_TYPES[type].size;                 let x = Math.random() * (canvas.width - size);                 let enemy = new Enemy(type, x, -size - 40);                 enemies.push(enemy);                 // 只掉落炸彈道具 (1% 機率)                 if(Math.random() < 0.01 && bombCount < 9) {                     powerups.push(new BouncingPowerUp(x + size/2 - 12, -20, 'bomb'));                 }             }              function spawnGiantEnemy() {                 let size = ENEMY_TYPES.GIANT.size;                 let x = Math.random() * (canvas.width - size);                 let enemy = new Enemy('GIANT', x, -size - 60);                 enemies.push(enemy);                 showMessage(`🦾 巨型裝甲艦出現！ 血量 ${getGiantHp()}`, "#ff44ff");             }              function updateBullets() {                 for(let i=0;i<bullets.length;i++) {                     let b = bullets[i];                     let out = b.update();                     if(out) {                         if(b.isTracking && !b.isEnemy) activeTrackingMissiles--;                         bullets.splice(i,1); i--;                         continue;                     }                     if(b.isEnemy) {                         let pr = {x:player.x, y:player.y, w:player.width, h:player.height};                         if(b.x>pr.x && b.x<pr.x+pr.w && b.y>pr.y && b.y<pr.y+pr.h && !isInvincibleWaiting()) {                             loseLife(); bullets.splice(i,1); i--;                         }                         continue;                     }                     let hit=false;                     for(let j=0;j<enemies.length;j++) {                         let e=enemies[j];                         let rect=e.getRect();                         if(b.x>rect.x && b.x<rect.x+rect.w && b.y>rect.y && b.y<rect.y+rect.h) {                             let dmg = b.isMissile ? 3 : (b.isTracking ? 2 : 1);                             let dead=e.takeDamage(dmg);                             if(b.isTracking && !b.isEnemy) activeTrackingMissiles--;                             bullets.splice(i,1); i--;                             if(dead) killEnemy(e,j);                             hit=true; break;                         }                     }                     if(hit) continue;                 }             }              function updatePowerups() {                 for(let i=0;i<powerups.length;i++) {                     let p=powerups[i];                     if(p.update()) { powerups.splice(i,1); i--; continue; }                     let rect=p.getRect();                     if(player.x<rect.x+rect.w && player.x+player.width>rect.x && player.y<rect.y+rect.h && player.y+player.height>rect.y) {                         if(p.type === 'weapon') {                             upgradeWeapon();                         } else if(p.type === 'bomb') {                             bombCount++; bombCountDisplay.innerText=`x${bombCount}`; showMessage("💣 炸彈+1","#ffaa33"); playSound('upgrade');                         }                         powerups.splice(i,1);                         for(let k=0;k<8;k++) particles.push(new Particle(p.x+12, p.y+12, "#fbbf24",4));                         i--;                     }                 }             }              function updateEnemies() {                 for(let i=0;i<enemies.length;i++) {                     let e=enemies[i];                     let out=e.update();                     if(out || e.y>canvas.height+150) { enemies.splice(i,1); i--; continue; }                     let pr = {x:player.x, y:player.y, w:player.width, h:player.height};                     let er = e.getRect();                     if(pr.x<er.x+er.w && pr.x+pr.w>er.x && pr.y<er.y+er.h && pr.y+pr.h>er.y && !isInvincibleWaiting()) {                         loseLife();                         enemies.splice(i,1);                         for(let p=0;p<10;p++) particles.push(new Particle(e.x+e.size/2, e.y+e.size/2, "#ff6666",4));                         i--;                     }                 }             }              function updateSubFighters() {                 if(subFighters.length===0) return;                 let now=Date.now();                 for(let sf of subFighters){                     sf.update(player.x, player.y);                     let bullet = sf.shoot(now);                     if(bullet) bullets.push(bullet);                 }             }              function updateBombBeam() {                 if(!bombActive) return;                 const now = Date.now();                 if(now >= bombEndTime) {                     bombActive = false;                     return;                 }                 const beamLeft = bombBeamX;                 const beamWidth = player.width * 10;                 const beamRight = beamLeft + beamWidth;                 const beamTop = bombBeamTopY;                 const beamBottom = bombBeamBottomY;                 for(let i=0;i<enemies.length;i++) {                     const e = enemies[i];                     const eRect = e.getRect();                     if(eRect.x < beamRight && eRect.x + eRect.w > beamLeft && eRect.y < beamBottom && eRect.y + eRect.h > beamTop) {                         killEnemy(e, i);                         i--;                     }                 }                 if(Math.random() < 0.2) {                     for(let i=0;i<10;i++) {                         let px = beamLeft + Math.random() * (beamRight - beamLeft);                         let py = beamTop + Math.random() * (beamBottom - beamTop);                         particles.push(new Particle(px, py, '#ffaa33', 4));                     }                 }             }              function drawBombBeam() {                 if(!bombActive) return;                 const beamLeft = bombBeamX;                 const beamWidth = player.width * 10;                 const beamRight = beamLeft + beamWidth;                 const beamTop = bombBeamTopY;                 const beamBottom = bombBeamBottomY;                 ctx.globalAlpha = 0.4;                 const grad = ctx.createLinearGradient(beamLeft, beamTop, beamLeft, beamBottom);                 grad.addColorStop(0, '#ffaa33');                 grad.addColorStop(1, '#ff4400');                 ctx.fillStyle = grad;                 ctx.fillRect(beamLeft, beamTop, beamWidth, beamBottom - beamTop);                 ctx.globalAlpha = 1;                 ctx.strokeStyle = '#ffff00';                 ctx.lineWidth = 2;                 ctx.strokeRect(beamLeft, beamTop, beamWidth, beamBottom - beamTop);             }              function drawPlayer() {                 if(isInvincibleWaiting() && (Math.floor(Date.now() / 100) % 2 === 0)) ctx.globalAlpha = 0.5;                 ctx.save(); ctx.shadowBlur=12; ctx.shadowColor='#00ffcc';                 ctx.beginPath(); ctx.moveTo(player.x+player.width/2, player.y); ctx.lineTo(player.x+player.width, player.y+player.height); ctx.lineTo(player.x, player.y+player.height); ctx.closePath();                 let grad = ctx.createLinearGradient(player.x, player.y, player.x+player.width/2, player.y+player.height);                 grad.addColorStop(0, '#33ffaa'); grad.addColorStop(1, '#10b981');                 ctx.fillStyle = grad; ctx.fill();                 ctx.strokeStyle = '#ffffffcc'; ctx.lineWidth = 1.5; ctx.stroke();                 ctx.beginPath(); ctx.moveTo(player.x+player.width/2, player.y+5); ctx.lineTo(player.x+player.width-8, player.y+player.height-12); ctx.lineTo(player.x+8, player.y+player.height-12); ctx.closePath();                 ctx.fillStyle = '#88ffdd'; ctx.fill();                 ctx.beginPath(); ctx.arc(player.x+player.width/2, player.y+12, 5, 0, Math.PI*2); ctx.fillStyle = '#ffffff'; ctx.fill();                 ctx.fillStyle = '#44ffaa'; ctx.beginPath(); ctx.arc(player.x+player.width/2, player.y+12, 3, 0, Math.PI*2); ctx.fill();                 let flameH = 8 + Math.sin(Date.now() * 0.015) * 3;                 ctx.fillStyle = '#ff8800'; ctx.beginPath(); ctx.moveTo(player.x+player.width/2-5, player.y+player.height); ctx.lineTo(player.x+player.width/2, player.y+player.height+flameH); ctx.lineTo(player.x+player.width/2+5, player.y+player.height); ctx.fill();                 ctx.fillStyle = '#ff4400'; ctx.beginPath(); ctx.moveTo(player.x+player.width/2-3, player.y+player.height); ctx.lineTo(player.x+player.width/2, player.y+player.height+flameH-3); ctx.lineTo(player.x+player.width/2+3, player.y+player.height); ctx.fill();                 ctx.fillStyle = '#ff0066'; ctx.beginPath(); ctx.arc(player.x+player.width-6, player.y+player.height-10, 3, 0, Math.PI*2); ctx.fill();                 ctx.beginPath(); ctx.arc(player.x+6, player.y+player.height-10, 3, 0, Math.PI*2); ctx.fill();                 ctx.restore(); ctx.globalAlpha = 1;                 for(let sf of subFighters) sf.draw(ctx);             }              function drawGrid() {                 ctx.strokeStyle='#10b98120'; ctx.lineWidth=0.5;                 for(let i=0;i<canvas.width;i+=50){                     ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke();                     ctx.beginPath(); ctx.moveTo(0,i%canvas.height); ctx.lineTo(canvas.width,i%canvas.height); ctx.stroke();                 }             }              function render() {                 if(!ctx) return;                 ctx.fillStyle='rgba(2,2,8,0.25)'; ctx.fillRect(0,0,canvas.width,canvas.height);                 drawGrid(); updateStars(); drawStars();                 for(let e of enemies) e.draw(ctx);                 if(boss) boss.draw(ctx);                 for(let b of bullets) b.draw(ctx);                 for(let p of powerups) p.draw(ctx);                 drawPlayer();                 drawBombBeam();                 for(let i=particles.length-1;i>=0;i--) { if(particles[i].update()) particles.splice(i,1); else particles[i].draw(ctx); }                 for(let i=floatingTexts.length-1;i>=0;i--) { if(floatingTexts[i].update()) floatingTexts.splice(i,1); else floatingTexts[i].draw(ctx); }                 ctx.font='12px monospace'; ctx.fillStyle='#10b981cc';                 ctx.fillText(`武器 Lv.${weaponLevel}`, player.x+5, player.y-10);                 if(levelState==='spawn' && gameStarted) {                     ctx.fillStyle='#ffff88'; ctx.fillText(`本關進度: ${scoreThisLevel}/${goalScore}`, canvas.width-140, 40);                 }                 if(isInvincibleWaiting()) { let r=Math.max(0, Math.ceil((invincibleUntil-Date.now())/1000)); ctx.fillStyle='#88ff88'; ctx.fillText(`無敵: ${r}s`, player.x+5, player.y-25); }             }              function gameLoop() {                 if(gameStarted && !isGameOver){                     updateLevelProgression();                     updateBullets();                     updatePowerups();                     updateEnemies();                     updateSubFighters();                     updatePlayerPosition();                     updateComboDecay();                     updateInvincibleWeapon();                     updateBombBeam();                 }                 render();                 requestAnimationFrame(gameLoop);             }              function resizeCanvas() {                 canvas.width = window.innerWidth; canvas.height = window.innerHeight;                 player.y = canvas.height - 50; player.width = 44; player.height = 44;                 player.x = Math.min(Math.max(player.x,5), canvas.width-player.width-5); moveTargetX = player.x;                 if(boss) boss.x = Math.min(Math.max(boss.x,0), canvas.width-boss.w);                 initStars();             }              function bindEvents() {                 canvas.addEventListener('mousemove', onMouseMove);                 canvas.addEventListener('touchmove', onTouchMove, { passive: false });                 canvas.addEventListener('touchstart', (e) => { e.preventDefault(); }, { passive: false });                 restartBtn.addEventListener('click', () => { resetGame(); showMessage("遊戲重啟","#10b981"); });                 gameOverContinue.addEventListener('click', () => { continueFromGameOver(); });                 gameOverRestartBtn.addEventListener('click', () => { resetGame(); });                 startGameBtn.addEventListener('click', () => { startGame(); });                 bombBtn.addEventListener('click', (e) => { e.stopPropagation(); if(gameStarted && !isGameOver) useBomb(); });                 window.addEventListener('resize', ()=>{ resizeCanvas(); if(!isGameOver) resetGame(); else resetGame(); });                 window.addEventListener('load', () => { unlockAudio(); loadRanking(); });                 document.body.addEventListener('touchstart', ()=>{ if(!audioUnlocked) unlockAudio(); }, { once: true });                 document.body.addEventListener('click', ()=>{ if(!audioUnlocked) unlockAudio(); }, { once: true });                 window.addEventListener('keydown', (e) => { if(e.key==='b'||e.key==='B'){ e.preventDefault(); if(gameStarted && !isGameOver) useBomb(); } });             }              function init() {                 resizeCanvas(); initStars(); resetGame(); bindEvents();                 setInterval(()=>{ if(gameStarted && !isGameOver) shoot(); }, shootDelay);                 gameLoop();             }             init();         })();     </script> </body> </html>
