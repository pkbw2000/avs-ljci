<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>暗棋</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            background: #1a0f08;
            font-family: 'Noto Sans SC', 'PingFang TC', 'Microsoft YaHei', sans-serif;
            touch-action: manipulation;
        }

        .game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            background: radial-gradient(ellipse at 50% 30%, #3d281a, #1a0f08);
        }

        /* ----- 棋盤外框 ----- */
        .board-outer {
            background: linear-gradient(165deg, #c4925a, #e8c088);
            border-radius: clamp(12px, 3vw, 28px);
            padding: clamp(8px, 2vw, 24px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), inset 0 1px 4px rgba(255,215,150,0.3);
            width: min(94vw, 76vh);
            max-width: 540px;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2px 6px 2px;
            color: #f7edd9;
            text-shadow: 0 2px 6px rgba(0,0,0,0.7);
            font-weight: 700;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: clamp(0.8rem, 2.8vw, 1.4rem);
            letter-spacing: 2px;
            background: linear-gradient(to right, #ffe5b4, #f7d59a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .turn-indicator {
            background: rgba(0,0,0,0.4);
            padding: 3px 12px;
            border-radius: 30px;
            font-size: clamp(0.6rem, 2vw, 0.9rem);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,215,140,0.2);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .turn-dot {
            display: inline-block;
            width: clamp(8px, 1.6vw, 14px);
            height: clamp(8px, 1.6vw, 14px);
            border-radius: 50%;
            background: #e74c3c;
            box-shadow: 0 0 10px #e74c3c88;
            transition: 0.25s;
            flex-shrink: 0;
        }
        .turn-dot.black-turn {
            background: #222;
            box-shadow: 0 0 10px #88888888;
        }

        /* ----- 棋盤本體：使用 flex 撐開比例 ----- */
        .board-wrapper {
            width: 100%;
            background: linear-gradient(145deg, #c99f66, #eac68c);
            border-radius: clamp(6px, 1.5vw, 14px);
            box-shadow: inset 0 0 0 2px #b3874b, inset 0 0 30px #6f4f2a55;
            padding: clamp(3px, 0.8vw, 8px);
            /* 關鍵：使用 aspect-ratio 強制 4:8 (行:列) */
            aspect-ratio: 4 / 8;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .board-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: clamp(2px, 0.4vw, 4px);
            width: 100%;
            height: 100%;
        }

        .cell {
            background: radial-gradient(circle at 30% 30%, #eec291, #c79154);
            border-radius: clamp(3px, 0.6vw, 8px);
            box-shadow: inset 0 2px 6px rgba(90,55,20,0.3), 0 1px 2px rgba(255,215,140,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            width: 100%;
            height: 100%;
        }

        .cell.highlight {
            background: radial-gradient(circle at 30% 30%, #b8d9a0, #7fb068);
            box-shadow: inset 0 0 0 2px #f5ffb0, 0 0 16px #b5e68c88;
        }
        .cell.highlight-capture {
            background: radial-gradient(circle at 30% 30%, #e6a0a0, #b05a5a);
            box-shadow: inset 0 0 0 2px #ffb0b0, 0 0 16px #e68c8c88;
        }

        /* ----- 棋子 ----- */
        .piece {
            width: 92%;
            height: 92%;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(0.7rem, 2.6vw, 1.6rem);
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
            transition: all 0.1s ease;
            box-shadow: 0 3px 0 rgba(0,0,0,0.25), 0 5px 14px rgba(0,0,0,0.35);
            will-change: transform;
            border: 2px solid rgba(255,255,255,0.12);
            background: radial-gradient(circle at 35% 30%, #f5e3c0, #b8895a);
            color: #2d1b0a;
            position: relative;
            cursor: pointer;
            touch-action: manipulation;
            flex-shrink: 0;
            z-index: 2;
        }

        .piece.back {
            background: radial-gradient(circle at 40% 35%, #68543a, #2f1e0e);
            border: 2px solid #7a623e;
            box-shadow: 0 3px 0 #1f140a, 0 5px 14px rgba(0,0,0,0.5);
            color: transparent;
            font-size: 0;
        }
        .piece.back::after {
            content: "♟";
            color: #ad8b5a;
            font-size: clamp(0.9rem, 3.2vw, 2rem);
            opacity: 0.35;
            text-shadow: none;
        }

        .piece.red {
            background: radial-gradient(circle at 35% 28%, #ffb8a8, #b33a2a);
            border: 2px solid #ffd0b0;
            color: #fff4e8;
            text-shadow: 0 2px 6px #4a0a00;
            box-shadow: 0 3px 0 #631f14, 0 5px 14px rgba(0,0,0,0.4);
        }
        .piece.black {
            background: radial-gradient(circle at 35% 28%, #5a5a5a, #1a1a1a);
            border: 2px solid #888;
            color: #f0f0f0;
            text-shadow: 0 2px 6px #000;
            box-shadow: 0 3px 0 #111, 0 5px 14px rgba(0,0,0,0.5);
        }

        .piece.selected {
            transform: scale(1.06);
            filter: brightness(1.2) drop-shadow(0 0 16px #ffdd88);
            border: 3px solid #ffecb0;
            z-index: 10;
        }

        .piece.clickable:active {
            transform: scale(0.92);
        }

        @keyframes flipIn {
            0% { transform: rotateY(90deg) scale(0.7); opacity: 0.3; }
            100% { transform: rotateY(0) scale(1); opacity: 1; }
        }
        .piece.flip-anim {
            animation: flipIn 0.2s ease-out;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            margin-top: 6px;
            gap: 6px;
            width: 100%;
        }
        .status-msg {
            background: rgba(30,18,6,0.5);
            padding: 4px 12px;
            border-radius: 30px;
            color: #f7e7d0;
            font-size: clamp(0.55rem, 1.8vw, 0.85rem);
            backdrop-filter: blur(4px);
            border: 1px solid #ab8a5e44;
            flex: 1;
            min-width: 0;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .btn {
            background: linear-gradient(145deg, #5b3f28, #2f1f12);
            border: none;
            border-radius: 30px;
            padding: 5px 14px;
            color: #f2dec6;
            font-weight: 600;
            font-size: clamp(0.55rem, 1.6vw, 0.8rem);
            box-shadow: 0 3px 0 #1f1308, 0 3px 10px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: 0.06s linear;
            border: 1px solid #8b6d4a;
            letter-spacing: 0.5px;
            white-space: nowrap;
            touch-action: manipulation;
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 0px 0 #1f1308;
        }
        .btn-primary {
            background: linear-gradient(145deg, #7f5a38, #4d321e);
            border-color: #b88f60;
            color: #ffefda;
        }

        @media (max-height: 650px) {
            .header h1 { font-size: clamp(0.5rem, 2.2vw, 0.7rem); }
            .turn-indicator { font-size: clamp(0.4rem, 1.6vw, 0.6rem); padding: 2px 8px; }
            .status-msg { font-size: clamp(0.4rem, 1.4vw, 0.6rem); padding: 2px 8px; }
            .btn { font-size: clamp(0.4rem, 1.4vw, 0.6rem); padding: 3px 10px; }
            .header { padding-bottom: 3px; }
            .status-bar { margin-top: 3px; }
            .board-outer { padding: 5px; border-radius: 8px; }
            .board-wrapper { padding: 2px; }
        }

        @media (max-width: 380px) {
            .board-outer { padding: 4px; border-radius: 6px; }
            .board-wrapper { padding: 2px; }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .game-container::before {
                content: "↻ 請轉為直立";
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.92);
                color: #f2dec6;
                font-size: clamp(1.2rem, 5vw, 2rem);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 999;
                backdrop-filter: blur(8px);
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="board-outer">
        <div class="header">
            <h1>♟ 暗棋</h1>
            <div class="turn-indicator">
                <span id="turnText">紅方</span>
                <span class="turn-dot" id="turnDot"></span>
            </div>
        </div>

        <div class="board-wrapper">
            <div class="board-grid" id="boardGrid"></div>
        </div>

        <div class="status-bar">
            <div class="status-msg" id="statusMsg">點擊翻牌</div>
            <button class="btn btn-primary" id="restartBtn">↺ 新局</button>
        </div>
    </div>
</div>

<script>
    (function() {
        "use strict";

        // ----- 棋子名稱 -----
        const NAMES = {
            red: ['', '帥', '仕', '相', '俥', '傌', '炮', '兵'],
            black: ['', '將', '士', '象', '車', '馬', '砲', '卒']
        };

        function getPieceName(color, rank) {
            return NAMES[color][rank] || '?';
        }

        function canCapture(attackerRank, defenderRank) {
            if (attackerRank === 7 && defenderRank === 1) return true;
            return attackerRank < defenderRank;
        }

        // ----- 狀態 -----
        let board = [];
        let turn = 'red';
        let selectedPos = null;
        let highlightCells = [];
        let gameOver = false;

        const gridEl = document.getElementById('boardGrid');
        const turnText = document.getElementById('turnText');
        const turnDot = document.getElementById('turnDot');
        const statusMsg = document.getElementById('statusMsg');
        const restartBtn = document.getElementById('restartBtn');

        // ----- 初始化 -----
        function initGame() {
            const pieces = [];
            // 紅方 16枚
            pieces.push({ color: 'red', rank: 1 }); // 帥
            for (let i = 0; i < 2; i++) pieces.push({ color: 'red', rank: 2 }); // 仕
            for (let i = 0; i < 2; i++) pieces.push({ color: 'red', rank: 3 }); // 相
            for (let i = 0; i < 2; i++) pieces.push({ color: 'red', rank: 4 }); // 俥
            for (let i = 0; i < 2; i++) pieces.push({ color: 'red', rank: 5 }); // 傌
            for (let i = 0; i < 2; i++) pieces.push({ color: 'red', rank: 6 }); // 炮
            for (let i = 0; i < 5; i++) pieces.push({ color: 'red', rank: 7 }); // 兵

            // 黑方 16枚
            pieces.push({ color: 'black', rank: 1 }); // 將
            for (let i = 0; i < 2; i++) pieces.push({ color: 'black', rank: 2 }); // 士
            for (let i = 0; i < 2; i++) pieces.push({ color: 'black', rank: 3 }); // 象
            for (let i = 0; i < 2; i++) pieces.push({ color: 'black', rank: 4 }); // 車
            for (let i = 0; i < 2; i++) pieces.push({ color: 'black', rank: 5 }); // 馬
            for (let i = 0; i < 2; i++) pieces.push({ color: 'black', rank: 6 }); // 砲
            for (let i = 0; i < 5; i++) pieces.push({ color: 'black', rank: 7 }); // 卒

            // 洗牌
            for (let i = pieces.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pieces[i], pieces[j]] = [pieces[j], pieces[i]];
            }

            board = [];
            let idx = 0;
            for (let r = 0; r < 4; r++) {
                const row = [];
                for (let c = 0; c < 8; c++) {
                    const p = pieces[idx++];
                    row.push({
                        color: p.color,
                        rank: p.rank,
                        faceUp: false,
                    });
                }
                board.push(row);
            }

            turn = 'red';
            selectedPos = null;
            highlightCells = [];
            gameOver = false;
            render();
            statusMsg.innerText = '點擊暗棋翻牌 · 紅方先手';
        }

        function getPiece(row, col) {
            if (row < 0 || row > 3 || col < 0 || col > 7) return null;
            return board[row][col];
        }

        // ----- 走法生成 (含炮規則) -----
        function generateMoves(row, col) {
            const piece = getPiece(row, col);
            if (!piece || !piece.faceUp) return [];
            const moves = [];
            const color = piece.color;
            const rank = piece.rank;
            const isCannon = (rank === 6);

            const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
            for (const d of dirs) {
                let nr = row + d[0];
                let nc = col + d[1];
                if (nr < 0 || nr > 3 || nc < 0 || nc > 7) continue;
                const target = getPiece(nr, nc);
                if (!target) {
                    // 空格：可移動 (炮也可以一般移動)
                    moves.push({ row: nr, col: nc, type: 'move' });
                } else if (target.faceUp && target.color !== color) {
                    if (isCannon) {
                        // 炮/砲：跳吃
                        let r = row + d[0];
                        let c = col + d[1];
                        let jumpCount = 0;
                        while (r >= 0 && r < 4 && c >= 0 && c < 8) {
                            const mid = getPiece(r, c);
                            if (mid && mid.faceUp) {
                                jumpCount++;
                                if (jumpCount === 2) {
                                    if (mid.color !== color) {
                                        moves.push({ row: r, col: c, type: 'capture' });
                                    }
                                    break;
                                }
                            }
                            r += d[0];
                            c += d[1];
                        }
                    } else {
                        // 非炮：直接吃 (需等級判定)
                        if (canCapture(rank, target.rank)) {
                            moves.push({ row: nr, col: nc, type: 'capture' });
                        }
                    }
                }
            }
            return moves;
        }

        function makeMove(fromRow, fromCol, toRow, toCol) {
            const piece = board[fromRow][fromCol];
            board[toRow][toCol] = piece;
            board[fromRow][fromCol] = { color: null, rank: 0, faceUp: false };

            turn = (turn === 'red' ? 'black' : 'red');
            selectedPos = null;
            highlightCells = [];
            render();
            checkGameOver();
        }

        function checkGameOver() {
            let redCount = 0, blackCount = 0;
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 8; c++) {
                    const p = board[r][c];
                    if (p && p.faceUp && p.color) {
                        if (p.color === 'red') redCount++;
                        else blackCount++;
                    }
                }
            }
            if (redCount === 0) {
                gameOver = true;
                statusMsg.innerText = '🏆 黑方勝利！';
                return true;
            }
            if (blackCount === 0) {
                gameOver = true;
                statusMsg.innerText = '🏆 紅方勝利！';
                return true;
            }
            return false;
        }

        // ----- 點擊處理 -----
        function handleCellClick(row, col) {
            if (gameOver) {
                statusMsg.innerText = '遊戲結束，按「新局」繼續';
                return;
            }

            const piece = getPiece(row, col);

            // 有選中棋子 -> 嘗試走法
            if (selectedPos) {
                const isHighlight = highlightCells.some(h => h.row === row && h.col === col);
                if (isHighlight) {
                    makeMove(selectedPos.row, selectedPos.col, row, col);
                    return;
                } else {
                    selectedPos = null;
                    highlightCells = [];
                    render();
                    if (piece && piece.faceUp && piece.color === turn) {
                        selectedPos = { row, col };
                        highlightCells = generateMoves(row, col);
                        render();
                    }
                    return;
                }
            }

            // 無選中: 翻牌 或 選己方棋子
            if (!piece || !piece.faceUp) {
                if (piece && !piece.faceUp) {
                    piece.faceUp = true;
                    render();
                    if (!checkGameOver()) {
                        turn = (turn === 'red' ? 'black' : 'red');
                        render();
                        statusMsg.innerText = `${turn === 'red' ? '紅' : '黑'}方回合`;
                    }
                }
                return;
            }

            // 點擊己方明棋 -> 選取
            if (piece.color === turn) {
                selectedPos = { row, col };
                highlightCells = generateMoves(row, col);
                render();
                statusMsg.innerText = `選取 ${piece.color === 'red' ? '紅' : '黑'} ${getPieceName(piece.color, piece.rank)}`;
            } else {
                statusMsg.innerText = `請選 ${turn === 'red' ? '紅' : '黑'}方棋子`;
            }
        }

        // ----- 渲染 (每個格子必定產生棋子) -----
        function render() {
            gridEl.innerHTML = '';
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 8; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const p = board[r][c];

                    const isHighlight = highlightCells.some(h => h.row === r && h.col === c);
                    if (isHighlight) {
                        const hType = highlightCells.find(h => h.row === r && h.col === c);
                        cell.classList.add(hType.type === 'capture' ? 'highlight-capture' : 'highlight');
                    }
