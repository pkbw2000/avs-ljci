<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>找牛邏輯</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#111827;
color:white;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;

}

.screen{

width:100%;
max-width:900px;
padding:20px;
display:none;

}

.active{

display:block;

}

.title{

font-size:48px;
font-weight:bold;
text-align:center;
margin-bottom:50px;

}

.buttonArea{

display:flex;
flex-direction:column;
gap:20px;

}

button{

border:none;
padding:18px;
border-radius:15px;
font-size:20px;
cursor:pointer;
background:#3B82F6;
color:white;
transition:.3s;

}

button:hover{

transform:scale(1.03);

}

#board{

display:grid;
gap:4px;
margin-top:20px;

}

.cell{

width:60px;
height:60px;

display:flex;
justify-content:center;
align-items:center;

font-size:28px;
font-weight:bold;

border-radius:10px;

cursor:pointer;

transition:.3s;

position:relative;

border:2px solid rgba(255,255,255,.1);

}

.highlight{

outline:5px solid yellow;
transform:scale(1.1);

}

.lock{

pointer-events:none;
opacity:.3;

}

.dialog{

margin-top:20px;

padding:20px;

background:#1f2937;

border-radius:15px;

min-height:100px;

font-size:18px;
line-height:1.6;

}

.top{

display:flex;
justify-content:space-between;
align-items:center;

}

.level{

font-size:24px;
font-weight:bold;

}

.next{

margin-top:20px;

}

.red{

background:#EF4444;
}

.blue{

background:#3B82F6;
}

.green{

background:#10B981;
}

.yellow{

background:#F59E0B;
}

.purple{

background:#8B5CF6;
}

.orange{

background:#F97316;
}

.cyan{

background:#06B6D4;
}

.pink{

background:#EC4899;
}

.gray{

background:#6B7280;
}

</style>

</head>

<body>

<div id="home" class="screen active">

<div class="title">

🐄 找牛邏輯

</div>

<div class="buttonArea">

<button onclick="startTutorial()">

教學模式

</button>

<button onclick="comingSoon()">

開始遊戲

</button>

</div>

</div>

<div id="tutorial" class="screen">

<div class="top">

<div class="level" id="levelTitle">

</div>

<button onclick="nextStep()">

下一步

</button>

</div>

<div id="board">

</div>

<div class="dialog" id="dialog">

</div>

</div>

<script>

const levels=[

{

title:"4x4 基礎規則",

size:4,

grid:[

["red","red","blue","blue"],
["red","green","blue","yellow"],
["green","green","yellow","yellow"],
["green","yellow","yellow","yellow"]

],

steps:[

{

text:"歡迎！每種顏色只能有一頭牛"

},

{

text:"請點黃色唯一可能位置",

target:[1,3]

},

{

text:"很好！同一列不能有第二頭牛"

},

{

text:"牛周圍八格都不能再放牛"

}

]

},

{

title:"5x5 顏色排除",

size:5,

grid:[

["red","red","blue","blue","blue"],
["red","green","green","yellow","yellow"],
["purple","green","yellow","yellow","orange"],
["purple","cyan","cyan","orange","orange"],
["purple","cyan","pink","pink","pink"]

],

steps:[

{

text:"黃色已被其它列占用"

},

{

text:"因此黃色全部排除"

},

{

text:"試著找唯一位置"

}

]

},

{

title:"6x6 鄰居規則",

size:6,

grid:[

["red","red","blue","blue","green","green"],
["red","yellow","yellow","blue","green","orange"],
["purple","yellow","cyan","cyan","orange","orange"],
["purple","pink","cyan","gray","gray","orange"],
["pink","pink","purple","purple","gray","green"],
["pink","purple","purple","green","green","green"]

],

steps:[

{text:"牛不能接觸"},
{text:"包含斜角"},
{text:"注意周圍八格"}

]

}

];

let levelIndex=0;
let stepIndex=0;

function startTutorial(){

document.getElementById("home")
.classList.remove("active");

document.getElementById("tutorial")
.classList.add("active");

loadLevel();

}

function loadLevel(){

let level=levels[levelIndex];

document.getElementById(
"levelTitle"
).innerText=level.title;

let board=
document.getElementById(
"board"
);

board.innerHTML="";

board.style.gridTemplateColumns=
`repeat(${level.size},1fr)`;

for(let r=0;r<level.size;r++){

for(let c=0;c<level.size;c++){

let cell=
document.createElement("div");

cell.className=
"cell "+level.grid[r][c];

cell.dataset.r=r;
cell.dataset.c=c;

cell.onclick=()=>cellClick(
r,c
);

board.appendChild(cell);

}

}

stepIndex=0;

showStep();

}

function showStep(){

let level=
levels[levelIndex];

let step=
level.steps[stepIndex];

document.getElementById(
"dialog"
).innerHTML=
step.text;

clearHighlight();

if(step.target){

let cells=
document.querySelectorAll(
".cell"
);

cells.forEach(cell=>{

let r=
Number(cell.dataset.r);

let c=
Number(cell.dataset.c);

if(
r===step.target[0]
&&
c===step.target[1]
){

cell.classList.add(
"highlight"
);

}

});

}

}

function clearHighlight(){

document
.querySelectorAll(
".cell"
)
.forEach(c=>{

c.classList.remove(
"highlight"
);

});

}

function cellClick(r,c){

let level=
levels[levelIndex];

let step=
level.steps[stepIndex];

if(!step.target)return;

if(
r===step.target[0]
&&
c===step.target[1]
){

let cells=
document.querySelectorAll(
".cell"
);

cells.forEach(cell=>{

if(

Number(cell.dataset.r)
===r

&&

Number(cell.dataset.c)
===c

){

cell.innerHTML="🐄";

}

});

nextStep();

}
else{

document.getElementById(
"dialog"
).innerHTML=
"請依照提示觀察邏輯";

}

}

function nextStep(){

let level=
levels[levelIndex];

stepIndex++;

if(
stepIndex
>=
level.steps.length
){

levelIndex++;

if(
levelIndex
>=
levels.length
){

document.getElementById(
"dialog"
).innerHTML=
"🎉 教學完成";

return;

}

loadLevel();

return;

}

showStep();

}

function comingSoon(){

alert(
"開始遊戲開發中"
);

}

</script>

</body>
</html>
