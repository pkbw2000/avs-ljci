<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>找牛邏輯推理 - 完全教學版</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --text-color: #2c3e50;
            --cell-size: 60px;
            --gap: 4px;
            --primary-color: #3498db;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            text-align: center;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* --- 狀態與規則欄 --- */
        header h1 { margin: 0 0 10px 0; font-size: 1.5rem; color: #333; }
        .status-bar {
            display: flex;
            justify-content: space-between;
            background: white;
            padding: 10px 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 15px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .status-bar.active { opacity: 1; }

        .lives {
            display: flex; gap: 4px; font-size: 20px; transition: all 0.3s;
        }
        .lives .heart { transition: all 0.3s; }
        .lives .heart.lost {
            filter: grayscale(1); opacity: 0.3; transform: scale(0.7);
        }

        .rules-box {
            background: rgba(255,255,255,0.7); border-radius: 8px;
            padding: 6px 10px; margin: 0 0 10px 0; font-size: 12px; text-align: left;
            color: #555; line-height: 1.5; display: none;
        }
        .rules-box.active { display: block; }

        /* --- 遊戲網格 --- */
        #grid-wrapper {
            display: none;
            background: #fff;
            padding: 10px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }
        #grid-wrapper.active { display: inline-block; }

        .grid { display: grid; gap: var(--gap); touch-action: none; }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            position: relative;
        }
        .cell:active { transform: scale(0.95); }
        
        .cell[data-state="COW"]::after { content: "🐮"; }
        .cell[data-state="CROSS"]::after { content: "❌"; font-size: 1.5rem; opacity: 0.8; }
        .cell[data-state="EMPTY"]::after { content: ""; }
        
        /* 教學高亮 */
        .highlight-ring {
            position: absolute;
            top: -6px; left: -6px; right: -6px; bottom: -6px;
            border: 3px solid var(--primary-color);
            border-radius: 12px;
            animation: pulse 1.5s infinite;
            z-index: 10;
            pointer-events: none;
            background: rgba(52, 152, 219, 0.15);
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.6; }
            100% { transform: scale(1); opacity: 1; }
        }

        .cell.locked { opacity: 0.5; pointer-events: none; }
        .cell.locked.highlight-lock { opacity: 1; pointer-events: auto; }

        /* 示範牛边框 */
        .cell.demo-cow { border: 2px solid #ff5722; box-shadow: 0 0 10px rgba(255,87,34,0.4); }

        /* 提示與按鈕 */
        #msg-box {
            background: white; padding: 12px; border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); min-height: 50px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            border-left: 5px solid var(--primary-color); margin-top: 5px;
            font-size: 14px; line-height: 1.5;
        }
        
        #next-btn {
            background: var(--success-color); color: white; border: none;
            padding: 10px 24px; border-radius: 20px; font-size: 1rem; font-weight: bold;
            cursor: pointer; display: none; margin-top: 10px;
        }

        .toast-msg {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: white; padding: 10px 20px;
            border-radius: 20px; z-index: 999; font-weight: bold; pointer-events: none;
            opacity: 0; transition: opacity 0.3s;
        }
        .toast-msg.show { opacity: 1; }

        /* 顏色定義 */
        .color-red { background-color: #ff6b6b; }
        .color-blue { background-color: #4dabf7; }
        .color-green { background-color: #69db7c; }
        .color-yellow { background-color: #ffd43b; }
        .color-purple { background-color: #cc5de8; }
        .color-orange { background-color: #ff922b; }
        .color-brown { background-color: #a08b76; }

        @media (max-width: 400px) {
            :root { --cell-size: 45px; }
        }
    </style>
</head>
<body>
<div id="game-container">
    <header>
        <h1>🐮 找牛邏輯教學</h1>
        <div class="status-bar" id="statusBar">
            <span id="level-display">關卡: 1/4</span>
            <div class="lives" id="livesDisplay"><span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span></div>
        </div>
    </header>
    
    <div class="rules-box" id="rulesBox">
        <b>💡 過關規則：</b><br>
        ① 🚫 牛的上下左右及斜角不能有牛<br>
        ② ⬜ 每行、每列只能有 1 頭牛<br>
        ③ 🎨 每種顏色只能對應 1 頭牛<br>
        <span style="color: #e74c3c;">❤️ 放錯扣除 1 顆心，三顆用完重來。</span>
    </div>

    <div id="grid-wrapper">
        <div id="grid" class="grid"></div>
    </div>

    <div id="msg-box">
        <div id="hint-text">歡迎來到找牛世界，點擊下方按鈕開始教學。</div>
        <button id="next-btn" onclick="startTutorial()">開始學習</button>
    </div>
</div>
<div id="toast" class="toast-msg"></div>

<script>
    // === 遊戲引擎與狀態 ===
    const STATE = { EMPTY: 0, COW: 1, CROSS: 2 };
    const COLORS = ['red', 'blue', 'green', 'yellow', 'purple', 'orange', 'brown'];
    const COLOR_NAMES = { 'red': '紅', 'blue': '藍', 'green': '綠', 'yellow': '黃', 'purple': '紫', 'orange': '橘', 'brown': '棕' };
    
    let currentLevel = 0;
    let gridData = [];
    let gridSize = 4;
    let lives = 3;
    let isGameLocked = false;
    let isProcessing = false;
    let isLevelComplete = false;

    // 針對教學的狀態指引
    let currentStep = 0; 
    let stepInstructions = [];
    let totalCowsInLevel = 0;
    let demonstrationCow = null; // 示範牛坐標
    let correctSolution = [];

    // === N皇后 回溯算法 (生成嚴謹的唯一解) ===
    function solveNQueens(size) {
        let result = null;
        let board = Array(size).fill(-1);
        function isSafe(row, col) {
            for (let prevRow = 0; prevRow < row; prevRow++) {
                let prevCol = board[prevRow];
                if (prevCol === col) return false;
                if (Math.abs(prevCol - col) === Math.abs(prevRow - row)) return false;
            }
            return true;
        }
        function backtrack(row) {
            if (row === size) { result = board.map((c, r) => ({x: c, y: r})); return true; }
            for (let col = 0; col < size; col++) {
                if (isSafe(row, col)) {
                    board[row] = col;
                    if (backtrack(row + 1)) return true;
                    board[row] = -1;
                }
            }
            return false;
        }
        backtrack(0);
        return result || [];
    }

    // 生成關卡數據
    function generateLevelData(size) {
        let solution = solveNQueens(size);
        let colors = [];
        for(let r=0; r<size; r++) {
            let row = [];
            for(let c=0; c<size; c++) {
                let minDist = 999; let colorId = 0;
                solution.forEach((s, i) => {
                    let dist = Math.abs(s.x - c) + Math.abs(s.y - r);
                    if(dist < minDist) { minDist = dist; colorId = i; }
                });
                row.push(COLORS[colorId % COLORS.length]);
            }
            colors.push(row);
        }
        return { solution, colors };
    }

    // 教學大綱
    const TUTORIALS = [
        { size: 4 }, // 1. 基礎教學
        { size: 4 }, // 2. 鞏固練習
        { size: 5 }, // 3. 進階推理
        { size: 6 }  // 4. 綜合挑戰
    ];

    // === 核心渲染 ===
    function initLevel(level) {
        currentLevel = level;
        const data = TUTORIALS[level];
        gridSize = data.size;
        lives = 3;
        isLevelComplete = false;
        isGameLocked = false;
        currentStep = 0;
        stepInstructions = [];

        const lvData = generateLevelData(gridSize);
        correctSolution = lvData.solution;
        
        document.getElementById('level-display').innerText = `關卡: ${level+1}/${TUTORIALS.length}`;
        document.getElementById('rulesBox').classList.add('active');
        document.getElementById('msg-box').style.borderLeftColor = 'var(--primary-color)';
        document.getElementById('hint-text').innerText = `第 ${level+1} 關開始！請找出 ${gridSize} 頭牛。`;
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('next-btn').innerText = '進入下一關 ➜';
        
        // 初始化棋盤數據
        gridData = [];
        for(let r=0; r<gridSize; r++) {
            let row = [];
            for(let c=0; c<gridSize; c++) {
                row.push({ state: STATE.EMPTY, color: lvData.colors[r][c] });
            }
            gridData.push(row);
        }

        // 設定「示範牛」並自動放置 (保證玩家一進來就有牛)
        demonstrationCow = correctSolution[0];
        gridData[demonstrationCow.y][demonstrationCow.x].state = STATE.COW;

        renderBoard();
        updateUI();
        startLevelGuide();
    }

    function renderBoard() {
        const gridEl = document.getElementById('grid');
        gridEl.innerHTML = '';
        gridEl.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
        // 解除滑動原生行為的阻擋
        gridEl.style.touchAction = 'none';
        
        for(let r=0; r<gridSize; r++) {
            for(let c=0; c<gridSize; c++) {
                const cellData = gridData[r][c];
                const cellEl = document.createElement('div');
                cellEl.className = `cell color-${cellData.color}`;
                cellEl.dataset.r = r;
                cellEl.dataset.c = c;
                cellEl.dataset.state = 'EMPTY';
                if (cellData.state === STATE.COW) cellEl.dataset.state = 'COW';
                else if (cellData.state === STATE.CROSS) cellEl.dataset.state = 'CROSS';

                // 標記示範牛
                if (demonstrationCow && r === demonstrationCow.y && c === demonstrationCow.x) {
                    cellEl.classList.add('demo-cow');
                }

                // 教學鎖定系統
                cellEl.classList.add('locked'); 

                // ---- 事件綁定 (單擊/雙擊) ----
                let clickTimer = null;
                cellEl.addEventListener('click', function(e) {
                    if (isGameLocked || isProcessing) return;
                    if(cellEl.classList.contains('locked') && !currentStepLockIsTarget(r,c)) return;

                    if(clickTimer) {
                        clearTimeout(clickTimer);
                        clickTimer = null;
                        handleInteraction(r, c, 'DOUBLE');
                    } else {
                        clickTimer = setTimeout(() => {
                            clickTimer = null;
                            handleInteraction(r, c, 'SINGLE');
                        }, 300);
                    }
                });

                // ---- 連續滑動連續打叉 ---- 
                // 處理 touch 事件：手指在螢幕上滑動，連續標記排除
                let isSliding = false;
                cellEl.addEventListener('touchstart', function() {
                    isSliding = false; // 重置
                });

                // 使用 document 層級的 touchmove 提高滑動偵測準確性
                cellEl.addEventListener('touchmove', function(e) {
                    e.preventDefault(); // 防止頁面被拖動
                    if (isGameLocked || isProcessing) return;
                    
                    // 取得手指劃過的目標元素
                    const touch = e.touches[0];
                    const elementUnderTouch = document.elementFromPoint(touch.clientX, touch.clientY);
                    
                    if (elementUnderTouch && elementUnderTouch.classList.contains('cell')) {
                        const tr = parseInt(elementUnderTouch.dataset.r);
                        const tc = parseInt(elementUnderTouch.dataset.c);
                        // 教學階段：只能滑動高亮目標
                        if (currentStepLockIsTarget(tr, tc)) {
                            handleSlideInteraction(tr, tc);
                        } else if (!cellEl.classList.contains('locked')) {
                            // 自由階段：允許隨意滑動
                            handleSlideInteraction(tr, tc);
                        }
                    }
                }, { passive: false });

                gridEl.appendChild(cellEl);
            }
        }
    }

    // 判斷當前是否為教學鎖定目標
    function currentStepLockIsTarget(r, c) {
        if (currentStep < stepInstructions.length) {
            const target = stepInstructions[currentStep];
            if (target.r === r && target.c === c) return true;
        }
        return false;
    }

    // === 引導教學循環 ===
    function startLevelGuide() {
        // 設計 3 個教學步驟, 引導玩家放置第一頭牛，然後解鎖自由模式
        let target1 = correctSolution[1];
        let target2 = {r:0, c:0}; // 打叉的示範
        // 確保打叉目標沒跟示範牛重疊
        if (target2.r === demonstrationCow.y && target2.c === demonstrationCow.x) target2 = {r:0, c:1};

        // 覆蓋下一步
        if (gridSize === 4) {
            // 4x4 的專屬打叉練習
            stepInstructions = [
                { r: target1.y, c: target1.x, type: 'COW', msg: `請**雙擊**高亮的 ${COLOR_NAMES[gridData[target1.y][target1.x].color]} 色格子，放置你的第一頭牛！` },
                { r: target2.y, c: target2.x, type: 'CROSS', msg: `試試 **單擊** 這個格子打叉 ❌ 排除它，因為它不符合行列規則。` },
            ];
        } else {
            // 大於4x4的直接進入
            stepInstructions = [];
        }
        
        currentStep = 0;
        applyStepLock();
    }

    function applyStepLock() {
        const cells = document.querySelectorAll('.cell');
        cells.forEach(el => el.classList.add('locked'));
        
        // 解鎖示範牛（不可移動，但不影響點擊體驗）
        // 但教學中，我們應該鼓勵玩家點擊其他地方，所以先鎖定示範牛

        // 解鎖當前步驟的目標
        if (currentStep < stepInstructions.length) {
            const target = stepInstructions[currentStep];
            const targetEl = document.querySelector(`.cell[data-r='${target.r}'][data-c='${target.c}']`);
            if (targetEl) {
                targetEl.classList.remove('locked');
                document.getElementById('hint-text').innerText = target.msg;
                // 高亮圈
                document.querySelectorAll('.highlight-ring').forEach(el => el.remove());
                const ring = document.createElement('div');
                ring.className = 'highlight-ring';
                targetEl.appendChild(ring);
            }
        } else {
            // 步驟結束：解鎖全部
            cells.forEach(el => el.classList.remove('locked'));
            document.querySelectorAll('.highlight-ring').forEach(el => el.remove());
            document.getElementById('hint-text').innerText = "🎯 教學指引完成！推理並找出剩下的所有牛，完成關卡！";
        }
    }

    // === 交互事件處理 ===
    function handleSlideInteraction(r, c) {
        const cell = gridData[r][c];
        const cellEl = document.querySelector(`.cell[data-r='${r}'][data-c='${c}']`);
        if (!cellEl || isGameLocked || isProcessing) return;

        // 連續打叉功能：如果是空格則打叉，是叉則清除，是牛則跳過
        if (cell.state === STATE.EMPTY) {
            cell.state = STATE.CROSS;
            cellEl.dataset.state = 'CROSS';
        } else if (cell.state === STATE.CROSS) {
            cell.state = STATE.EMPTY;
            cellEl.dataset.state = 'EMPTY';
        }
        updateUI();
    }

    function handleInteraction(r, c, type) {
        const cell = gridData[r][c];
        const cellEl = document.querySelector(`.cell[data-r='${r}'][data-c='${c}']`);

        // 教學強制擋住：必須先過引導。
        if (currentStep < stepInstructions.length) {
            const target = stepInstructions[currentStep];
            if (r !== target.r || c !== target.c) {
                showToast("👆 請先點擊藍色高亮的格子操作！");
                return;
            }
            // 檢查正確動作
            let success = false;
            if (target.type === 'COW' && type === 'DOUBLE' && cell.state === STATE.COW) success = true;
            if (target.type === 'CROSS' && type === 'SINGLE' && cell.state === STATE.CROSS) success = true;

            if (success) {
                isProcessing = true;
                document.getElementById('hint-text').innerText = "✅ 做得很好！";
                setTimeout(() => {
                    isProcessing = false;
                    currentStep++;
                    applyStepLock(); // 進入下一步或解鎖全盤
                }, 600);
            } else {
                // 操作不匹配
                showToast(target.type === 'COW' ? "💡 這一步需要【双击】放牛喔！" : "💡 這一步需要【单击】打叉喔！");
            }
            return; // 結束教學處理
        }

        // ---- 自由遊戲階段邏輯 ----
        if (type === 'SINGLE') {
            if (cell.state === STATE.EMPTY) {
                cell.state = STATE.CROSS; cellEl.dataset.state = 'CROSS';
            } else if (cell.state === STATE.CROSS) {
                cell.state = STATE.EMPTY; cellEl.dataset.state = 'EMPTY';
            } else {
                showToast("🐮 示範牛身上不能打叉，試試其他地方。");
            }
        } else if (type === 'DOUBLE') {
            if (cell.state === STATE.EMPTY) {
                // 重要：如果有示範牛鎖定，防止玩家誤放。但代碼允許
                if (checkConflict(r, c)) {
                    loseLife("❌ 規則衝突！消耗 1 顆愛心");
                    return;
                }
                cell.state = STATE.COW; cellEl.dataset.state = 'COW';
            } else if (cell.state === STATE.COW) {
                // 如果玩家想取消自己的牛
                cell.state = STATE.EMPTY; cellEl.dataset.state = 'EMPTY';
            } else {
                showToast("❌ 已打叉，不能放牛，先點擊叉取消吧！");
            }
        }
        updateUI();
        checkLevelComplete();
    }

    // === 規則與生命系統 ===
    function checkConflict(r, c) {
        const targetColor = gridData[r][c].color;
        for (let yy=0; yy<gridSize; yy++) {
            for (let xx=0; xx<gridSize; xx++) {
                const cell = gridData[yy][xx];
                if (cell.state === STATE.COW) {
                    if (xx === c || yy === r) return true;
                    if (cell.color === targetColor) return true;
                    if (Math.abs(xx-c) <= 1 && Math.abs(yy-r) <= 1) return true;
                }
            }
        }
        return false;
    }

    function loseLife(msg) {
        lives--;
        updateUI();
        showToast(msg);
        
        if (lives <= 0) {
            isGameLocked = true;
            setTimeout(() => {
                alert("💔 生命耗盡！關卡重置，重新開始推理！");
                initLevel(currentLevel); // 重置當前關卡
            }, 1500);
        }
    }

    // === 關卡完成檢測 ===
    function checkLevelComplete() {
        if (isLevelComplete) return;
        const cows = gridData.flat().filter(c => c.state === STATE.COW).length;
        if (cows === gridSize) {
            isLevelComplete = true;
            isGameLocked = true;
            document.getElementById('hint-te
