<style>
        /* Custom Styles & Animations */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* Prevent scroll on mobile during game */
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        .game-board {
            display: grid;
            gap: 2px;
            background-color: #333;
            border: 4px solid #444;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .cell {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .cell:active {
            transform: scale(0.95);
        }

        /* Color Regions */
        .color-0 { background-color: #fef08a; } /* Yellow */
        .color-1 { background-color: #bbf7d0; } /* Green */
        .color-2 { background-color: #bfdbfe; } /* Blue */
        .color-3 { background-color: #fbcfe8; } /* Pink */
        .color-4 { background-color: #e9d5ff; } /* Purple */
        .color-5 { background-color: #fed7aa; } /* Orange */
        .color-6 { background-color: #ccfbf1; } /* Light Green */
        .color-7 { background-color: #bae6fd; } /* Sky Blue */
        .color-8 { background-color: #fda4af; } /* Deep Pink */

        /* Markers */
        .mark-x {
            color: #ef4444;
            font-weight: bold;
            opacity: 0.8;
            pointer-events: none;
        }

        .mark-cow {
            color: #4b5563;
            font-size: 1.8rem;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .mark-error {
            color: #dc2626;
            font-size: 1.5rem;
            animation: shake 0.4s ease-in-out;
        }

        .locked {
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* Animations */
        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @keyframes flashHint {
            0% { box-shadow: inset 0 0 0 0 rgba(255, 255, 0, 0); }
            50% { box-shadow: inset 0 0 20px 5px rgba(255, 215, 0, 0.8); }
            100% { box-shadow: inset 0 0 0 0 rgba(255, 255, 0, 0); }
        }

        .highlight-hint {
            animation: flashHint 1s ease-in-out 2;
            z-index: 10;
        }

        /* UI Overlays */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            backdrop-filter: blur(5px);
        }

        .hidden {
            display: none !important;
        }

        .btn {
            transition: transform 0.1s, background-color 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>

<script>
        /**
         * Audio Controller
         * Uses Web Audio API to generate sounds without external files
         */
        const audio = {
            ctx: null,
            init: function() {
                window.AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();
            },
            playTone: function(freq, type, duration) {
                if (!this.ctx) this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            },
            playPlace: function() { this.playTone(600, 'sine', 0.1); },
            playCross: function() { this.playTone(300, 'triangle', 0.05); },
            playError: function() { 
                this.playTone(150, 'sawtooth', 0.3); 
                setTimeout(() => this.playTone(100, 'sawtooth', 0.3), 100);
            },
            playWin: function() {
                [523, 659, 783, 1046].forEach((f, i) => setTimeout(() => this.playTone(f, 'square', 0.2), i * 100));
            }
        };

        /**
         * Level Generator
         * Generates 100 levels procedurally
         */
        const levelGenerator = {
            levels: [],
            
            // Generate N contiguous color regions using a flood-fill like approach
            generateColorMap: function(size) {
                let map = [];
                let colors = size; // Number of colors equals grid size for logic
                for(let i=0; i<size; i++) {
                    map[i] = new Array(size).fill(-1);
                }
                
                // Simple region growing
                let regions = [];
                for(let c=0; c<colors; c++) {
                    // Pick random start point
                    let r = Math.floor(Math.random() * size);
                    let col = Math.floor(Math.random() * size);
                    if(map[r][col] === -1) {
                        map[r][col] = c;
                        regions.push({r, col, color: c});
                    } else {
                        // Find empty spot
                        let found = false;
                        for(let y=0; y<size; y++) {
                            for(let x=0; x<size; x++) {
                                if(map[y][x] === -1) {
                                    map[y][x] = c;
                                    regions.push({r:y, col:x, color:c});
                                    found = true;
                                    break;
                                }
                            }
                            if(found) break;
                        }
                    }
                }

                // Expand regions to fill grid
                let emptyExists = true;
                while(emptyExists) {
                    emptyExists = false;
                    for(let y=0; y<size; y++) {
                        for(let x=0; x<size; x++) {
                            if(map[y][x] === -1) {
                                emptyExists = true;
                                // Look at neighbors
                                let neighbors = [];
                                if(y>0) neighbors.push(map[y-1][x]);
                                if(y<size-1) neighbors.push(map[y+1][x]);
                                if(x>0) neighbors.push(map[y][x-1]);
                                if(x<size-1) neighbors.push(map[y][x+1]);
                                
                                // Pick a random assigned neighbor color
                                let validNeighbors = neighbors.filter(n => n !== -1);
                                if(validNeighbors.length > 0) {
                                    map[y][x] = validNeighbors[Math.floor(Math.random() * validNeighbors.length)];
                                } else {
                                    // Should not happen often if start points distributed, but fallback
                                    map[y][x] = Math.floor(Math.random() * colors);
                                }
                            }
                        }
                    }
                }
                return map;
            },

            // Backtracking solver to find valid cow positions
            solveBoard: function(size, colorMap) {
                let solution = new Array(size).fill(0).map(() => new Array(size).fill(false));
                
                // Helper to check placement validity
                const isValid = (r, c, currentBoard) => {
                    // Rule 2: Row/Col unique
                    for(let i=0; i<size; i++) {
                        if(i !== c && currentBoard[r][i]) return false;
                        if(i !== r && currentBoard[i][c]) return false;
                    }
                    // Rule 3: No adjacent
                    for(let dy=-1; dy<=1; dy++) {
                        for(let dx=-1; dx<=1; dx++) {
                            if(dx===0 && dy===0) continue;
                            let ny = r+dy, nx = c+dx;
                            if(ny>=0 && ny<size && nx>=0 && nx<size) {
                                if(currentBoard[ny][nx]) return false;
                            }
                        }
                    }
                    return true;
                };

                // Recursive solver
                const solve = (row) => {
                    if(row === size) return true;
                    
                    // Try placing cow in each column of this row
                    // We need exactly 1 cow per row
                    for(let col=0; col<size; col++) {
                        // Check Rule 1: Color uniqueness (preliminary check)
                        // We need to ensure we don't place 2 cows of same color
                        let color = colorMap[row][col];
                        let colorUsed = false;
                        
                        // Check previous rows for this color
                        for(let r=0; r<row; r++) {
                            for(let c=0; c<size; c++) {
                                if(solution[r][c] && colorMap[r][c] === color) {
                                    colorUsed = true;
                                    break;
                                }
                            }
                            if(colorUsed) break;
                        }
                        
                        if(colorUsed) continue;

                        if(isValid(row, col, solution)) {
                            solution[row][col] = true;
                            if(solve(row + 1)) return true;
                            solution[row][col] = false;
                        }
                    }
                    return false;
                };

                if(solve(0)) return solution;
                return null; // Unsolvable
            },

            generateAllLevels: function() {
                let count = 1;
                const configs = [
                    { size: 4, count: 20, diff: 1 },
                    { size: 5, count: 20, diff: 2 },
                    { size: 6, count: 20, diff: 3 },
                    { size: 7, count: 20, diff: 4 },
                    { size: 8, count: 10, diff: 5 },
                    { size: 9, count: 10, diff: 5 }
                ];

                configs.forEach(cfg => {
                    let generated = 0;
                    let attempts = 0;
                    while(generated < cfg.count && attempts < 1000) {
                        attempts++;
                        let colorMap = this.generateColorMap(cfg.size);
                        let solution = this.solveBoard(cfg.size, colorMap);
                        
                        if(solution) {
                            // Calculate cows remaining
                            let cows = cfg.size; 
                            // Generate initial clues (remove some cows)
                            // Simple logic: remove cows based on difficulty
                            // Diff 1: Keep 50% clues. Diff 5: Keep 10% clues.
                            let keepProb = 0.6 - (cfg.diff * 0.1); 
                            if(keepProb < 0.1) keepProb = 0.1;

                            let initialClues = [];
                            for(let r=0; r<cfg.size; r++) {
                                for(let c=0; c<cfg.size; c++) {
                                    if(solution[r][c] && Math.random() < keepProb) {
                                        initialClues.push({x: c, y: r});
                                    }
                                }
                            }
                            
                            // Ensure at least 1 clue for easy levels
                            if(cfg.diff === 1 && initialClues.length === 0 && solution[0][0]) {
                                initialClues.push({x:0, y:0});
                            }

                            this.levels.push({
                                id: count,
                                size: cfg.size,
                                colorMap: colorMap,
                                solution: solution,
                                initialClues: initialClues,
                                difficulty: cfg.diff,
                                cowsToFind: cfg.size
                            });
                            generated++;
                            count++;
                        }
                    }
                });
                console.log(`Generated ${this.levels.length} levels`);
            }
        };

        /**
         * Game Engine
         */
        const game = {
            currentLevelIdx: 0,
            lives: 3,
            timeLeft: 120,
            timerId: null,
            boardState: [], // { cow: bool, x: bool, locked: bool, isClue: bool }
            history: [],
            isDragging: false,
            lastTouch: null,
            clickTimeout: null,
            isLocked: false, // Input lock

            init: function() {
                levelGenerator.generateAllLevels();
                // Restore progress if needed (simplified here)
                this.currentLevelIdx = 0;
            },

            startGame: function() {
                document.getElementById('main-menu').classList.add('hidden');
                document.getElementById('game-screen').classList.remove('hidden');
                this.loadLevel(this.currentLevelIdx);
            },

            loadLevel: function(idx) {
                if(idx >= levelGenerator.levels.length) {
                    alert("恭喜！你已通過所有關卡！"); // Fallback
                    this.returnToMenu();
                    return;
                }

                const levelData = levelGenerator.levels[idx];
                this.lives = 3;
                this.timeLeft = 120;
                this.isLocked = false;
                this.history = [];
                
                // Initialize Board State
                this.boardState = [];
                for(let r=0; r<levelData.size; r++) {
                    let row = [];
                    for(let c=0; c<levelData.size; c++) {
                        let isClue = levelData.initialClues.some(clue => clue.x === c && clue.y === r);
                        row.push({
                            cow: isClue, // Clues are pre-placed cows
                            x: false,
                            locked: isClue,
                            isClue: isClue
                        });
                    }
                    this.boardState.push(row);
                }

                ui.updateHeader(levelData.id, this.lives, this.timeLeft, levelData.cowsToFind);
                ui.renderBoard(levelData);
                this.startTimer();
            },

            startTimer: function() {
                if(this.timerId) clearInterval(this.timerId);
                this.timerId = setInterval(() => {
                    if(this.isLocked) return;
                    this.timeLeft--;
                    ui.updateTimer(this.timeLeft);
                    if(this.timeLeft <= 0) {
                        this.gameOver();
                    }
                }, 1000);
            },

            handleInteraction: function(r, c, type) {
                if(this.isLocked) return;
                const cell = this.boardState[r][c];
                if(cell.locked) return;

                if(type === 'drag') {
                    // Toggle X
                    if(!cell.cow) {
                        this.saveHistory();
                        cell.x = !cell.x;
                        ui.updateCell(r, c);
                        if(cell.x) audio.playCross();
                    }
                } else if (type === 'click') {
                    // Wait for double click
                    if(this.clickTimeout) {
                        clearTimeout(this.clickTimeout);
                        this.clickTimeout = null;
                        this.placeCow(r, c);
                    } else {
                        this.clickTimeout = setTimeout(() => {
                            // Single click action (Toggle X)
                            if(!cell.cow) {
                                this.saveHistory();
                                cell.x = !cell.x;
                                ui.updateCell(r, c);
                                if(cell.x) audio.playCross();
                            }
                            this.clickTimeout = null;
                        }, 300);
                    }
                }
            },

            placeCow: function(r, c) {
                const level = levelGenerator.levels[this.currentLevelIdx];
                const cell = this.boardState[r][c];

                // Check correctness against solution
                if(level.solution[r][c]) {
                    // Correct
                    this.saveHistory();
                    cell.cow = true;
                    cell.x = false; // Remove X if present
                    audio.playPlace();
                    ui.updateCell(r, c);
                    this.checkWin();
                } else {
                    // Incorrect
                    this.saveHistory();
                    cell.locked = true; // Lock cell
                    cell.x = false;
                    cell.cow = false; // Don't show cow, show error
                    this.lives--;
                    audio.playError();
                    ui.showError(r, c);
                    ui.updateLives(this.lives);
                    
                    if(this.lives <= 0) {
                        this.gameOver();
                    }
                }
            },

            checkWin: function() {
                const level = levelGenerator.levels[this.currentLevelIdx];
                let cowsFound = 0;
                for(let r=0; r<level.size; r++) {
                    for(let c=0; c<level.size; c++) {
                        if(this.boardState[r][c].cow) cowsFound++;
                    }
                }

                ui.updateCowsRemaining(level.cowsToFind - cowsFound);

                if(cowsFound === level.cowsToFind) {
                    this.levelComplete();
                }
            },

            levelComplete: function() {
                this.isLocked = true;
                clearInterval(this.timerId);
                audio.playWin();
                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 }
                });
                setTimeout(() => {
                    document.getElementById('complete-level-num').innerText = this.currentLevelIdx + 1;
                    document.getElementById('level-complete-modal').classList.remove('hidden');
                }, 1000);
            },

            gameOver: function() {
                this.isLocked = true;
                clearInterval(this.timerId);
                document.getElementById('game-over-modal').classList.remove('hidden');
            },

            nextLevel: function() {
                document.getElementById('level-complete-modal').classList.add('hidden');
                this.currentLevelIdx++;
                this.loadLevel(this.currentLevelIdx);
            },

            restartLevel: function() {
                document.getElementById('game-over-modal').classList.add('hidden');
                this.loadLevel(this.currentLevelIdx);
            },

            resetLevel: function() {
                // Reload current level data
                this.loadLevel(this.currentLevelIdx);
            },

            returnToMenu: function() {
                clearInterval(this.timerId);
                document.getElementById('game-screen').classList.add('hidden');
                document.getElementById('game-over-modal').classList.add('hidden');
                document.getElementById('level-complete-modal').classList.add('hidden');
                document.getElementById('main-menu').classList.remove('hidden');
            },

            saveHistory: function() {
                // Deep copy board state
                const state = JSON.parse(JSON.stringify(this.boardState));
                this.history.push(state);
                if(this.history.length > 20) this.history.shift(); // Limit history
            },

            undo: function() {
                if(this.history.length === 0 || this.isLocked) return;
                const prevState = this.history.pop();
                this.boardState = prevState;
                
                // Re-render whole board to be safe
                const level = levelGenerator.levels[this.currentLevelIdx];
                ui.renderBoard(level);
                
                // Recalculate cows found
                let cowsFound = 0;
                for(let r=0; r<level.size; r++) {
                    for(let c=0; c<level.size; c++) {
                        if(this.boardState[r][c].cow) cowsFound++;
                    }
                }
                ui.updateCowsRemaining(level.cowsToFind - cowsFound);
            },

            useHint: function() {
                if(this.isLocked) return;
                const level = levelGenerator.levels[this.currentLevelIdx];
                
                // Find a correct cow that hasn't been placed yet
                let candidates = [];
                for(let r=0; r<level.size; r++) {
                    for(let c=0; c<level.size; c++) {
                        if(level.solution[r][c] && !this.boardState[r][c].cow && !this.boardState[r][c].locked) {
                            candidates.push({r, c});
                        }
                    }
                }

                if(candidates.length > 0) {
                    const hint = candidates[Math.floor(Math.random() * candidates.length)];
                    ui.highlightHint(hint.r, hint.c);
                }
            }
        };

        /**
         * UI Controller
         */
        const ui = {
            boardEl: document.getElementById('game-board'),

            updateHeader: function(lvl, lives, time, cowsTotal) {
                document.getElementById('level-display').innerText = lvl;
                this.updateLives(lives);
                this.updateTimer(time);
                this.updateCowsRemaining(cowsTotal);
            },

            updateLives: function(lives) {
                let html = '';
                for(let i=0; i<3; i++) {
                    if(i < lives) html += '<i class="fas fa-heart"></i>';
                    else html += '<i class="far fa-heart text-gray-600"></i>';
                }
                document.getElementById('lives-display').innerHTML = html;
            },

            updateTimer: function(seconds) {
                const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                const s = (seconds % 60).toString().padStart(2, '0');
                const el = document.getElementById('timer-display');
                el.innerText = `${m}:${s}`;
                if(seconds <= 10) el.classList.add('text-red-500');
                else el.classList.remove('text-red-500');
            },

            updateCowsRemaining: function(count) {
                document.getElementById('cows-remaining').innerText = count;
            },

            renderBoard: function(levelData) {
                this.boardEl.innerHTML = '';
                const size = levelData.size;
                
                // Set grid template
                this.boardEl.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
                this.boardEl.style.gridTemplateRows = `repeat(${size}, 1fr)`;
                
                // Calculate cell size dynamically to fit screen
                // Using vmin for responsiveness
                const cellSize = Math.min(80, 600 / size); 
                
                for(let r=0; r<size; r++) {
                    for(let c=0; c<size; c++) {
                        const cellData = game.boardState[r][c];
                        const colorIdx = levelData.colorMap[r][c];
                        
                        const cellEl = document.createElement('div');
                        cellEl.className = `cell color-${colorIdx}`;
                        cellEl.dataset.r = r;
                        cellEl.dataset.c = c;
                        cellEl.style.width = `${cellSize}px`;
                        cellEl.style.height = `${cellSize}px`;
                        cellEl.style.fontSize = `${cellSize * 0.5}px`;

                        // Initial Content
                        if(cellData.cow) {
                            cellEl.innerHTML = '<i class="fas fa-cow mark-cow"></i>';
                        } else if (cellData.locked && !cellData.cow) {
                            // Error state
                            cellEl.innerHTML = '<span class="mark-error">💔</span>';
                            cellEl.classList.add('locked');
                        } else if (cellData.x) {
                            cellEl.innerHTML = '<i class="fas fa-times mark-x"></i>';
                        }

                        // Events
                        this.attachEvents(cellEl);
                        
                        this.boardEl.appendChild(cellEl);
                    }
                }
            },

            attachEvents: function(el) {
                // Touch events for swipe
                el.addEventListener('touchstart', (e) => {
                    e.preventDefault(); // prevent scroll
                    game.isDragging = true;
                    game.lastTouch = { r: parseInt(el.dataset.r), c: parseInt(el.dataset.c) };
                    game.handleInteraction(parseInt(el.dataset.r), parseInt(el.dataset.c), 'click');
                }, {passive: false});

                el.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    if(!game.isDragging) return;
                    
                    const touch = e.touches[0];
                    const target = document.elementFromPoint(touch.clientX, touch.clientY);
                    if(target && target.classList.contains('cell')) {
                        const r = parseInt(target.dataset.r);
                        const c = parseInt(target.dataset.c);
                        
                        // Only trigger if moved to new cell
                        if(game.lastTouch.r !== r || game.lastTouch.c !== c) {
                            game.handleInteraction(r, c, 'drag');
                            game.lastTouch = {r, c};
                        }
                    }
                }, {passive: false});

                el.addEventListener('touchend', () => {
                    game.isDragging = false;
                });

                // Mouse events (fallback for desktop)
                el.addEventListener('mousedown', (e) => {
                    game.isDragging = true;
                    game.handleInteraction(parseInt(el.dataset.r), parseInt(el.dataset.c), 'click');
                });
                
                el.addEventListener('mouseenter', () => {
                    if(game.isDragging) {
                        game.handleInteraction(parseInt(el.dataset.r), parseInt(el.dataset.c), 'drag');
                    }
                });

                document.addEventListener('mouseup', () => {
                    game.isDragging = false;
                });
            },

            updateCell: function(r, c) {
                // Find specific cell DOM element
                const index = r * levelGenerator.levels[game.currentLevelIdx].size + c;
                const cellEl = this.boardEl.children[index];
                const cellData = game.boardState[r][c];

                cellEl.innerHTML = '';
                if(cellData.cow) {
                    cellEl.innerHTML = '<i class="fas fa-cow mark-cow"></i>';
                } else if (cellData.x) {
                    cellEl.innerHTML = '<i class="fas fa-times mark-x"></i>';
                }
            },

            showError: function(r, c) {
                const index = r * levelGenerator.levels[game.currentLevelIdx].size + c;
                const cellEl = this.boardEl.children[index];
                cellEl.innerHTML = '<span class="mark-error">💔</span>';
                cellEl.classList.add('locked');
            },

            highlightHint: function(r, c) {
                const index = r * levelGenerator.levels[game.currentLevelIdx].size + c;
                const cellEl = this.boardEl.children[index];
                cellEl.classList.add('highlight-hint');
                setTimeout(() => {
                    cellEl.classList.remove('highlight-hint');
                }, 2000);
            },

            showRules: function() {
                document.getElementById('rules-modal').classList.remove('hidden');
            },

            hideRules: function() {
                document.getElementById('rules-modal').classList.add('hidden');
            }
        };

        // Initialize Game
        window.onload = function() {
            game.init();
        };

    </script>
</body>
</html>
