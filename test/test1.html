<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>极简科技感 Hero</title>
  <style>
    /* 全局重置与背景 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background-color: #020617; 
      font-family: system-ui, -apple-system, sans-serif;
      color: white;
    }

    /* Hero 容器 */
    .hero {
      position: relative;
      min-height: 100vh;
      width: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 1rem;
    }

    /* 1. 背景动效：缓慢流动的极光渐变 */
    .aurora-bg {
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 125%; height: 125%;
      opacity: 0.7;
      filter: blur(100px);
      background: radial-gradient(circle at 50% 0%, #13FFAA 0%, #020617 50%);
      animation: aurora 10s ease-in-out infinite;
      z-index: 0;
      pointer-events: none;
    }

    /* 2. 核心内容区 */
    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      max-width: 800px;
    }

    /* 标题：流光渐变 + 向上浮动淡入 */
    .title {
      font-size: clamp(2.5rem, 5vw, 4.5rem);
      font-weight: bold;
      line-height: 1.2;
      margin-bottom: 1.5rem;
      
      /* 流光文字效果 */
      background: linear-gradient(to right, #13FFAA, white, #13FFAA);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      
      /* 入场动画 */
      animation: fadeUp 0.8s ease-out forwards, gradientText 5s ease infinite;
    }

    /* 描述文字：延迟入场 */
    .desc {
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: #cbd5e1;
      margin-bottom: 2.5rem;
      opacity: 0; /* 初始隐藏 */
      animation: fadeUp 0.8s ease-out 0.2s forwards;
    }

    /* 3. CTA 按钮：悬停发光与上浮 */
    .cta-btn {
      position: relative;
      display: inline-block;
      padding: 1rem 2rem;
      border-radius: 9999px;
      background-color: #13FFAA;
      color: #000;
      font-size: 1.125rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      overflow: hidden;
      
      /* 丝滑过渡 */
      transition: all 0.3s ease;
      opacity: 0; /* 初始隐藏 */
      animation: fadeUp 0.8s ease-out 0.4s forwards;
    }

    /* 按钮悬停反馈 */
    .cta-btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 20px rgba(19, 255, 170, 0.6);
    }
    .cta-btn:active {
      transform: translateY(0);
    }

    /* 按钮内部遮罩（增强质感） */
    .cta-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .cta-btn:hover::after {
      opacity: 0.2;
    }

    /* 关键帧动画定义 */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes aurora {
      0%, 100% { transform: translateX(-50%) translateY(-10%) scale(1); }
      50% { transform: translateX(-50%) translateY(-20%) scale(1.1); }
    }
    @keyframes gradientText {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>
<body>

  <section class="hero">
    <!-- 极光背景 -->
    <div class="aurora-bg"></div>

    <!-- 核心内容 -->
    <div class="content">
      <h1 class="title">极简科技感 重新定义未来交互</h1>
      <p class="desc">告别繁琐，拥抱纯粹。通过极致的视觉呈现与丝滑的动效反馈，为您的产品注入生命力。</p>
      <button class="cta-btn">立即体验</button>
    </div>
  </section>

</body>
</html>
